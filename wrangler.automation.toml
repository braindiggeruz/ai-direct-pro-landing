# Local deployment descriptor for the first-party automation Worker.
# This file prepares bindings only; no queue, Worker, secret or cron was
# created or changed by this repository task.
name = "gptbot-automation"
main = "workers/automation-worker.ts"
compatibility_date = "2026-07-28"
# No public HTTP surface: the Worker is driven by its cron trigger and its
# Queue consumer only, and Pages produces straight onto the Queue binding.
workers_dev = false

# No [limits] block: `cpu_ms` is a paid-plan-only field and the account this
# Worker is deployed to is on the Workers Free plan, which rejects the whole
# upload (API error 100328) when it is present. The consumer's work is
# I/O-bound (D1 and HTTPS), so the default CPU allowance is sufficient.

[[d1_databases]]
binding = "GPTBOT_DRAFTS_DB"
database_name = "gptbot-ai-drafts"
database_id = "97ef0372-d937-406f-8871-755368d9afff"

[[queues.producers]]
binding = "AUTOMATION_QUEUE"
queue = "gptbot-automation"

[[queues.producers]]
binding = "AUTOMATION_DLQ"
queue = "gptbot-automation-dlq"

[[queues.consumers]]
queue = "gptbot-automation"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "gptbot-automation-dlq"

[triggers]
crons = ["*/15 * * * *"]

# First-party automation is the sole production automation path as of R0.4.
# The Worker fails closed when this is absent or not exactly "true": the cron
# returns immediately and every queue message is retried rather than processed.
[vars]
FIRST_PARTY_AUTOMATION_ENABLED = "true"
