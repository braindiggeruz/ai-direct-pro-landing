name = "gptbot-lead-radar-telegram-account"
main = "index.ts"
compatibility_date = "2026-08-25"
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = false

# This Worker intentionally has no route and no workers.dev hostname. The only
# caller is the existing automation Worker through a private service binding.

[[durable_objects.bindings]]
name = "TELEGRAM_ACCOUNTS"
class_name = "LeadRadarTelegramAccount"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LeadRadarTelegramAccount"]

[[containers]]
class_name = "LeadRadarTelegramAccount"
image = "./container/Dockerfile"
max_instances = 5

[[r2_buckets]]
binding = "TELEGRAM_SESSION_BUCKET"
bucket_name = "gptbot-lead-radar-telegram-sessions"

[vars]
LEAD_RADAR_TELEGRAM_ACCOUNT_KEY_VERSION = "v1"
LEAD_RADAR_TELEGRAM_TDLIB_SOURCE_COMMIT = "d1085f9cebc5a62379991ae1652673954f229c1f"
LEAD_RADAR_TELEGRAM_GATEWAY_VERSION = "1.0.0"

# Secrets are provisioned through Cloudflare controls only:
# LEAD_RADAR_TELEGRAM_API_ID
# LEAD_RADAR_TELEGRAM_API_HASH
# LEAD_RADAR_TELEGRAM_ACCOUNT_DATA_KEY
# LEAD_RADAR_TELEGRAM_ACCOUNT_ROUTING_KEY (stable; independent of key rotation)
# LEAD_RADAR_TELEGRAM_ACCOUNT_PREVIOUS_DATA_KEYS (optional JSON keyring)
