[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "gptbot-lead-radar-telegram-bridge"
version = "1.4.0"
description = "Outbound-only Windows Telegram user-account bridge for Lead Radar"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography==45.0.7",
  "Pillow==11.3.0",
  "qrcode==8.2",
  "Telethon==1.44.0",
]

[project.scripts]
leadradar-telegram-bridge = "lead_radar_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lead_radar_bridge*"]
