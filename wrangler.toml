# wrangler config for Cloudflare Pages (`ai-direct-pro-landing`).
#
# THIS FILE IS AUTHORITATIVE, not documentation. `wrangler pages deploy`
# replaces the project's binding and plain-text-variable configuration with
# whatever is declared here, so a binding that exists only in the Cloudflare
# dashboard is DELETED by the next deploy. That is how the LOGIN_ATTEMPTS KV
# binding kept disappearing before R0.4: it was set in the dashboard, and the
# next direct-upload deploy silently dropped it, leaving the admin login
# lockout on its in-isolate fallback with no durable store.
#
# Rule: every non-secret binding and variable production needs must be
# declared in this file. Cloudflare Pages *secrets* (secret_text) are not
# managed by wrangler and survive a deploy untouched, so they stay in the
# dashboard.
#
# Secrets (NEVER committed; Cloudflare Pages -> Settings -> Env vars):
#   JWT_SECRET, GITHUB_TOKEN, ADMIN_PASSWORD_HASH, ADMIN_EMAIL, CRON_SECRET,
#   OPENROUTER_API_KEY, GEMINI_API_KEY, GROQ_API_KEY, MISTRAL_API_KEY,
#   CEREBRAS_API_KEY, SERPER_API_KEY, YANDEX_SEARCH_API_KEY, INDEXNOW_KEY,
#   GSC_CLIENT_ID, GSC_CLIENT_SECRET, GSC_REFRESH_TOKEN,
#   TELEGRAM_AGENTS_BOT_TOKEN, TELEGRAM_AGENTS_WEBHOOK_SECRET,
#   MARKET_MINI_APP_SESSION_SECRET, TWOGIS_API_KEY, and the
#   existing product-specific TELEGRAM_* secrets. Lead Radar also requires
#   LEAD_RADAR_TELEGRAM_INTERNAL_SERVICE_TOKEN on Pages and on the gateway;
#   it is never a plain-text [vars] value and is unrelated to Bridge/device keys.
#   TWOGIS_API_KEY is optional. When it is absent, Lead Radar discovery runs
#   OpenStreetMap only; when it is present it must stay secret_text, because the
#   2GIS Places API carries the key in the request query string.
#   BUNZY_WEBHOOK_SECRET is the HMAC signing secret generated by Bunzy after
#   the webhook endpoint is registered; it must also remain secret_text.
#   GPT_NOTIFY_BOT_TOKEN and GPT_NOTIFY_CHAT_ID deliver the AI chat's lead
#   alerts to the owner. Both optional: unset they fall back to
#   TELEGRAM_ASSISTANT_BOT_TOKEN / TELEGRAM_ADMIN_CHAT_ID, and with neither
#   pair present the lead is still stored and the send is skipped.
#   ZAI_API_KEY is the Z.ai (api.z.ai) pay-as-you-go key for the web chat's
#   optional second provider. Optional: unset, the chat never calls Z.ai even
#   when GPT_MODEL_PROVIDER = "zai". Never a plain-text var.
#   UZUM_CREDENTIALS_JSON packs the Uzum Checkout terminal id/API key, the
#   Merchant API service id/login/password and the Fiscalization API key for
#   test and live in ONE secret (it saves Workers Free bindings); format in
#   docs/paid-chat/UZUM-RU.md.
#   GPT_CLICK_CREDENTIALS_JSON packs Click's service_id, merchant_id,
#   secret_key and merchant_user_id for test and live in ONE secret, the same
#   way: {"test":{...},"live":{...}}. While it is unset the legacy GPT_CLICK_*
#   variables are read instead (functions/lib/gpt-chat/billing-config.ts).
#   GPT_IDENTITY_SECRET (at least 32 random characters) signs the AI chat's
#   account pseudonyms and the dark-rehearsal cookie.
#   GPT_BILLING_MAINTENANCE_SECRET is the bearer of the internal AI-chat
#   endpoints (/api/internal/gpt-billing-maintenance and the refund routes).
#   The automation Worker holds the same value as its own secret; without it
#   the maintenance cron (model check, silence watchdog, owner alerts) is off.
#   Runbook: docs/paid-chat/ALERTS-RU.md.
#
# CRON_SECRET must match the GitHub Actions repository secret used by
# .github/workflows/search-pulse-daily.yml.

name = "ai-direct-pro-landing"
compatibility_date = "2024-09-23"
# enable_request_signal: request.signal of an incoming request aborts when the
# client disconnects. Only the AI chat reads it (functions/api/gpt/chat.ts):
# Stop or a closed tab ends the model call and settles the turn as client_gone.
# It is project-wide; no other Function reads the incoming signal, and it is
# not passed on to subrequests (that would be request_signal_passthrough).
compatibility_flags = ["global_fetch_strictly_public", "enable_request_signal"]
pages_build_output_dir = "dist"

# Run the Functions Worker next to D1 instead of next to the shopper.
#
# The database is in ENAM (measured: served_by_colo ORD). A buyer in Tashkent
# reaches an edge data centre in milliseconds, but every D1 query from there is
# a trans-continental round trip of roughly a quarter second — and one Bormi
# launch used to make three of them in sequence (identity, storefront binding,
# then the catalog), because each one needed the answer of the one before it.
# That was close to a second of pure travel before the storefront could render.
#
# The catalog read no longer waits: which storefront a fresh launch lands on
# depends on the bot rather than on the person, so it and its shelf are read
# alongside the identity and used when the binding confirms the same store. Two
# dependent D1 round trips remain — the binding genuinely needs the identity.
#
# Smart Placement inverts the geometry: the request crosses the ocean once, the
# remaining dependent queries then run beside the database. Static assets and the
# prerendered pages are served from the edge either way — they never enter the
# Worker — so this only moves the API path, which is exactly the part that was
# waiting on D1.
[placement]
mode = "smart"

[[d1_databases]]
binding = "GPTBOT_DRAFTS_DB"
database_name = "gptbot-ai-drafts"
database_id = "97ef0372-d937-406f-8871-755368d9afff"

# Durable store for the admin login lockout (5 failures / 15 min per IP+email).
# Without this binding functions/lib/lockout.ts silently falls back to an
# in-isolate Map, which resets on every cold start and is not shared between
# isolates, so the lockout degrades to best-effort instead of enforced.
[[kv_namespaces]]
binding = "LOGIN_ATTEMPTS"
id = "c5e30ccbfcbe43f0b22a027b38c225f4"

# Seller-uploaded product images for Bormi.
#
# Product photos existed only as Telegram file ids, so a seller could not attach
# one without leaving the cabinet for the bot. Objects are keyed
# `market/<orgId>/<storeId>/<id>` and served only through the signed media
# handle, with the same private, noindex, sandboxed headers as the Telegram
# proxy — the bucket has no public URL.
[[r2_buckets]]
binding = "MARKET_MEDIA"
bucket_name = "bormi-market-media"

# Private Lead Radar campaign images. No public/custom domain is permitted;
# Pages uploads and the automation Worker read objects only through this binding.
# Declared here as well as on the Lead Radar branch: both branches deploy to the
# same Pages project, and whichever deploys last defines production. A binding
# that exists in only one of them is silently deleted by the other one shipping.
[[r2_buckets]]
binding = "LEAD_RADAR_CAMPAIGN_MEDIA"
bucket_name = "gptbot-lead-radar-campaign-media"

# Workers-Free Telegram gateway. The gateway exposes only HMAC-authenticated
# local-Bridge routes publicly; Pages reaches account control through this
# Service Binding and an independent secret bearer.
[[services]]
binding = "LEAD_RADAR_TELEGRAM_ACCOUNT_SERVICE"
service = "gptbot-lead-radar-telegram-account"


# Workers AI binding (Cloudflare Pages Functions).
# Powers the direct-AI SEO Autopilot generator. The binding name "AI"
# is referenced via env.AI.run(model, …) in
# functions/lib/seo-autopilot/direct-generator.ts.
[ai]
binding = "AI"

# Producer binding for first-party orchestration. The gptbot-automation Worker
# is the consumer; messages carry job references only, never prompts, content or
# secrets.
[[queues.producers]]
binding = "AUTOMATION_QUEUE"
queue = "gptbot-automation"

# First-party automation is the sole production automation path as of R0.4.
# Pages reads this to decide whether the owner-only replay endpoint and the
# automation status surfaces are live; the Worker reads its own copy from
# wrangler.automation.toml. Both fail closed when it is not exactly "true".
