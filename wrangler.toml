MARKET_MINI_APP_SELLER_READS_ENABLED":"true","MARKET_MINI_APP_SELLER_COMMANDS_ENABLED":"true","MARKET_MINI_APP_ORIGINS":"https://gptbot-market-mini-app.pages.dev","MARKET_MINI_APP_URL":"https://gptbot-market-mini-app.pages.dev","MARKET_MINI_APP_BUILD_ID":"bormi-public-beta-20260804-cabinet","MARKET_VOICE_SEARCH_ENABLED":"true","MARKET_AI_SEARCH_ENABLED":"true","MARKET_SELLER_MEDIA_UPLOAD_ENABLED":"true","MARKET_CABINET_ENABLED":"true","MARKET_CABINET_HOME_V2":"true","MARKET_NAV_BACK_ENABLED":"true","MARKET_QUICKPOST_ENABLED":"false","MARKET_QUICKPOST_AI_ENABLED":"false","MARKET_CLASSIFIEDS_DISCOVERY_ENABLED":"true","MARKET_PRIVATE_LISTING_ENABLED":"true","MARKET_OWNER_TELEGRAM_BINDING_ENABLED":"false","BORMI_ADMIN_V2_ENABLED":"true","GPT_MODEL_PROVIDER":"zai","GPT_ZAI_EVAL_APPROVED":"2026-10-03","ZAI_MODEL_FREE":"glm-5.3-flash","ZAI_MODEL_PAID":"glm-5.3-flash","ZAI_TIERS":"free,paid","ZAI_PREPAID_MODELS":"glm-5.3-flash","ZAI_TIMEOUT_MS":"12000","UZUM_API":"","UZUM_CHECKOUT_BASE_URL":"","UZUM_CHECKOUT_TEST_BASE_URL":"https://test-chk-api.uzumcheckout.uz","UZUM_AUTOFISCAL":"false","UZUM_FISCAL_BASE_URL":"https://ofd-key.inplat-tech.com","UZUM_FISCAL_TEST_BASE_URL":"https://test-ofd.ipt-merch.com","GPT_PAYMENT_PROVIDERS":"click,uzum,payme","GPT_BILLING_MODE":"","GPT_BILLING_MODE_CLICK":"live","GPT_BILLING_MODE_UZUM":"","GPT_BILLING_MODE_PAYME":"test","GPT_BILLING_LIVE_READY":"true","GPT_BILLING_TERMS_RU":"https://gptbot.uz/ru/oferta/","GPT_BILLING_TERMS_UZ":"https://gptbot.uz/uz/oferta/","GPT_BILLING_TERMS_VERSION":"ai-paket-2026-10-v2","GPT_BILLING_TERMS_APPROVED_AT":"2026-10-03","GPT_GUEST_CHECKOUT":"false","GPT_FISCAL_IKPU":"10305008002000000","GPT_FISCAL_PACKAGE_CODE":"1514296","GPT_FISCAL_VAT_PERCENT":"12","GPT_FISCAL_TIN":"310618348","GPT_CLICK_AUTOFISCAL":"","GPT_CLICK_FISCAL_SUBMIT_DELAY_MINUTES":"10","GPT_BOT_HANDOFF_ENABLED":"false","GPT_BOT_LOGIN_MODE":"pick","GPT_ALERTS_ENABLED":"true","GPT_ALERTS_MAX_PER_HOUR":"6","GPT_WATCHDOG_WINDOW_MINUTES":"180","GPT_WATCHDOG_MIN_TURNS":"3","GPT_HASH_SALT_SINCE":"2026-10-02T00:00:00Z","GPT_MESSAGES_RETENTION_DAYS":"","TELEGRAM_FREE_DAILY_LIMIT":"10","TELEGRAM_FREE_MONTHLY_LIMIT":"100","TELEGRAM_ASSISTANT_BOT_USERNAME":"gptbotuz_bot"}'''

# Wrangler understands the nested object below for local typing and future
# runtimes. Pages Direct Upload currently persists the text binding above; the
# parity test pins both representations byte-for-byte so they cannot drift.
[vars.GPTBOT_RUNTIME_CONFIG]
# Owner-authorized AEO release: explicit free-only model comparison, no web search.
# The retired MiniMax M3 ':free' slug left the list on 2026-09-30 (0 endpoints).
AEO_MEASUREMENTS_ENABLED = "true"
AEO_MEASUREMENT_MODELS = "nvidia/nemotron-3-super-120b-a12b:free,dots-studio/dots-3-note-preview:free"
FIRST_PARTY_AUTOMATION_ENABLED = "true"
BUNZY_DEFAULT_LOCALE = "ru"

# ── Consumer AI chat (OpenRouter) ───────────────────────────────────────────
# The model chain behind the free AI chat — the one /uz/gpt-uzbek-tilida/ and
# the Russian landing pages promise, and the one nearly all of the incoming
# Uzbek search traffic arrives for.
#
# These belong in this file for the reason stated at the top of it. Until
# 2026-09-04 there were no OPENROUTER_MODEL_* vars here at all, so the code
# defaults in functions/lib/gpt-chat/config.ts WERE production; they had been
# pinned on 2026-07-11 to three free slugs OpenRouter has since retired, and
# every chat request answered {"ok":false,"code":"provider_error"}. Setting a
# model in the Cloudflare dashboard would not have fixed it either — a Pages
# deploy replaces the plain-text variable set wholesale, so a dashboard value
# survives until the next deploy and then reverts to the code default with no
# error and nothing in the diff to look at.
#
# So the two places must agree. tests/openrouter-model-catalogue.test.ts fails
# when they drift apart, and fails again when any slug named here stops being
# served by https://openrouter.ai/api/v1/models.
#
# The free chain is three DISTINCT vendors on three different stacks, so no
# single vendor outage can empty it. Fallbacks are comma-separated, in order.
# The paid chain ends in a ':free' model, so a paid turn still gets an answer
# when the OpenRouter credits run out. Why each model: the comment above the
# defaults in config.ts (chains of 2026-09-30).
OPENROUTER_MODEL_FREE = "nvidia/nemotron-3-super-120b-a12b:free"
OPENROUTER_MODEL_FREE_FALLBACKS = "dots-studio/dots-3-note-preview:free,google/gemma-4-31b-it:free"
OPENROUTER_MODEL_PAID = "google/gemma-4-26b-a4b-it"
OPENROUTER_MODEL_PAID_FALLBACKS = "mistralai/mistral-small-3.2-24b-instruct,google/gemma-4-31b-it:free"

# ── Consumer AI chat: model runtime ──────────────────────────────────────────
# GPT_MAX_OUTPUT_TOKENS: max_tokens of one answer (clamped 400..4000; was a
# hard-coded 900). GPT_FIRST_CONTENT_TIMEOUT_MS: how long one OpenRouter
# attempt may wait for its first streamed content (clamped 5000..20000).
# GPT_FREE_TIER_PAID_PRIMARY puts the paid primary in front of the free chain
# under a daily budget of GPT_FREE_PAID_DAILY_USD (clamped 0..20; 0 = never):
# each paid attempt pre-reserves its worst case, and a spent budget skips to
# ':free' (functions/lib/gpt-chat/model-spend-store.ts). It stays "false" until
# the model probe (POST /api/internal/gpt-model-probe) has cleared the chain
# (release step R1.1, docs/paid-chat/MODELS-RU.md).
# GPT_STOP_CHARGE_MIN_CHARS: an answer the visitor stopped is charged only once
# this many characters reached them (clamped 0..20000; 0 = never). An answer
# cut at the length limit is never charged.
GPT_MAX_OUTPUT_TOKENS = "1600"
GPT_FIRST_CONTENT_TIMEOUT_MS = "12000"
GPT_FREE_TIER_PAID_PRIMARY = "false"
GPT_FREE_PAID_DAILY_USD = "1"
GPT_STOP_CHARGE_MIN_CHARS = "600"

# ── Chat → owner bridge ─────────────────────────────────────────────────────
# The AI chat has captured leads into gpt_leads since it shipped and notified
# nobody, so an enquiry left at 22:00 was found the next time somebody opened
# the database. These variables configure the two routes out of the chat: an
# alert to the owner's Telegram, and a deep link that lets a web conversation
# continue in the assistant bot with its own separate daily allowance.
#
# The two credentials are SECRETS and are deliberately not here — a plain-text
# var in this file is public in the deploy. Set them in
# Cloudflare Pages → Settings → Environment variables (type "Secret"):
#
#   GPT_NOTIFY_BOT_TOKEN   Bot API token of the bot that sends the alert.
#                          Unset → falls back to TELEGRAM_ASSISTANT_BOT_TOKEN.
#   GPT_NOTIFY_CHAT_ID     Chat id that receives it (the owner's own chat).
#                          Unset → falls back to TELEGRAM_ADMIN_CHAT_ID.
#
# With BOTH unset the endpoint logs once per isolate, skips the send, and still
# stores the lead and answers ok. A missing notification never costs a lead.
#
# The bot username is public configuration, not a secret. Keep this equal to
# the public fallback in src/lib/telegram.ts; tests pin the two sides so the
# website cannot mint a token for one bot and send the person to another.
GPT_HANDOFF_BOT_USERNAME = "gptbotuz_bot"
# Handoff link lifetime. Long enough that somebody without Telegram installed
# can come back to it; the token is single-use and opaque either way.
GPT_HANDOFF_TTL_MINUTES = "1440"
# Anti-abuse ceilings on the public POST surfaces. A real person leaves one
# contact; these are what make filing a thousand of them boring. Over the lead
# ceiling the endpoint refuses; over the handoff ceiling it still returns a
# working (contextless) link, because being rate-limited must not cut somebody
# off from the only route to a human.
GPT_LEAD_MAX_PER_HOUR = "5"
GPT_LEAD_MAX_PER_DAY = "20"
GPT_HANDOFF_MAX_PER_HOUR = "20"
GPT_LEAD_GLOBAL_MAX_PER_HOUR = "30"
GPT_HANDOFF_GLOBAL_MAX_PER_HOUR = "100"
GPT_LEAD_TURNSTILE_AFTER = "2"
# Global ceiling on owner alerts per hour, across all visitors combined. Past
# it the leads are still stored and the owner is told once that it went quiet.
GPT_OWNER_NOTIFY_MAX_PER_HOUR = "30"

# ── Lead Radar ──────────────────────────────────────────────────────────────
# This is the shared production configuration for SEO and Lead Radar. A Pages
# deploy replaces the complete var and binding sets, so every production build
# must retain this block even when its feature work is unrelated to Lead Radar.
LEAD_RADAR_ADMISSION_ENABLED = "true"
LEAD_RADAR_PROCESSING_ENABLED = "true"
# Acquisition-only local collector; still requires its exact schema and dedicated
# registered worker. Never grants Telegram verification or sending permission.
LEAD_RADAR_CRAWLER_ENABLED = "true"
# Personal-data switch. Enabled at the owner's decision (2026-09-01): this is
# the operator's own B2B prospecting tool and the pause was blocking all
# outreach. It unlocks `messageable`, contact actions and campaign sending.
# It does NOT relax who may be messaged — the fail-closed ownership and
# endpoint-type rules below still decide that, and the daily limits still apply.
LEAD_RADAR_CONTACT_ENABLED = "true"
LEAD_RADAR_TELEGRAM_DISCOVERY_ENABLED = "true"
LEAD_RADAR_TELEGRAM_TRANSPORT_MODE = "local_bridge"
# Account pairing is enabled for the owner canary, but all outbound gates remain
# independently fail-closed below.
LEAD_RADAR_TELEGRAM_ACCOUNT_ENABLED = "true"
LEAD_RADAR_TELEGRAM_CAMPAIGN_ENABLED = "true"
# Off since 2026-09-30 (paid-chat plan D12): the only paired sender is a live
# personal Telegram account, and with this on the Worker sends approved
# campaigns from it by itself. Campaigns can still be prepared and approved;
# the admin API refuses start/resume and the Worker sends none of them. Keep
# equal to wrangler.automation.toml, which is the copy the Worker reads —
# tests/pages-config-parity.test.ts pins both.
LEAD_RADAR_TELEGRAM_CAMPAIGN_AUTOSEND_ENABLED = "false"
LEAD_RADAR_PERSONAL_RETENTION_DAYS = "30"
LEAD_RADAR_ALLOWED_ORGS = "owner_8ee98dc3040f160b308166b0"
LEAD_RADAR_MAX_DISPATCH_PER_TICK = "5"
# ── Signal Radar ────────────────────────────────────────────────────────────
# Demand-side radar: watches Uzbek Telegram channels for incoming requests for
# digital services instead of cold-prospecting companies.
# The scout only reads public `t.me/s/<slug>` previews over HTTP — no Telegram
# API call, no join, no send, nothing a stranger can see. Safe to enable.
LEAD_RADAR_SIGNAL_ENABLED = "true"
# off | discover | channels | join. `discover` reads channels from the web and
# never touches the Telegram API. Groups are never joined in this mode: a
# public group has no web preview, so joining is the only way to read one, and
# that is the single most account-risky action in the product. Raising this to
# `join` is an explicit operator decision, not a deploy default.
LEAD_RADAR_SIGNAL_AUTOJOIN_MODE = "discover"
# tgstat country ranking crawl. Allowed by its robots.txt for User-agent: *.
# Set to "false" to keep only channels the operator added by hand.
LEAD_RADAR_SIGNAL_DISCOVERY_ENABLED = "true"
# Public username stays empty until the dedicated Business bot and its secret
# bindings are configured. Empty is a hard connection pause.
LEAD_RADAR_TELEGRAM_BOT_USERNAME = ""
LEAD_RADAR_CONTACT_DAILY_LIMIT = "10"
LEAD_RADAR_TELEGRAM_CAMPAIGN_DAILY_LIMIT = "30"
LEAD_RADAR_TELEGRAM_CAMPAIGN_MIN_INTERVAL_SECONDS = "120"
TELEGRAM_AGENTS_BOT_USERNAME = "BormiMarketBot"
MARKET_MINI_APP_ENABLED = "true"
MARKET_MINI_APP_BUYER_ENABLED = "true"
MARKET_MINI_APP_SELLER_READS_ENABLED = "true"
MARKET_MINI_APP_SELLER_COMMANDS_ENABLED = "true"
MARKET_MINI_APP_ORIGINS = "https://gptbot-market-mini-app.pages.dev"
MARKET_MINI_APP_URL = "https://gptbot-market-mini-app.pages.dev"
# Moves with the shell cache name in `apps/market-mini-app/public/sw.js`, the
# way 358a7b7 set it. The cabinet now prints this string back to the person as
# «Версия приложения», so a build id that did not move would report the release
# without the cabinet as though it were the one with it.
MARKET_MINI_APP_BUILD_ID = "bormi-public-beta-20260804-cabinet"
# Bormi voice search kill switch. Setting this to anything other than "true"
# makes /api/market/v1/voice/search answer 503 and makes the Mini App hide the
# microphone on the next launch; the typed search is unaffected either way.
# Speech recognition reuses the existing GROQ_API_KEY (and optional
# OPENAI_API_KEY) secrets — no new credential is required.
MARKET_VOICE_SEARCH_ENABLED = "true"
# Semantic search fallback. Search is grounded in the storefront's own words
# first; only when a sentence contains no catalog word at all is the model asked
# to map its meaning onto the same real terms, and its answer is intersected
# with them before anything is searched. Setting this to anything other than
# "true" skips the call and leaves the deterministic result untouched. Reuses
# the existing LLM credentials — no new secret.
MARKET_AI_SEARCH_ENABLED = "true"
# Seller photo upload kill switch. Fails closed twice over: anything other than
# "true" — or a missing MARKET_MEDIA binding — makes /seller/media answer 503 and
# makes the cabinet hide the picker rather than offer a control that cannot
# work. Photos already attached through the bot keep working either way.
MARKET_SELLER_MEDIA_UPLOAD_ENABLED = "true"
# Universal personal cabinet. Replaces the buyer's "Заказы" tab with a
# role-neutral "Кабинет" that holds the profile, the buyer's own requests and —
# only when the server already granted sellerRead — the seller workspace, so the
# store tools stop being reachable solely through a header toggle. It changes
# the shape of the shell and nothing else: no new read, no new command, no
# authority. Anything other than "true" keeps the previous four-tab layout with
# its own "Заказы" tab, so switching back is this line plus a root deploy — the
# static bundle carries both layouts and does not have to be rebuilt.
MARKET_CABINET_ENABLED = "true"
# The cabinet's own root screen. With the shell above already on, this decides
# whether opening "Кабинет" lands on the shipped settings list or on the screen
# that leads with what is actually waiting — an unfinished checkout, a question
# still open, the store's own exceptions — and only then lists what the person
# has. Same class of switch as the line above: a layout, never a permission. The
# static bundle carries both roots, so turning it off is this line plus a root
# deploy and no rebuild.
MARKET_CABINET_HOME_V2 = "true"
# The back-gesture spine (QP-0). Off, every back gesture closes the whole Mini
# App from any depth — a person three screens into the cabinet loses the screen
# and anything half-typed on it. On, a back gesture closes the newest open thing
# and only closes the app at the root, which is what a multi-step composer needs
# before it can exist. Navigation only: no read, no command, no authority. Both
# behaviours are in the static bundle, so turning it off is this line plus a
# root deploy.
MARKET_NAV_BACK_ENABLED = "true"
# QuickPost (QP-1A) — the composer a person selling one thing can finish. Off,
# "Продать" lands where it lands today: the seller cabinet's editor for someone
# who already has a store, the bot for everyone else. On, an owner whose commands
# the server has already granted composes the listing inside the Mini App.
#
# It selects a screen, never a permission. `sellerCommands` still decides whether
# anything may be created, and the server re-checks it on every command whatever
# this line says. Off is the shipped behaviour, and both are in the static
# bundle, so turning it on is this line plus a root deploy.
MARKET_QUICKPOST_ENABLED = "false"
# QuickPost's voice and AI lane. False for QP-1A: the composer is entirely
# manual, and nothing on that screen offers a control that cannot work yet.
MARKET_QUICKPOST_AI_ENABLED = "false"
# Global approved classifieds reads. The code and schema may be deployed while
# this stays false; a flag is a rollout switch, never authority.
MARKET_CLASSIFIEDS_DISCOVERY_ENABLED = "true"
# Private listing commands remain absent until Telegram authority and the
# native QuickPost ceremony pass. Discovery can be canaried independently.
MARKET_PRIVATE_LISTING_ENABLED = "true"
# The owner-assisted Telegram seller binding (AUTH-1). Off, both binding
# endpoints answer 404 as though they were never deployed, which is how this
# ships. On, it allows exactly two things: an authenticated platform_owner may
# mint one single-use challenge, and a Telegram identity that redeems it from a
# verified initData session gains an owner membership over the existing store.
#
# The flag opens a door and never walks through it. Turning it on grants nobody
# anything by itself: the challenge is minted only against a signed owner token
# and redeemed only from a session Telegram itself signed. Intended to be turned
# on for the length of one binding and turned off again.
MARKET_OWNER_TELEGRAM_BINDING_ENABLED = "false"
# Bormi Admin, the second-generation owner control centre. Off, the panel builds
# and deploys but refuses to render itself, and /admin-tools stays the way in.
#
# Presentation, and weaker than it looks on purpose. Every screen it draws reads
# an endpoint that `requirePlatformRole` guards exactly as it did before, so
# this line cannot grant a single thing a signed owner token does not already
# carry. Turning it on is this line plus a root deploy; turning it off is the
# rollback, and the previous panel never stopped working.
BORMI_ADMIN_V2_ENABLED = "true"

# ── Consumer AI chat: Z.ai as a second provider (web chat only) ─────────────
# Z.ai answers only when ALL THREE are true:
#   1. GPT_MODEL_PROVIDER = "zai" here AND in the packed
#      GPTBOT_RUNTIME_CONFIG_JSON line above (tests/runtime-config.test.ts
#      keeps the two identical), followed by a deploy;
#   2. GPT_ZAI_EVAL_APPROVED = the YYYY-MM-DD of the blind evaluation that
#      approved Z.ai (both places again); a committed date needs its report
#      docs/paid-chat/evals/zai-<date>.json, or tests fail;
#   3. the secret ZAI_API_KEY is set in Cloudflare Pages (never in this file).
# Then one Z.ai model goes in front of the OpenRouter chain and OpenRouter
# stays the fallback (Z.ai takes at most one of the three slots). Javob, the
# Telegram assistant, stays on OpenRouter either way. Switching off is
# GPT_MODEL_PROVIDER = "openrouter" in both places plus a deploy.
# The free tier accepts only $0 models (glm-4.7-flash, glm-4.5-flash); the paid
# tier only glm-4.7-flashx, glm-4.5-air, glm-4.7-flash, glm-4.5-flash. Either
# tier also accepts a prepaid-bundle model listed in ZAI_PREPAID_MODELS that the
# code knows works fast (ZAI_PREPAID_CAPABLE: glm-5.3-flash, sent with the
# lowest reasoning effort). Any other value is ignored and the chain stays
# OpenRouter.
# ZAI_TIERS lists the tiers that may use Z.ai; ZAI_TIMEOUT_MS is the per-attempt
# budget (clamped 3000..15000). Runbook: docs/paid-chat/ZAI-RU.md.
# ON since 2026-10-03 (owner directive; report docs/paid-chat/evals/zai-2026-10-03.json).
# Both tiers use glm-5.3-flash from the owner's prepaid "GLM-5.3-Flash Premium"
# usage bundle (ZAI_PREPAID_MODELS; 86.7M tokens left on 2026-10-03, valid to
# 2026-12-17). Pay-as-you-go models answer 1113 (no balance), and 1113 blocks
# every Z.ai model for 15 minutes, so none of them is configured.
GPT_MODEL_PROVIDER = "zai"
GPT_ZAI_EVAL_APPROVED = "2026-10-03"
ZAI_MODEL_FREE = "glm-5.3-flash"
ZAI_MODEL_PAID = "glm-5.3-flash"
ZAI_TIERS = "free,paid"
ZAI_PREPAID_MODELS = "glm-5.3-flash"
ZAI_TIMEOUT_MS = "12000"

# ── Consumer AI chat: Uzum Bank payments ──────────────────────────────────────
# OFF as committed (UZUM_API = ""). Uzum is reachable only when ALL are set:
#   1. UZUM_API = "checkout" (card page on the site) or "merchant" (payments
#      inside the Uzum Bank app) here AND in the packed JSON line above;
#   2. the secret UZUM_CREDENTIALS_JSON in Cloudflare Pages (never in this file);
#   3. for Checkout in live mode, UZUM_CHECKOUT_BASE_URL from the Uzum manager
#      (there is no production default; the test default below is UNVERIFIED);
#   4. a mode for Uzum (GPT_BILLING_MODE_UZUM, block below) and, for live, every
#      name liveReadiness() reports.
# UZUM_AUTOFISCAL = "true" only after Uzum enables auto-fiscalization on the
# terminal; the cart then carries the shared GPT_FISCAL_* values below. A live
# card sale needs it OR the Fiscalization API key (fiscal.live.apiKey in the
# secret), which every Merchant API sale needs: that API prints the receipts
# of every Uzum order registered without the cart. UZUM_FISCAL_BASE_URL and
# UZUM_FISCAL_TEST_BASE_URL are its hosts as the Uzum spec names them (empty
# falls back to the same). Runbook: docs/paid-chat/UZUM-RU.md.
UZUM_API = ""
UZUM_CHECKOUT_BASE_URL = ""
UZUM_CHECKOUT_TEST_BASE_URL = "https://test-chk-api.uzumcheckout.uz"
UZUM_AUTOFISCAL = "false"
UZUM_FISCAL_BASE_URL = "https://ofd-key.inplat-tech.com"
UZUM_FISCAL_TEST_BASE_URL = "https://test-ofd.ipt-merch.com"

# ── Consumer AI chat: payments of the AI pack (Click, Uzum, Payme) ──────────
# CLICK LIVE since 2026-10-05 (runbook docs/paid-chat/ONBOARDING-KEYS-RU.md,
# S2; owner's order of 2026-10-05: Click activated the live service, the
# lawyer approved both privacy policies the same day). Uzum stays off: its
# callback routes answer 404 before they read the request. Click is offered
# only while liveReadiness(click) is empty at runtime (its Pages secrets
# included); otherwise it fails closed and offers nothing.
# PAYME IN TEST since 2026-10-06 (owner's order; runbook
# docs/paid-chat/PAYME-RU.md): GPT_BILLING_MODE_PAYME = "test" opens
# /api/payments/payme to Payme's sandbox (test.paycom.uz, the Pages secret
# GPT_PAYME_TEST_KEY) and offers Payme in a rehearsal session only; normal
# visitors are offered Click alone. Live takes GPT_BILLING_MODE_PAYME = "live"
# (never the global fallback), Payme's approval of the sandbox and an offer
# edition that names Payme (the deploy gate refuses one that does not).
# Stop (both places, then a deploy): GPT_BILLING_LIVE_READY = "false" stops
# new sales, and Click's Prepare/Complete still settle invoices already open
# (they stay valid 12 h). GPT_BILLING_MODE_CLICK = "" is the hard stop: the
# callback route answers 404 too, so those invoices fail at Click; use it only
# when the callback itself must close (for example a leaked secret).
# GPT_PAYMENT_PROVIDERS lists the providers that may run at all (Payme only
# when listed).
# GPT_BILLING_MODE_CLICK / GPT_BILLING_MODE_UZUM / GPT_BILLING_MODE_PAYME =
# "test" | "live" | "off" for one provider; empty falls back to
# GPT_BILLING_MODE (empty = off). "test" is
# dark: only a rehearsal session (POST /api/internal/gpt-rehearsal-session)
# is offered a test provider. A new live checkout needs
# GPT_BILLING_LIVE_READY = "true" AND every other name liveReadiness()
# reports (functions/lib/gpt-chat/billing-config.ts): the offer
# (GPT_BILLING_TERMS_RU/UZ on gptbot.uz, GPT_BILLING_TERMS_VERSION and
# GPT_BILLING_TERMS_APPROVED_AT = the YYYY-MM-DD its edition was approved), the
# provider's live credentials and receipts, the owner alert channel,
# GPT_HASH_SALT, GPT_IDENTITY_SECRET, GPT_BILLING_MAINTENANCE_SECRET and a
# sign-in method. Callbacks of orders already open keep working when live
# is switched off.
# The offer: GPT_BILLING_TERMS_RU/UZ are the published /ru/oferta/ and
# /uz/oferta/, GPT_BILLING_TERMS_VERSION is the edition both pages state
# (termsVersion in content/pages/*/oferta.json). Text and edition change
# together, in one deploy: an open invoice of the old edition gets 409
# terms_changed. GPT_BILLING_TERMS_APPROVED_AT is the date this edition was
# approved, here AND as legalReviewedAt on both offers: 2026-10-03 for
# ai-paket-2026-10-v2, the owner's decision that a paid pack is not
# refundable, taken after the lawyer approved v1 on 2026-10-01 (paid-chat
# WP-25, docs/paid-chat/OFFER-RU.md). The deploy refuses
# GPT_BILLING_LIVE_READY = "true" unless the
# offers, the seller's requisites, both policies' review dates, the fiscal
# settings and the live providers' secrets are all in place
# (scripts/release/live-gate.ts; runbook docs/paid-chat/OFFER-RU.md).
# GPT_FISCAL_*: the receipt line of every provider (fiscal-config.ts). IKPU
# 10305008002000000 and package code 1514296 "услуга (раз)" (tasnif.soliq.uz),
# VAT 12 % INCLUDED in the price (20 000 сум carries 2 142,86 сум of VAT), the
# seller's TIN. Owner decision of 2026-10-01.
GPT_PAYMENT_PROVIDERS = "click,uzum,payme"
GPT_BILLING_MODE = ""
GPT_BILLING_MODE_CLICK = "live"
GPT_BILLING_MODE_UZUM = ""
GPT_BILLING_MODE_PAYME = "test"
GPT_BILLING_LIVE_READY = "true"
GPT_BILLING_TERMS_RU = "https://gptbot.uz/ru/oferta/"
GPT_BILLING_TERMS_UZ = "https://gptbot.uz/uz/oferta/"
GPT_BILLING_TERMS_VERSION = "ai-paket-2026-10-v2"
GPT_BILLING_TERMS_APPROVED_AT = "2026-10-03"
# Guest checkout (functions/lib/gpt-chat/billing-config.ts guestCheckout,
# docs/paid-chat/LOGIN-RU.md): Click without signing in, the pack bound to a
# guest account of the browser. Off unless exactly "true". It stays "false"
# while the offer edition ai-paket-2026-10-v2 and the current privacy policies
# describe only the Telegram account; turning it on is "true" here AND in the
# packed JSON above, in the release that publishes the owner-approved edition
# with the guest account. A Pages variable of this name is refused by the
# deploy gate (scripts/release/live-gate.ts BILLING_SETTINGS).
GPT_GUEST_CHECKOUT = "false"
GPT_FISCAL_IKPU = "10305008002000000"
GPT_FISCAL_PACKAGE_CODE = "1514296"
GPT_FISCAL_VAT_PERCENT = "12"
GPT_FISCAL_TIN = "310618348"
# Who prints the Click receipt (fiscal-config.ts clickFiscalPolicy, runbook
# docs/paid-chat/CLICK-FISCAL-RU.md). Click set up OFD for the service on its
# side on 2026-10-05 and may print every receipt itself; unconfirmed. "" (as
# committed) checks first: Click's link is looked for right after the
# payment, and our receipt line goes out only if there is still none
# GPT_CLICK_FISCAL_SUBMIT_DELAY_MINUTES (0..1440, default 10) after it, after
# one more check. "true" = Click prints them, we only read the link; "false" =
# ours right after the payment, as before 2026-10-05. Change in both places.
GPT_CLICK_AUTOFISCAL = ""
GPT_CLICK_FISCAL_SUBMIT_DELAY_MINUTES = "10"

# ── Consumer AI chat: limit card -> Telegram assistant bot ───────────────────
# OFF as committed. "true" (here AND in the packed JSON line above) makes
# /api/gpt/account return botHandoff=true, and only then does the chat's limit
# card show "continue in the Telegram bot" (src/gpt-chat/limit-card.ts). Keep
# it "false" until the bot answers reliably; any other value hides the button.
GPT_BOT_HANDOFF_ENABLED = "false"

# ── Consumer AI chat: sign-in through the bot @gptbotuz_bot ──────────────────
# The AI pack is bought from an account, and the account signs in through the
# bot (functions/api/gpt/auth/bot/*, plan WP-16): no BotFather client needed.
# Offered only while a payment provider is offered, and only with the bot's
# two secrets, the secret GPT_IDENTITY_SECRET (at least 32 characters) and a
# valid GPT_HANDOFF_BOT_USERNAME above. "pick": the bot offers three numbers
# and the person presses the one the site shows, once. "code": the bot sends
# 6 digits that are typed in on the site, the switch for when forwarded
# sign-in links get abused. Any other value turns sign-in through the bot off
# (Telegram's OIDC still works when GPT_TELEGRAM_CLIENT_ID is set).
# Runbook: docs/paid-chat/LOGIN-RU.md.
GPT_BOT_LOGIN_MODE = "pick"

# ── Consumer AI chat: owner alerts and the silence watchdog ──────────────────
# Failures are recorded in gpt_service_alerts in every billing mode; urgent
# codes (functions/lib/gpt-chat/alert-policy.ts) go to the owner's Telegram
# through GPT_NOTIFY_* (or the assistant-bot fallback). GPT_ALERTS_ENABLED =
# "false" is the emergency mute: recording goes on, sending stops.
# GPT_ALERTS_MAX_PER_HOUR caps messages across all callers (clamped 1..60).
# The watchdog raises chat_silence when GPT_WATCHDOG_MIN_TURNS turns in
# GPT_WATCHDOG_WINDOW_MINUTES (clamped 60..1440) got no answer at all.
# Runbook: docs/paid-chat/ALERTS-RU.md.
GPT_ALERTS_ENABLED = "true"
GPT_ALERTS_MAX_PER_HOUR = "6"
GPT_WATCHDOG_WINDOW_MINUTES = "180"
GPT_WATCHDOG_MIN_TURNS = "3"

# ── Consumer AI chat: hash salt switch-over and message retention ────────────
# The salt itself is the SECRET GPT_HASH_SALT (at least 32 random bytes, set by
# the release agent, never removed once used). GPT_HASH_SALT_SINCE is the UTC
# instant ("2026-10-03T00:00:00Z", the 00:00 UTC after the deploy that carries
# the secret) from which new IP hashes and bot pseudonyms are salted and the
# maintenance tick rewrites the older rows; empty keeps the legacy hashes. Set
# it once and never move it after it has passed.
# GPT_MESSAGES_RETENTION_DAYS: empty or "0" keeps chat messages until deleted
# on request; a number deletes older ones (clamped 7..3650) and changes the
# privacy policy in the same release. Runbook: docs/paid-chat/SALT-RU.md.
GPT_HASH_SALT_SINCE = "2026-10-02T00:00:00Z"
GPT_MESSAGES_RETENTION_DAYS = ""

# ── Javob, the Telegram assistant bot (@gptbotuz_bot): free replies ───────────
# Replies a day and a month, counted by the Tashkent day and month (00:00
# UTC+5). The bot sells nothing and names no price (Telegram allows digital
# goods in a bot only for Stars); /plans shows these numbers. Unset or invalid
# falls back to the plans row 'free'. Runbook: docs/paid-chat/BOT-RU.md.
TELEGRAM_FREE_DAILY_LIMIT = "10"
TELEGRAM_FREE_MONTHLY_LIMIT = "100"
# The bot's public @username for its share links (telegram/config.ts) and the
# fallback of GPT_HANDOFF_BOT_USERNAME. It used to be a Pages secret; an
# explicit binding wins over this JSON, so the secret is deleted once a deploy
# carries this line (one Pages variable less).
TELEGRAM_ASSISTANT_BOT_USERNAME = "gptbotuz_bot"
