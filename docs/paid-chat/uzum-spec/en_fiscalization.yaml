openapi: 3.0.2
info:
  title: Uzum Fiscalization
  version: 0.0.2
  description: >
    **Uzum Fiscalization** is a service for fiscalizing receipts and submitting
    them to the Uzbekistan tax authority via API.


    #### ⚙️ Key features

    - Fiscalization of purchase and refund receipts

    - Submission of QR code payment data — subject to agreement with Uzum

    - Receipt link generation

    - Non-fiscal receipts for advances and credit payments (without a QR code
    and fiscal identifier) — subject to agreement with Uzum

      > ⚠️ **Important:** For advance and credit payments, the State Tax Committee does not issue fiscal receipts. In such cases, a non-fiscal receipt link can be generated. To enable this feature, contact your Uzum account manager.

    #### 🚀 **Quick start**

    - [Authentication](#section/Authentication)

    - [Package code and IKPU](#section/IKPU-and-Packaging-Code)

    - [Receipt fiscalization](#tag/Fiscalization)

    - [Submitting QR payment receipts to the tax
    authority](#tag/Submit-QR-Code-Payment-Receipt-to-Tax-Authorities)


    ---


    # Getting started


    To integrate with the **Uzum Fiscalization API** quickly and smoothly,
    follow these steps:


    1. Obtain and securely store the [authorization
    token](#section/Authentication) for API access from your Uzum Bank account
    manager.


    2. Prepare the required data: [IKPU and package codes for goods and
    services](#section/IKPU-and-Packaging-Code).


    3. Review the available API methods:
        - [Receipt fiscalization](#tag/Fiscalization)
        - [Submitting QR payment receipts to the tax authority](#tag/Submit-QR-Code-Payment-Receipt-to-Tax-Authorities)

    4. Complete a [test integration](#tag/Testing).


    5. Go live.


    ---

    # Authentication

    Authentication via API key is a straightforward yet highly secure
    authorization method. We will provide you with a secret API key that must be
    included in all your requests. If the provided key matches the one stored in
    our system, your requests will be automatically verified as legitimate.


    Your requests must include the **X-API-Key** header.


    # IKPU and Packaging Code


    To perform fiscalization, you need to know the IKPU and the product
    packaging code. You can find the IKPU and packaging code on the Unified
    Electronic National Catalog of Products website:
    [https://tasnif.soliq.uz/](https://tasnif.soliq.uz/)


    <a href='/img/fiscalization/ikpu-3.png' target='_blank'><img
    src='/img/fiscalization/ikpu-3.png'/></a>.


    1. Visit the website [https://tasnif.soliq.uz/](https://tasnif.soliq.uz/)

    2. On the homepage, use the search bar and choose the appropriate search
    method. The most optimal option is usually 'Text Search'.

    3. Enter keywords in the search bar, such as "electric kettle". If your
    product doesn't appear in the list, try using more general terms like
    "kettle".

    4. Go to the product page that best matches your item.

    5. The IKPU of the product will be displayed at the top of the page.

    6. In the "Conditional Unit" section, find the code. The options can vary,
    for example, "pcs" for individual items, "gram" for weight-based items, and
    "service" (sum) for services.


    If you have difficulties selecting the correct conditional unit, please
    contact your accounting department for assistance.
