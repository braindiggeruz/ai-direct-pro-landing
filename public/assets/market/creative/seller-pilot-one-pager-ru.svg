  <text x="81" y="538" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" fill="#315956"><tspan x="81" dy="0">GPTBot помогает покупателям находить товары</tspan><tspan x="81" dy="48">и передаёт магазину запросы, где нужен</tspan><tspan x="81" dy="48">человек.</tspan></text>
  <circle cx="94" cy="732" r="10" fill="#f26b5b"/><text x="123" y="742" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" fill="#123b3a"><tspan x="123" dy="0">Подключение только после проверки</tspan></text><circle cx="94" cy="814" r="10" fill="#f26b5b"/><text x="123" y="824" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" fill="#123b3a"><tspan x="123" dy="0">Оплата и выполнение — у продавца</tspan></text><circle cx="94" cy="896" r="10" fill="#f26b5b"/><text x="123" y="906" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" fill="#123b3a"><tspan x="123" dy="0">Срок, цена и результат пилота</tspan><tspan x="123" dy="40">согласуются отдельно</tspan></text>
