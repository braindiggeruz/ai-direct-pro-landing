  <text x="81" y="464" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" fill="#315956"><tspan x="81" dy="0">Sotuvchi mahsulot, yetkazib berish va</tspan><tspan x="81" dy="48">to‘lov usulini bevosita tasdiqlaydi.</tspan></text>
  <circle cx="94" cy="610" r="10" fill="#0f6b66"/><text x="123" y="620" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" fill="#123b3a"><tspan x="123" dy="0">GPTBot pul qabul qilmaydi</tspan></text><circle cx="94" cy="692" r="10" fill="#0f6b66"/><text x="123" y="702" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" fill="#123b3a"><tspan x="123" dy="0">Mahsulot va bajarish uchun do‘kon</tspan><tspan x="123" dy="40">javob beradi</tspan></text>
