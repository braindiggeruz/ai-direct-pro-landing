<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Как GPT превращает запрос в ответ</title>
  <desc id="desc">Упрощённая последовательность из пяти этапов: запрос, токены, контекст, вероятности следующего токена и готовый ответ.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F8FF"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#635BFF"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#312E81" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1l9 5-9 5z" fill="#7C83A6"/>
    </marker>
  </defs>

  <rect width="1200" height="630" rx="32" fill="url(#background)"/>
  <circle cx="1085" cy="88" r="112" fill="#DDD6FE" opacity="0.44"/>
  <circle cx="95" cy="565" r="130" fill="#C7D2FE" opacity="0.34"/>

  <g font-family="Inter, Arial, sans-serif">
    <text x="70" y="82" font-size="42" font-weight="750" fill="#171A35">Как GPT превращает запрос в ответ</text>
    <text x="70" y="122" font-size="21" fill="#525777">Упрощённая схема одной генерации — без сложных формул</text>

    <g fill="none" stroke="#7C83A6" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)">
      <path d="M252 306h28"/>
      <path d="M472 306h28"/>
      <path d="M692 306h28"/>
      <path d="M912 306h28"/>
    </g>

    <g filter="url(#shadow)">
      <rect x="70" y="218" width="182" height="176" rx="22" fill="#FFFFFF" stroke="#D9DDF1" stroke-width="2"/>
      <rect x="290" y="218" width="182" height="176" rx="22" fill="#FFFFFF" stroke="#D9DDF1" stroke-width="2"/>
      <rect x="510" y="218" width="182" height="176" rx="22" fill="#FFFFFF" stroke="#D9DDF1" stroke-width="2"/>
      <rect x="730" y="218" width="182" height="176" rx="22" fill="#FFFFFF" stroke="#D9DDF1" stroke-width="2"/>
      <rect x="950" y="218" width="182" height="176" rx="22" fill="url(#accent)"/>
    </g>

    <g font-size="15" font-weight="700" text-anchor="middle">
      <circle cx="106" cy="254" r="19" fill="#EEF2FF"/>
      <text x="106" y="260" fill="#4F46E5">1</text>
      <circle cx="326" cy="254" r="19" fill="#EEF2FF"/>
      <text x="326" y="260" fill="#4F46E5">2</text>
      <circle cx="546" cy="254" r="19" fill="#EEF2FF"/>
      <text x="546" y="260" fill="#4F46E5">3</text>
      <circle cx="766" cy="254" r="19" fill="#EEF2FF"/>
      <text x="766" y="260" fill="#4F46E5">4</text>
      <circle cx="986" cy="254" r="19" fill="#FFFFFF" opacity="0.22"/>
      <text x="986" y="260" fill="#FFFFFF">5</text>
    </g>

    <g text-anchor="middle">
      <text x="161" y="310" font-size="24" font-weight="750" fill="#232747">Запрос</text>
      <text x="161" y="342" font-size="16" fill="#5B607E">Инструкция</text>
      <text x="161" y="365" font-size="16" fill="#5B607E">пользователя</text>

      <text x="381" y="310" font-size="24" font-weight="750" fill="#232747">Токены</text>
      <text x="381" y="342" font-size="16" fill="#5B607E">Текст делится</text>
      <text x="381" y="365" font-size="16" fill="#5B607E">на фрагменты</text>

      <text x="601" y="310" font-size="24" font-weight="750" fill="#232747">Контекст</text>
      <text x="601" y="342" font-size="16" fill="#5B607E">Запрос + диалог</text>
      <text x="601" y="365" font-size="16" fill="#5B607E">+ часть ответа</text>

      <text x="821" y="302" font-size="21" font-weight="750" fill="#232747">Вероятности</text>
      <text x="821" y="329" font-size="17" font-weight="650" fill="#3F4568">следующего токена</text>
      <text x="821" y="360" font-size="15" fill="#5B607E">Выбирается</text>
      <text x="821" y="381" font-size="15" fill="#5B607E">продолжение</text>

      <text x="1041" y="310" font-size="24" font-weight="750" fill="#FFFFFF">Ответ</text>
      <text x="1041" y="342" font-size="16" fill="#F3F0FF">Токены собираются</text>
      <text x="1041" y="365" font-size="16" fill="#F3F0FF">в связный текст</text>
    </g>

    <path d="M821 416c0 72-54 91-132 91H510" fill="none" stroke="#635BFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 8" marker-end="url(#arrow)"/>
    <rect x="512" y="470" width="360" height="64" rx="18" fill="#FFFFFF" stroke="#C7CCEA" stroke-width="2"/>
    <text x="692" y="496" font-size="16" font-weight="700" text-anchor="middle" fill="#373B62">Цикл повторяется токен за токеном</text>
    <text x="692" y="519" font-size="14" text-anchor="middle" fill="#666B8A">уже созданный текст становится частью контекста</text>

    <text x="70" y="588" font-size="14" fill="#6D7190">Редакционная схема GPTBot.uz · общий принцип, а не внутренние данные конкретной модели</text>
  </g>
</svg>
