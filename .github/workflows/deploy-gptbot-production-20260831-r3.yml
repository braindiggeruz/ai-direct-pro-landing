name: deploy-gptbot-production-20260831-r3

on:
  push:
    branches:
      - ops/deploy-gptbot-production-20260831-r3
    paths:
      - .github/workflows/deploy-gptbot-production-20260831-r3.yml

permissions:
  contents: write

concurrency:
  group: gptbot-pages-production-20260831-r3
  cancel-in-progress: false

env:
  RELEASE_SHA: c2cd7c13fca9bb9b1dabc8ada34aa7216b6ce9a5
  RELEASE_TREE: 01e3d8cc43b5667bbcf162b3b7d1cc5fb3276e33
  PROJECT: ai-direct-pro-landing
  APEX_ORIGIN: https://gptbot.uz
  PREVIOUS_DEPLOYMENT_ID: edc0edea-a38b-4fcf-81d7-e7de9be0e0cd
  PREVIOUS_DEPLOYMENT_URL: https://edc0edea.ai-direct-pro-landing.pages.dev
  PREVIOUS_COMMIT: 425dce778f9ad4482cab08dce0914706e96fcee2
  PREVIOUS_ARTIFACT_SHA256: a632f5f1dc0aa73d2eb1ca54691ebcb0a6bceea714044e5672b2a4fa0028f11d
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  guarded-production-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 100

    steps:
      - name: Check out immutable production source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Assert exact tracked release
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$RELEASE_TREE"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn

      - name: Prepare production guard scripts outside the repository
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/gptbot-preflight.mjs <<'NODE'
          import fs from 'node:fs';

          const requiredFeatures = [
            'audience_directory',
            'mobile_username_selection',
            'bridge_pairing',
            'sending_readiness',
            'campaign_preflight',
            'async_media_check',
          ];
          const requiredProbes = [
            { path: 'assets/AdminRoot-DZgp_AVa.js', sha256: '62c8bab96e508f573aa718b7fc578110e7f4f30b3c5266e067400f5bff079995' },
            { path: 'assets/triangle-alert-D0ARAtQI.js', sha256: 'd668dcce8de9ccaca6a3ea482e8ff82e197578633f5cd6bbd2153d5f1427137f' },
            { path: 'index.html', sha256: 'a7251b1996ebeabfac242bebfa357ec7228088cf1e6c3f03297d149de58ae0fb' },
            { path: 'admin/index.html', sha256: 'd78cad692a4eaac2ab7d70e7b63cb5c9c7c0cbeda6db71acb42eeb8032e936dc' },
            { path: 'uz/internet-reklama-toshkent/index.html', sha256: '95035d5ce2de5cec197f31842321d1f2656f623e6d8d8750022f8abc949138d1' },
            { path: 'ru/internet-reklama-tashkent/index.html', sha256: '755c37e27fe30bbe1faf718c4234a67e7335301021d6e0f9f1d44f970dcfb09e' },
          ];

          const headers = { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` };
          const api = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/pages/projects/${process.env.PROJECT}`;
          const assert = (condition, message) => { if (!condition) throw new Error(message); };

          async function json(url, init = {}) {
            const response = await fetch(url, { ...init, cache: 'no-store', signal: AbortSignal.timeout(30_000) });
            if (!response.ok) throw new Error(`${url} returned HTTP ${response.status}`);
            return response.json();
          }

          function verifyManifest(manifest, label) {
            assert(manifest?.schema === 1, `${label}: schema mismatch`);
            assert(manifest?.commit === process.env.PREVIOUS_COMMIT, `${label}: commit mismatch`);
            assert(manifest?.artifactSha256 === process.env.PREVIOUS_ARTIFACT_SHA256, `${label}: artifact mismatch`);
            assert(manifest?.fileCount === 870, `${label}: file count mismatch`);
            assert(JSON.stringify(manifest?.features) === JSON.stringify(requiredFeatures), `${label}: feature set mismatch`);
            assert(JSON.stringify(manifest?.probes) === JSON.stringify(requiredProbes), `${label}: probe set mismatch`);
          }

          const projectBody = await json(api, { headers });
          assert(projectBody?.success === true, 'Cloudflare project lookup failed');
          const project = projectBody.result;
          const deployment = project?.canonical_deployment;
          assert(deployment?.id === process.env.PREVIOUS_DEPLOYMENT_ID, `production deployment changed: ${deployment?.id}`);
          assert(deployment?.environment === 'production', 'canonical deployment is not production');
          assert(deployment?.latest_stage?.status === 'success', 'canonical deployment is not successful');
          assert(deployment?.deployment_trigger?.metadata?.commit_hash === process.env.PREVIOUS_COMMIT,
            `production commit changed: ${deployment?.deployment_trigger?.metadata?.commit_hash}`);
          assert(deployment?.deployment_trigger?.metadata?.commit_dirty === true, 'expected dirty production identity changed');

          const cacheBust = `${Date.now()}-${process.pid}`;
          const apexManifest = await json(`${process.env.APEX_ORIGIN}/gptbot-release.json?guard=${cacheBust}`);
          const immutableManifest = await json(`${process.env.PREVIOUS_DEPLOYMENT_URL}/gptbot-release.json?guard=${cacheBust}`);
          verifyManifest(apexManifest, 'apex manifest');
          verifyManifest(immutableManifest, 'immutable manifest');
          assert(JSON.stringify(apexManifest) === JSON.stringify(immutableManifest), 'apex and immutable manifests differ');

          const evidence = {
            checkedAt: new Date().toISOString(),
            project: process.env.PROJECT,
            previousDeploymentId: deployment.id,
            previousDeploymentUrl: deployment.url,
            previousCommit: process.env.PREVIOUS_COMMIT,
            previousArtifactSha256: process.env.PREVIOUS_ARTIFACT_SHA256,
            previousFileCount: apexManifest.fileCount,
            previousFeatures: apexManifest.features,
            previousProbes: apexManifest.probes,
            productionBranch: project.production_branch,
            result: 'exact_current_production_verified',
          };
          fs.writeFileSync('predeploy-evidence.json', `${JSON.stringify(evidence, null, 2)}\n`);
          console.log(JSON.stringify(evidence));
          NODE

          cat > /tmp/gptbot-postdeploy.mjs <<'NODE'
          import fs from 'node:fs';

          const headers = { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` };
          const projectApi = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/pages/projects/${process.env.PROJECT}`;
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const candidate = JSON.parse(fs.readFileSync('dist/gptbot-release.json', 'utf8'));

          async function json(url, init = {}) {
            const response = await fetch(url, { ...init, cache: 'no-store', signal: AbortSignal.timeout(30_000) });
            if (!response.ok) throw new Error(`${url} returned HTTP ${response.status}`);
            return response.json();
          }

          let project;
          let deployment;
          for (let attempt = 0; attempt < 60; attempt += 1) {
            const body = await json(projectApi, { headers });
            project = body.result;
            deployment = project?.canonical_deployment;
            const commit = deployment?.deployment_trigger?.metadata?.commit_hash;
            const status = deployment?.latest_stage?.status;
            if (commit === process.env.RELEASE_SHA && status === 'success' && deployment?.environment === 'production') break;
            if (commit !== process.env.PREVIOUS_COMMIT && commit !== process.env.RELEASE_SHA) {
              throw new Error(`competing production deployment detected: ${commit}`);
            }
            if (attempt === 59) throw new Error(`new production deployment did not become canonical; current=${commit}, status=${status}`);
            await sleep(5_000);
          }

          assert(deployment?.deployment_trigger?.metadata?.commit_hash === process.env.RELEASE_SHA, 'canonical commit mismatch');
          const deploymentUrl = deployment.url;

          async function waitForManifest(origin, label) {
            for (let attempt = 0; attempt < 36; attempt += 1) {
              try {
                const manifest = await json(`${origin}/gptbot-release.json?release=${process.env.RELEASE_SHA}&attempt=${attempt}`);
                if (JSON.stringify(manifest) === JSON.stringify(candidate)) return manifest;
              } catch {}
              await sleep(5_000);
            }
            throw new Error(`${label} did not serve the candidate manifest`);
          }

          const immutableManifest = await waitForManifest(deploymentUrl, 'immutable deployment');
          const apexManifest = await waitForManifest(process.env.APEX_ORIGIN, 'apex');
          assert(JSON.stringify(immutableManifest) === JSON.stringify(apexManifest), 'immutable and apex manifests differ');

          const projectConfig = project?.deployment_configs?.production ?? null;
          const envSources = [deployment?.env_vars, projectConfig?.env_vars].filter(Boolean);
          function envValue(name) {
            for (const source of envSources) {
              const entry = source?.[name];
              if (entry && typeof entry === 'object' && 'value' in entry) return String(entry.value);
              if (typeof entry === 'string') return entry;
            }
            return undefined;
          }
          const requiredFlags = {
            FIRST_PARTY_AUTOMATION_ENABLED: 'true',
            LEAD_RADAR_ADMISSION_ENABLED: 'true',
            LEAD_RADAR_PROCESSING_ENABLED: 'true',
            LEAD_RADAR_TELEGRAM_ACCOUNT_ENABLED: 'true',
            LEAD_RADAR_CONTACT_ENABLED: 'false',
            LEAD_RADAR_TELEGRAM_CAMPAIGN_ENABLED: 'false',
            LEAD_RADAR_TELEGRAM_CAMPAIGN_AUTOSEND_ENABLED: 'false',
          };
          for (const [name, expected] of Object.entries(requiredFlags)) {
            assert(envValue(name) === expected, `${name} expected ${expected}, got ${envValue(name)}`);
          }

          const configSerialized = projectConfig ? JSON.stringify(projectConfig) : '';
          const requiredBindings = [
            'GPTBOT_DRAFTS_DB',
            'LOGIN_ATTEMPTS',
            'MARKET_MEDIA',
            'LEAD_RADAR_CAMPAIGN_MEDIA',
            'LEAD_RADAR_TELEGRAM_ACCOUNT_SERVICE',
            'AUTOMATION_QUEUE',
          ];
          const bindingSurfaceChecked = Boolean(projectConfig);
          if (bindingSurfaceChecked) {
            for (const binding of requiredBindings) {
              assert(configSerialized.includes(binding), `production config missing binding ${binding}`);
            }
          }

          const evidence = {
            checkedAt: new Date().toISOString(),
            previousDeploymentId: process.env.PREVIOUS_DEPLOYMENT_ID,
            releaseSha: process.env.RELEASE_SHA,
            releaseTree: process.env.RELEASE_TREE,
            deploymentId: deployment.id,
            deploymentUrl,
            environment: deployment.environment,
            status: deployment.latest_stage.status,
            commitHash: deployment.deployment_trigger.metadata.commit_hash,
            commitDirty: deployment.deployment_trigger.metadata.commit_dirty,
            artifactSha256: candidate.artifactSha256,
            fileCount: candidate.fileCount,
            features: candidate.features,
            requiredFlags,
            bindingSurfaceChecked,
            requiredBindings,
            manifestVerifiedOn: [deploymentUrl, process.env.APEX_ORIGIN],
          };
          fs.writeFileSync('deployment-evidence.json', `${JSON.stringify(evidence, null, 2)}\n`);
          console.log(JSON.stringify(evidence));
          NODE

          cat > /tmp/gptbot-canary.mjs <<'NODE'
          import fs from 'node:fs';

          const origin = process.env.APEX_ORIGIN;
          const releaseSha = process.env.RELEASE_SHA;
          const candidate = JSON.parse(fs.readFileSync('dist/gptbot-release.json', 'utf8'));
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const assert = (condition, message) => { if (!condition) throw new Error(message); };

          async function fetchEventually(pathname, options = {}, attempts = 18) {
            let lastError;
            for (let attempt = 0; attempt < attempts; attempt += 1) {
              try {
                const url = new URL(pathname, origin);
                url.searchParams.set('release', releaseSha);
                url.searchParams.set('attempt', String(attempt));
                const response = await fetch(url, {
                  cache: 'no-store',
                  signal: AbortSignal.timeout(30_000),
                  ...options,
                });
                if (response.ok || options.redirect === 'manual') return response;
                lastError = new Error(`${pathname} returned HTTP ${response.status}`);
              } catch (error) {
                lastError = error;
              }
              await sleep(5_000);
            }
            throw lastError ?? new Error(`${pathname} did not respond`);
          }

          const routes = [
            '/',
            '/robots.txt',
            '/sitemap.xml',
            '/ru/internet-reklama-tashkent/',
            '/uz/internet-reklama-toshkent/',
            '/ru/otzyvy/',
            '/uz/sharhlar/',
            '/ru/stoimost-chat-bota/',
            '/uz/chat-bot-narxi/',
            '/ru/ai-bot-s-crm-amocrm-bitrix24/',
            '/uz/amocrm-bitrix24-bilan-ai-bot/',
          ];
          const routeEvidence = {};
          for (const route of routes) {
            const response = await fetchEventually(route);
            routeEvidence[route] = {
              status: response.status,
              contentType: response.headers.get('content-type'),
              cfCacheStatus: response.headers.get('cf-cache-status'),
            };
          }

          const manifest = await (await fetchEventually('/gptbot-release.json')).json();
          assert(JSON.stringify(manifest) === JSON.stringify(candidate), 'apex release manifest is not the candidate');

          const ruAds = await (await fetchEventually('/ru/internet-reklama-tashkent/')).text();
          for (const marker of [
            '/ru/kontekstnaya-reklama-tashkent/',
            '/ru/targetirovannaya-reklama-tashkent/',
            '/ru/telegram-ads-uzbekistan/',
            '/ru/performance-marketing-tashkent/',
            '/ru/marketingovyi-audit-tashkent/',
          ]) assert(ruAds.includes(marker), `RU paid-media hub is missing ${marker}`);

          const uzAds = await (await fetchEventually('/uz/internet-reklama-toshkent/')).text();
          for (const marker of [
            '/uz/telegram-reklama/',
            '/uz/smm-xizmatlari/',
            '/uz/seo-xizmati/',
            '/uz/sayt-yaratish/',
            '/uz/biznes-uchun-ai-bot/',
          ]) assert(uzAds.includes(marker), `UZ paid-media hub is missing ${marker}`);

          const home = await (await fetchEventually('/')).text();
          assert(home.includes("gtag('event','contact_click'"), 'contact_click is absent from production');
          assert(home.includes("contact_method: 'telegram'"), 'contact_method=telegram is absent');
          assert(!home.includes("gtag('event','generate_lead'"), 'public click handler still fabricates generate_lead');

          for (const route of ['/ru/otzyvy/', '/uz/sharhlar/']) {
            const html = await (await fetchEventually(route)).text();
            assert(!/★★★★★|AggregateRating|"@type"\s*:\s*"Review"/.test(html), `${route} exposes an unverified review/rating`);
          }

          const sitemap = await (await fetchEventually('/sitemap.xml')).text();
          for (const marker of ['/ru/internet-reklama-tashkent/', '/uz/internet-reklama-toshkent/']) {
            assert(sitemap.includes(marker), `sitemap is missing ${marker}`);
          }

          const admin = await fetchEventually('/admin/lead-radar', { redirect: 'manual' });
          assert([200, 301, 302, 303, 307, 308, 401].includes(admin.status),
            `/admin/lead-radar returned unexpected HTTP ${admin.status}`);

          let wwwObservation;
          try {
            const response = await fetch(`https://www.gptbot.uz/?release=${releaseSha}`, {
              redirect: 'manual', cache: 'no-store', signal: AbortSignal.timeout(30_000),
            });
            wwwObservation = { status: response.status, location: response.headers.get('location') };
          } catch (error) {
            wwwObservation = { warning: error instanceof Error ? error.message : String(error) };
          }

          const evidence = {
            checkedAt: new Date().toISOString(),
            releaseSha,
            artifactSha256: candidate.artifactSha256,
            routeEvidence,
            ruCommercialBridges: 'pass',
            uzCommercialBridges: 'pass',
            analyticsSemantics: 'pass',
            reviewTrustGuard: 'pass',
            sitemap: 'pass',
            adminLeadRadarStatus: admin.status,
            wwwObservation,
            result: 'production_canary_pass',
          };
          fs.writeFileSync('canary-evidence.json', `${JSON.stringify(evidence, null, 2)}\n`);
          console.log(JSON.stringify(evidence));
          NODE

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          yarn install --frozen-lockfile --ignore-scripts --non-interactive
          npm --prefix apps/bormi-admin ci --ignore-scripts --no-audit --no-fund

      - name: Verify exact current production before any build or upload
        run: node /tmp/gptbot-preflight.mjs

      - name: Run complete public and Lead Radar regression suites
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test tests/lead-radar-cold-schema-sort.test.ts
          yarn test
          yarn typecheck:lead-radar
          yarn test:lead-radar
          yarn test:pages-production

      - name: Run SEO, TypeScript and secret gates
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        shell: bash
        run: |
          set -euo pipefail
          yarn seo:audit
          yarn tsc -b
          yarn scan:secrets
          git diff --check

      - name: Build and stamp clean combined production artifact
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          npm run build:production
          npx --no-install tsx scripts/release/pages-production.ts check

      - name: Re-verify exact production immediately before upload
        run: node /tmp/gptbot-preflight.mjs

      - name: Deploy guarded artifact to Cloudflare Pages production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/wrangler/bin/wrangler.js pages deploy dist \
            --project-name "$PROJECT" \
            --branch main \
            --commit-hash "$RELEASE_SHA" \
            --commit-dirty=true \
            2>&1 | tee wrangler-deploy.log
          touch deployment-upload-completed.marker

      - name: Verify Cloudflare production identity, manifest, flags and bindings
        run: node /tmp/gptbot-postdeploy.mjs

      - name: Run public SEO, analytics, trust and Lead Radar canaries
        run: node /tmp/gptbot-canary.mjs

      - name: Roll back automatically if a post-upload gate fails
        if: ${{ failure() && steps.deploy.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --request POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments/$PREVIOUS_DEPLOYMENT_ID/rollback" \
            > rollback-response.json
          node <<'NODE'
          const fs = require('node:fs');
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const headers = { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` };
          const api = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/pages/projects/${process.env.PROJECT}`;
          let deployment;
          for (let attempt = 0; attempt < 60; attempt += 1) {
            const response = await fetch(api, { headers, cache: 'no-store', signal: AbortSignal.timeout(30_000) });
            const body = await response.json();
            deployment = body.result?.canonical_deployment;
            if (deployment?.deployment_trigger?.metadata?.commit_hash === process.env.PREVIOUS_COMMIT
              && deployment?.latest_stage?.status === 'success') break;
            if (attempt === 59) throw new Error('rollback did not restore the previous production commit');
            await sleep(5_000);
          }
          let manifest;
          for (let attempt = 0; attempt < 36; attempt += 1) {
            try {
              const response = await fetch(`${process.env.APEX_ORIGIN}/gptbot-release.json?rollback=${Date.now()}-${attempt}`,
                { cache: 'no-store', signal: AbortSignal.timeout(30_000) });
              manifest = await response.json();
              if (manifest?.commit === process.env.PREVIOUS_COMMIT
                && manifest?.artifactSha256 === process.env.PREVIOUS_ARTIFACT_SHA256) break;
            } catch {}
            if (attempt === 35) throw new Error('apex did not return the previous manifest after rollback');
            await sleep(5_000);
          }
          const evidence = {
            rolledBackAt: new Date().toISOString(),
            targetDeploymentId: process.env.PREVIOUS_DEPLOYMENT_ID,
            restoredCommit: deployment.deployment_trigger.metadata.commit_hash,
            restoredArtifactSha256: manifest.artifactSha256,
            result: 'rollback_verified',
          };
          fs.writeFileSync('rollback-evidence.json', `${JSON.stringify(evidence, null, 2)}\n`);
          console.log(JSON.stringify(evidence));
          NODE

      - name: Preserve sanitized deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gptbot-production-deployment-${{ env.RELEASE_SHA }}
          path: |
            predeploy-evidence.json
            deployment-evidence.json
            canary-evidence.json
            rollback-evidence.json
            rollback-response.json
            wrangler-deploy.log
            deployment-upload-completed.marker
            dist/gptbot-release.json
          if-no-files-found: warn
          retention-days: 30

      - name: Remove one-shot deployment workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git switch -C ops/deploy-gptbot-production-20260831-r3 origin/ops/deploy-gptbot-production-20260831-r3
          git config user.name "GPTBot Release CI"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/deploy-gptbot-production-20260831-r3.yml
          git commit -m "chore(release): remove one-shot production deployment workflow"
          git push origin HEAD:ops/deploy-gptbot-production-20260831-r3
