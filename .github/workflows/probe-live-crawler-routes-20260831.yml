name: probe-live-crawler-routes-20260831
on:
  push:
    branches: [ops/probe-live-crawler-routes-20260831]
    paths: [.github/workflows/probe-live-crawler-routes-20260831.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORIGIN: https://000d6620.ai-direct-pro-landing.pages.dev
    steps:
      - uses: actions/checkout@v4
        with: {ref: ops/probe-live-crawler-routes-20260831}
      - name: Probe unauthenticated route shapes without mutations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cat > /tmp/paths.txt <<'EOF'
          /api/admin/lead-radar/crawler/status
          /api/admin/lead-radar/crawler/jobs
          /api/admin/lead-radar/crawler/jobs/test
          /api/admin/lead-radar/crawler/jobs/test/cancel
          /api/admin/lead-radar/crawler/workers
          /api/admin/lead-radar/crawler/heartbeat
          /api/admin/lead-radar/crawler/claim
          /api/admin/lead-radar/crawler/receipts
          /api/lead-radar/crawler/status
          /api/lead-radar/crawler/jobs
          /api/lead-radar/crawler/jobs/claim
          /api/lead-radar/crawler/claim
          /api/lead-radar/crawler/heartbeat
          /api/lead-radar/crawler/receipt
          /api/lead-radar/crawler/receipts
          /api/internal/lead-radar/crawler/status
          /api/internal/lead-radar/crawler/jobs
          /api/internal/lead-radar/crawler/jobs/claim
          /api/internal/lead-radar/crawler/claim
          /api/internal/lead-radar/crawler/heartbeat
          /api/internal/lead-radar/crawler/receipt
          /api/internal/lead-radar/crawler/receipts
          /api/crawler/status
          /api/crawler/jobs
          /api/crawler/jobs/claim
          /api/crawler/claim
          /api/crawler/heartbeat
          /api/crawler/receipt
          EOF
          : > evidence/routes.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            for method in GET POST PATCH DELETE OPTIONS; do
              body=$(mktemp)
              code=$(curl --silent --show-error --request "$method" \
                -H 'Content-Type: application/json' \
                --data '{}' --output "$body" --write-out '%{http_code}' "$ORIGIN$path" || true)
              preview=$(head -c 300 "$body" | tr '\r\n' ' ' | sed 's/[[:space:]]\+/ /g')
              printf '%s|%s|%s|%s\n' "$method" "$path" "$code" "$preview" | tee -a evidence/routes.txt
              rm -f "$body"
            done
          done < /tmp/paths.txt
      - uses: actions/upload-artifact@v4
        with: {name: gptbot-live-crawler-route-probe-20260831, path: evidence/routes.txt, retention-days: 7, if-no-files-found: error}
      - name: Remove one-shot workflow
        if: always()
        run: |
          git fetch origin ops/probe-live-crawler-routes-20260831
          git switch -C ops/probe-live-crawler-routes-20260831 origin/ops/probe-live-crawler-routes-20260831
          git config user.name "GPTBot Route Probe CI"; git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/probe-live-crawler-routes-20260831.yml
          git commit -m "chore: remove crawler route probe"
          git push origin HEAD:ops/probe-live-crawler-routes-20260831
