name: apply-directory-contact-perf-recovery-20260831

on:
  push:
    branches:
      - fix/gsc-crawler-directory-perf-20260831
    paths:
      - .github/scripts/apply-directory-contact-perf-recovery.mjs
      - .github/workflows/apply-directory-contact-perf-recovery-20260831.yml

permissions:
  contents: write

concurrency:
  group: apply-directory-contact-perf-recovery-20260831
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      BASE_SHA: 42df64e1a4bfc1121b1fc1882a7b6c46f8fa428b

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gsc-crawler-directory-perf-20260831
          fetch-depth: 0

      - name: Apply the recovered directory performance invariant
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          node .github/scripts/apply-directory-contact-perf-recovery.mjs

      - name: Remove one-shot automation from the final tree
        run: git rm -f .github/scripts/apply-directory-contact-perf-recovery.mjs .github/workflows/apply-directory-contact-perf-recovery-20260831.yml

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn

      - name: Install locked dependencies
        run: |
          yarn install --frozen-lockfile --ignore-scripts --non-interactive
          npm --prefix apps/bormi-admin ci --ignore-scripts --no-audit --no-fund

      - name: Run focused directory, crawler and source-contract tests
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          node --import tsx --test tests/lead-radar-audiences.test.ts tests/lead-radar-crawler.test.ts tests/lead-radar-crawler-contract.test.ts
          yarn typecheck:lead-radar

      - name: Run complete release gates
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          yarn test:gsc-indexation
          yarn test
          yarn test:lead-radar
          yarn test:pages-production
          yarn seo:audit
          yarn tsc -b
          yarn scan:secrets
          git diff --check

      - name: Assert the exact performance and safety scope
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'MAX_DIRECTORY_CONTACT_CANDIDATES_PER_COMPANY = 256' functions/platform/lead-radar/recipient-directory.ts
          grep -F 'MAX_DIRECTORY_PHONE_EVIDENCE_PER_COMPANY = 128' functions/platform/lead-radar/recipient-directory.ts
          grep -F 'const businessById = new Map<string, boolean>()' functions/platform/lead-radar/recipient-directory.ts
          grep -F 'hasBusinessContact: members.some' functions/platform/lead-radar/recipient-directory.ts
          grep -F 'matches.filter((group)=>group.hasBusinessContact)' functions/platform/lead-radar/audiences.ts
          ! grep -F 'JSON.parse(member.telegram_contact_json' functions/platform/lead-radar/audiences.ts
          test "$(grep -c 'parse<LeadRadarTelegramContact | null>' functions/platform/lead-radar/recipient-directory.ts)" = 1
          test -f migrations/0056_lead_radar_crawler.sql
          grep -F 'LEAD_RADAR_CRAWLER_ENABLED = "true"' wrangler.toml
          ! grep -nE 'SearchAction|search_term_string|query-input' index.html

      - name: Commit the verified source superset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GPTBot Recovery CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "perf(lead-radar): bound and reuse directory contact parsing"

      - name: Build and verify the exact production artifact
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          test -z "$(git status --porcelain)"
          npm run build:production
          npx --no-install tsx scripts/release/pages-production.ts check
          grep -RFl 'Локальный сборщик' dist/assets/AdminRoot-*.js
          ! grep -RniE 'SearchAction|search_term_string|query-input' dist/index.html dist/ru/blog/index.html dist/uz/blog/index.html
          grep -F '/ru/telegram-bot-uzbekistan/  /ru/telegram-bot-dlya-biznesa/  301' dist/_redirects
          grep -F '/gpt-uzbek-tilida/  /uz/gpt-uzbek-tilida/  301' dist/_redirects
          grep -F '/gpt-chat/  /ru/gpt-chat/  301' dist/_redirects

      - name: Push the verified release source
        run: git push origin HEAD:fix/gsc-crawler-directory-perf-20260831
