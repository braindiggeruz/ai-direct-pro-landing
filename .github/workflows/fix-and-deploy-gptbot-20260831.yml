name: fix-and-deploy-gptbot-20260831

on:
  push:
    branches:
      - ops/inspect-cold-locale-schema-guard-20260831
    paths:
      - .github/workflows/fix-and-deploy-gptbot-20260831.yml

permissions:
  contents: write

concurrency:
  group: gptbot-pages-production-fix-20260831
  cancel-in-progress: false

env:
  BASE_SHA: aa2ac83d66b52f9744bef48c9d3c40ce107c1fa7
  RELEASE_BRANCH: release/hot-traffic-production-20260831-r2
  CLOUDFLARE_PAGES_PROJECT: ai-direct-pro-landing
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  fix-verify-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out verified combined candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0

      - name: Make schema fingerprints deterministic without locale initialization
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          replacements = {
            Path('functions/platform/lead-radar/schema-contract.ts'): [
              (
                '    return leftKey.localeCompare(rightKey);',
                '    return leftKey < rightKey ? -1 : leftKey > rightKey ? 1 : 0;'
              ),
            ],
            Path('functions/platform/lead-radar/telegram-campaign-schema.ts'): [
              (
                '    return leftKey.localeCompare(rightKey);',
                '    return leftKey < rightKey ? -1 : leftKey > rightKey ? 1 : 0;'
              ),
            ],
          }
          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one target, found {count}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- functions/platform/lead-radar/schema-contract.ts functions/platform/lead-radar/telegram-campaign-schema.ts
          if git grep -n 'leftKey.localeCompare(rightKey)' -- functions/platform/lead-radar/schema-contract.ts functions/platform/lead-radar/telegram-campaign-schema.ts; then
            echo '::error::localeCompare remains in schema fingerprint ordering'
            exit 1
          fi

      - name: Commit immutable release candidate
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GPTBot Release CI"
          git config user.email "actions@users.noreply.github.com"
          git add functions/platform/lead-radar/schema-contract.ts functions/platform/lead-radar/telegram-campaign-schema.ts
          git commit -m "fix(lead-radar): make schema fingerprints locale-independent"
          RELEASE_SHA=$(git rev-parse HEAD)
          RELEASE_TREE=$(git rev-parse HEAD^{tree})
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "tree=$RELEASE_TREE" >> "$GITHUB_OUTPUT"
          git push origin HEAD:${RELEASE_BRANCH}
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
          echo "RELEASE_TREE=$RELEASE_TREE" >> "$GITHUB_ENV"

      - name: Verify Cloudflare deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::CLOUDFLARE_API_TOKEN is missing'; exit 1; }
          echo 'Cloudflare credential names are present; values are masked.'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          yarn install --frozen-lockfile --ignore-scripts --non-interactive
          npm --prefix apps/bormi-admin ci --ignore-scripts --no-audit --no-fund

      - name: Verify deterministic fingerprint implementation
        shell: bash
        run: |
          set -euo pipefail
          grep -F "return leftKey < rightKey ? -1 : leftKey > rightKey ? 1 : 0;" functions/platform/lead-radar/schema-contract.ts
          grep -F "return leftKey < rightKey ? -1 : leftKey > rightKey ? 1 : 0;" functions/platform/lead-radar/telegram-campaign-schema.ts
          ! grep -F "leftKey.localeCompare(rightKey)" functions/platform/lead-radar/schema-contract.ts
          ! grep -F "leftKey.localeCompare(rightKey)" functions/platform/lead-radar/telegram-campaign-schema.ts

      - name: Run complete public, Lead Radar, SEO and security gates
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        shell: bash
        run: |
          set -euo pipefail
          yarn test
          yarn typecheck:lead-radar
          yarn test:lead-radar
          yarn test:pages-production
          yarn seo:audit
          yarn tsc -b
          yarn scan:secrets
          git diff --check

      - name: Build and stamp production artifact
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$RELEASE_TREE"
          npm run build:production
          node -e "const m=require('./dist/gptbot-release.json'); if(m.commit!==process.env.RELEASE_SHA) throw new Error('release stamp mismatch'); console.log(JSON.stringify({commit:m.commit,artifactSha256:m.artifactSha256,fileCount:m.fileCount,features:m.features}))"

      - name: Verify production lineage guard
        run: npm run release:pages:check

      - name: Deploy guarded artifact to Cloudflare Pages production
        run: npm run deploy:pages:production

      - name: Capture deployment metadata and verify apex plus immutable origin
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PAGES_PROJECT/deployments?per_page=10" \
            > cloudflare-deployments.json
          node <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('cloudflare-deployments.json', 'utf8'));
          if (!body.success || !Array.isArray(body.result)) throw new Error('invalid Cloudflare deployments response');
          const prod = body.result.find(d => d.environment === 'production' && d.deployment_trigger?.metadata?.commit_hash === process.env.RELEASE_SHA);
          if (!prod) throw new Error('new production deployment not found for release SHA');
          if (prod.latest_stage?.status !== 'success') throw new Error(`deployment status=${prod.latest_stage?.status}`);
          const evidence = {checkedAt:new Date().toISOString(),releaseSha:process.env.RELEASE_SHA,deploymentId:prod.id,deploymentUrl:prod.url,status:prod.latest_stage.status,aliases:prod.aliases ?? []};
          fs.writeFileSync('deployment-evidence.json', JSON.stringify(evidence,null,2)+'\n');
          console.log('DEPLOYMENT='+JSON.stringify(evidence));
          NODE
          IMMUTABLE=$(node -p "JSON.parse(require('fs').readFileSync('deployment-evidence.json','utf8')).deploymentUrl")
          export IMMUTABLE
          node <<'NODE'
          const fs = require('node:fs');
          const sha = process.env.RELEASE_SHA;
          const origins = ['https://gptbot.uz', process.env.IMMUTABLE];
          const paths = [
            '/gptbot-release.json','/','/robots.txt','/sitemap.xml',
            '/ru/internet-reklama-tashkent/','/uz/internet-reklama-toshkent/',
            '/ru/digital-marketing-tashkent/','/ru/kontekstnaya-reklama-tashkent/',
            '/ru/targetirovannaya-reklama-tashkent/','/ru/telegram-ads-uzbekistan/',
            '/ru/performance-marketing-tashkent/','/ru/marketingovyi-audit-tashkent/',
            '/uz/telegram-reklama/','/uz/smm-xizmatlari/','/uz/seo-xizmati/','/admin/lead-radar'
          ];
          const sleep = ms => new Promise(r=>setTimeout(r,ms));
          async function get(origin,path,manual=false){
            let last;
            for(let i=0;i<15;i++){
              try{
                const u=origin+path+(path.includes('?')?'&':'?')+'release='+sha+'&attempt='+i;
                const r=await fetch(u,{cache:'no-store',redirect:manual?'manual':'follow',signal:AbortSignal.timeout(30000)});
                last=r;
                if(r.ok || (manual && [301,302,303,307,308,401].includes(r.status))) return r;
              }catch(e){last=e}
              await sleep(8000);
            }
            if(last instanceof Response) throw new Error(`${origin}${path} -> ${last.status}`);
            throw last;
          }
          const checks={};
          for(const origin of origins){
            checks[origin]={};
            for(const path of paths){
              const r=await get(origin,path,path==='/admin/lead-radar');
              checks[origin][path]=r.status;
            }
            const m=await (await get(origin,'/gptbot-release.json')).json();
            if(m.commit!==sha) throw new Error(`${origin} manifest commit ${m.commit} != ${sha}`);
            checks[origin].manifest={commit:m.commit,artifactSha256:m.artifactSha256,fileCount:m.fileCount,features:m.features};
            const ru=await (await get(origin,'/ru/internet-reklama-tashkent/')).text();
            for(const marker of ['/ru/kontekstnaya-reklama-tashkent/','/ru/targetirovannaya-reklama-tashkent/','/ru/telegram-ads-uzbekistan/','/ru/performance-marketing-tashkent/','/ru/marketingovyi-audit-tashkent/']) if(!ru.includes(marker)) throw new Error(`${origin} RU hub missing ${marker}`);
            const uz=await (await get(origin,'/uz/internet-reklama-toshkent/')).text();
            for(const marker of ['/uz/telegram-reklama/','/uz/smm-xizmatlari/','/uz/seo-xizmati/','/uz/sayt-yaratish/','/uz/biznes-uchun-ai-bot/']) if(!uz.includes(marker)) throw new Error(`${origin} UZ hub missing ${marker}`);
            const sitemap=await (await get(origin,'/sitemap.xml')).text();
            if(!sitemap.includes('/ru/internet-reklama-tashkent/')||!sitemap.includes('/uz/internet-reklama-toshkent/')) throw new Error(`${origin} sitemap missing hubs`);
          }
          const evidence=JSON.parse(fs.readFileSync('deployment-evidence.json','utf8'));
          evidence.origins=checks;
          evidence.canary='pass';
          fs.writeFileSync('deployment-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log('CANARY='+JSON.stringify(evidence));
          NODE

      - name: Preserve deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: gptbot-production-deployment-evidence-${{ steps.release.outputs.sha }}
          path: |
            deployment-evidence.json
            cloudflare-deployments.json
            dist/gptbot-release.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove one-shot workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ops/inspect-cold-locale-schema-guard-20260831
          git switch -C ops/inspect-cold-locale-schema-guard-20260831 origin/ops/inspect-cold-locale-schema-guard-20260831
          git config user.name "GPTBot Release CI"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/fix-and-deploy-gptbot-20260831.yml
          git commit -m "chore(release): remove fix-and-deploy workflow"
          git push origin HEAD:ops/inspect-cold-locale-schema-guard-20260831
