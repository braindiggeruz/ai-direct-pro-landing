name: seo-commercial-review

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: seo-commercial-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-verify-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn

      - name: Normalize Unicode-aware matchers
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = '.github/scripts/apply-seo-commercial-review.mjs';
          let source = fs.readFileSync(file, 'utf8');
          source = source
            .replaceAll(
              'replaceFaq(page, /минимальн\\w* бюджет на Telegram Ads/i, {',
              'upsertFaq(page, /минимальн\\w* бюджет на Telegram Ads/i, {',
            )
            .replaceAll('рыночн\\w* цен', 'рыночн[а-яё]* цен')
            .replaceAll('рыночн\\w* ориентир', 'рыночн[а-яё]* ориентир')
            .replaceAll('минимальн\\w* бюджет на Telegram Ads', 'минимал[^?]*бюджет.*Telegram Ads')
            .replaceAll('минимальн\\w* бюджет', 'минимал[^?]*бюджет')
            .replaceAll(
              'минимал[^?]*бюджет.*Telegram Ads',
              'Как определить достаточный бюджет для теста|минимал[^?]*бюджет.*Telegram Ads',
            )
            .replaceAll(
              'resseller.*(?:2026|avgust)',
              'resseller.*(?:2026|avgust)|2026-yil avgust|Bozor mo‘ljallari',
            );
          fs.writeFileSync(file, source, 'utf8');
          NODE

      - name: Apply final commercial review corrections
        run: node .github/scripts/apply-seo-commercial-review.mjs

      - name: Remove one-shot review automation from final branch
        run: git rm -f .github/scripts/apply-seo-commercial-review.mjs .github/workflows/seo-commercial-review.yml

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts --non-interactive

      - name: Run complete repository test suite
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: yarn test

      - name: Run SEO audit and TypeScript checks
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          yarn seo:audit
          yarn tsc -b

      - name: Build and prerender the complete site
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: yarn build

      - name: Scan tracked content for secrets
        run: yarn scan:secrets

      - name: Validate JSON, whitespace and volatile-claim removal
        run: |
          git diff --check
          node -e "for (const f of process.argv.slice(1)) JSON.parse(require('node:fs').readFileSync(f, 'utf8'))" \
            content/pages/ru/internet-reklama-tashkent.json \
            content/pages/ru/kontekstnaya-reklama-tashkent.json \
            content/pages/ru/targetirovannaya-reklama-tashkent.json \
            content/pages/ru/telegram-ads-uzbekistan.json \
            content/pages/ru/smm-prodvizhenie-tashkent.json \
            content/pages/ru/performance-marketing-tashkent.json \
            content/pages/uz/internet-reklama-toshkent.json \
            content/pages/uz/telegram-reklama.json \
            content/pages/uz/smm-xizmatlari.json
          ! grep -RniE 'Рыночные цены|Bozor narxlari|Bozor mo.llallari|eLama|500 ?€|0,01 ?€|0,05 ?€|август 2026|2026-yil avgust|25.?27 mln' \
            content/pages/ru/internet-reklama-tashkent.json \
            content/pages/ru/kontekstnaya-reklama-tashkent.json \
            content/pages/ru/targetirovannaya-reklama-tashkent.json \
            content/pages/ru/telegram-ads-uzbekistan.json \
            content/pages/ru/smm-prodvizhenie-tashkent.json \
            content/pages/ru/performance-marketing-tashkent.json \
            content/pages/uz/internet-reklama-toshkent.json \
            content/pages/uz/telegram-reklama.json \
            content/pages/uz/smm-xizmatlari.json

      - name: Commit verified corrections to the PR branch
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "GPTBot SEO CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            tests/seo-commercial-claims.test.ts \
            docs/seo/RELEASE_2026-08-31_HOT_TRAFFIC_FOUNDATION.md \
            content/pages/ru/internet-reklama-tashkent.json \
            content/pages/ru/kontekstnaya-reklama-tashkent.json \
            content/pages/ru/targetirovannaya-reklama-tashkent.json \
            content/pages/ru/telegram-ads-uzbekistan.json \
            content/pages/ru/smm-prodvizhenie-tashkent.json \
            content/pages/ru/performance-marketing-tashkent.json \
            content/pages/uz/internet-reklama-toshkent.json \
            content/pages/uz/telegram-reklama.json \
            content/pages/uz/smm-xizmatlari.json
          git diff --cached --stat
          git commit -m "fix(seo): replace volatile price claims with scope-led guidance"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
