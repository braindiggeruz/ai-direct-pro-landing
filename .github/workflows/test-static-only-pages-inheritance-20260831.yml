name: test-static-only-pages-inheritance-20260831
on:
  push:
    branches: [ops/test-static-only-pages-inheritance-20260831]
    paths: [.github/workflows/test-static-only-pages-inheritance-20260831.yml]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_SHA: 6cbdb9f40ee23a860f6700c371709fb625f0f18b
      PROJECT: ai-direct-pro-landing
      PREVIEW_BRANCH: static-inheritance-test-20260831
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.SOURCE_SHA }}", fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: yarn}
      - name: Build static artifact and deploy without Functions
        shell: bash
        run: |
          set -euo pipefail
          yarn install --frozen-lockfile --ignore-scripts --non-interactive
          npm --prefix apps/bormi-admin ci --ignore-scripts --no-audit --no-fund
          npm run build:production
          mv functions functions.disabled
          node node_modules/wrangler/bin/wrangler.js pages deploy dist --project-name "$PROJECT" --branch "$PREVIEW_BRANCH" --commit-hash "$SOURCE_SHA" --commit-dirty=true | tee wrangler.txt
          ALIAS=$(grep -Eo 'https://[a-z0-9-]+\.ai-direct-pro-landing\.pages\.dev' wrangler.txt | tail -1)
          test -n "$ALIAS"; echo "ALIAS=$ALIAS" >> "$GITHUB_ENV"
          sleep 5
          for path in /api/auth/config '/api/admin/lead-radar/crawler/status?companyId=test' /admin/lead-radar; do
            code=$(curl --silent --show-error --output body.tmp --write-out '%{http_code}' "$ALIAS$path" || true)
            type=$(file -b --mime-type body.tmp || true)
            bytes=$(wc -c < body.tmp)
            echo "$path|$code|$type|$bytes"
            head -c 300 body.tmp | tr '\n' ' '; echo
          done
      - name: Remove one-shot workflow
        if: always()
        run: |
          git fetch origin ops/test-static-only-pages-inheritance-20260831
          git switch -C ops/test-static-only-pages-inheritance-20260831 origin/ops/test-static-only-pages-inheritance-20260831
          git config user.name "GPTBot Pages Test CI"; git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/test-static-only-pages-inheritance-20260831.yml
          git commit -m "chore: remove static inheritance test"
          git push origin HEAD:ops/test-static-only-pages-inheritance-20260831
