name: deploy-gptbot-production-20260831-r2

on:
  push:
    branches:
      - ops/deploy-gptbot-production-20260831-r2
    paths:
      - .github/workflows/deploy-gptbot-production-20260831-r2.yml

permissions:
  contents: write

concurrency:
  group: gptbot-pages-production-20260831-r2
  cancel-in-progress: false

env:
  RELEASE_SHA: aa2ac83d66b52f9744bef48c9d3c40ce107c1fa7
  RELEASE_TREE: a6d82e3fcf86a73a515751e6775fc95d1622c9df
  CLOUDFLARE_PAGES_PROJECT: ai-direct-pro-landing
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  verify-deploy-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out immutable production release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Assert exact release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$RELEASE_TREE"

      - name: Verify Cloudflare deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::CLOUDFLARE_API_TOKEN is missing'; exit 1; }
          echo 'Cloudflare credential names are present; values are not printed.'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          yarn install --frozen-lockfile --ignore-scripts --non-interactive
          npm --prefix apps/bormi-admin ci --ignore-scripts --no-audit --no-fund

      - name: Re-run public and commercial regression gates
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: yarn test

      - name: Re-run Lead Radar production gates
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        shell: bash
        run: |
          set -euo pipefail
          yarn typecheck:lead-radar
          yarn test:lead-radar
          yarn test:pages-production

      - name: Re-run SEO, TypeScript and secret gates
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        shell: bash
        run: |
          set -euo pipefail
          yarn seo:audit
          yarn tsc -b
          yarn scan:secrets
          git diff --check

      - name: Build and stamp the combined Pages production artifact
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build:production

      - name: Verify current production lineage before publication
        run: npm run release:pages:check

      - name: Deploy guarded artifact to Cloudflare Pages production
        run: npm run deploy:pages:production

      - name: Capture Cloudflare deployment metadata without secrets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PAGES_PROJECT/deployments?per_page=5" \
            > cloudflare-deployments.json
          node <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('cloudflare-deployments.json', 'utf8'));
          if (!body.success || !Array.isArray(body.result)) throw new Error('Cloudflare deployment metadata response is invalid');
          const production = body.result.find((item) => item.environment === 'production');
          if (!production) throw new Error('No production deployment returned');
          const sha = production.deployment_trigger?.metadata?.commit_hash;
          const status = production.latest_stage?.status;
          if (sha !== process.env.RELEASE_SHA) throw new Error(`Production SHA mismatch: ${sha}`);
          if (status !== 'success') throw new Error(`Production stage is not successful: ${status}`);
          const evidence = {
            checkedAt: new Date().toISOString(),
            releaseSha: process.env.RELEASE_SHA,
            project: process.env.CLOUDFLARE_PAGES_PROJECT,
            deploymentId: production.id,
            deploymentUrl: production.url,
            environment: production.environment,
            status,
            commitHash: sha,
          };
          fs.writeFileSync('deployment-evidence.json', `${JSON.stringify(evidence, null, 2)}\n`);
          console.log(JSON.stringify(evidence));
          NODE

      - name: Verify public release, SEO, analytics and Lead Radar canaries
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const origin = 'https://gptbot.uz';
          const releaseSha = process.env.RELEASE_SHA;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function fetchEventually(path, options = {}, attempts = 12) {
            let last;
            for (let i = 0; i < attempts; i += 1) {
              try {
                const response = await fetch(`${origin}${path}${path.includes('?') ? '&' : '?'}release=${releaseSha}&attempt=${i}`, {
                  cache: 'no-store',
                  signal: AbortSignal.timeout(30_000),
                  ...options,
                });
                last = response;
                if (response.ok || options.redirect === 'manual') return response;
              } catch (error) {
                last = error;
              }
              await sleep(10_000);
            }
            if (last instanceof Response) throw new Error(`${path} remained HTTP ${last.status}`);
            throw last ?? new Error(`${path} did not respond`);
          }

          function requireText(text, marker, label) {
            if (!text.includes(marker)) throw new Error(`${label} is missing marker: ${marker}`);
          }

          const manifestResponse = await fetchEventually('/gptbot-release.json');
          const manifest = await manifestResponse.json();
          if (manifest.commit !== releaseSha) throw new Error(`Manifest commit mismatch: ${manifest.commit}`);
          for (const feature of ['audience_directory','mobile_username_selection','bridge_pairing','sending_readiness','campaign_preflight','async_media_check']) {
            if (!manifest.features?.includes(feature)) throw new Error(`Manifest missing feature ${feature}`);
          }

          const routes = [
            '/',
            '/robots.txt',
            '/sitemap.xml',
            '/ru/internet-reklama-tashkent/',
            '/uz/internet-reklama-toshkent/',
            '/ru/otzyvy/',
            '/uz/sharhlar/',
            '/ru/stoimost-chat-bota/',
            '/uz/chat-bot-narxi/',
            '/ru/ai-bot-s-crm-amocrm-bitrix24/',
            '/uz/amocrm-bitrix24-bilan-ai-bot/',
          ];
          const routeEvidence = {};
          for (const route of routes) {
            const response = await fetchEventually(route);
            routeEvidence[route] = { status: response.status, contentType: response.headers.get('content-type') };
          }

          const ruAds = await (await fetchEventually('/ru/internet-reklama-tashkent/')).text();
          for (const marker of [
            '/ru/kontekstnaya-reklama-tashkent/',
            '/ru/targetirovannaya-reklama-tashkent/',
            '/ru/telegram-ads-uzbekistan/',
            '/ru/performance-marketing-tashkent/',
            '/ru/marketingovyi-audit-tashkent/',
          ]) requireText(ruAds, marker, 'RU paid-media hub');

          const uzAds = await (await fetchEventually('/uz/internet-reklama-toshkent/')).text();
          for (const marker of [
            '/uz/telegram-reklama/',
            '/uz/smm-xizmatlari/',
            '/uz/seo-xizmati/',
            '/uz/sayt-yaratish/',
            '/uz/biznes-uchun-ai-bot/',
          ]) requireText(uzAds, marker, 'UZ paid-media hub');

          const home = await (await fetchEventually('/')).text();
          requireText(home, "gtag('event','contact_click'", 'production analytics');
          requireText(home, "contact_method: 'telegram'", 'production analytics');
          if (home.includes("gtag('event','generate_lead'")) throw new Error('Browser still emits generate_lead on a public click');

          for (const route of ['/ru/otzyvy/', '/uz/sharhlar/']) {
            const text = await (await fetchEventually(route)).text();
            if (/★★★★★|AggregateRating|\"@type\"\s*:\s*\"Review\"/.test(text)) {
              throw new Error(`${route} exposes an unverified rating/review marker`);
            }
          }

          const sitemap = await (await fetchEventually('/sitemap.xml')).text();
          for (const marker of ['/ru/internet-reklama-tashkent/', '/uz/internet-reklama-toshkent/']) {
            requireText(sitemap, marker, 'sitemap');
          }

          const admin = await fetchEventually('/admin/lead-radar', { redirect: 'manual' });
          if (![200, 301, 302, 303, 307, 308, 401].includes(admin.status)) {
            throw new Error(`/admin/lead-radar returned unexpected HTTP ${admin.status}`);
          }

          let www = null;
          try {
            const response = await fetch(`https://www.gptbot.uz/?release=${releaseSha}`, {
              redirect: 'manual', cache: 'no-store', signal: AbortSignal.timeout(30_000),
            });
            www = { status: response.status, location: response.headers.get('location') };
          } catch (error) {
            www = { warning: error instanceof Error ? error.message : String(error) };
          }

          const deployment = JSON.parse(fs.readFileSync('deployment-evidence.json', 'utf8'));
          const evidence = {
            ...deployment,
            manifest: {
              commit: manifest.commit,
              artifactSha256: manifest.artifactSha256,
              fileCount: manifest.fileCount,
              features: manifest.features,
            },
            routes: routeEvidence,
            adminLeadRadarStatus: admin.status,
            wwwObservation: www,
            canary: 'pass',
          };
          fs.writeFileSync('deployment-evidence.json', `${JSON.stringify(evidence, null, 2)}\n`);
          console.log(JSON.stringify(evidence));
          NODE

      - name: Preserve deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: gptbot-production-deployment-evidence-${{ env.RELEASE_SHA }}
          path: |
            deployment-evidence.json
            cloudflare-deployments.json
            dist/gptbot-release.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove one-shot deployment workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git switch -C ops/deploy-gptbot-production-20260831-r2 origin/ops/deploy-gptbot-production-20260831-r2
          git config user.name "GPTBot Release CI"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/deploy-gptbot-production-20260831-r2.yml
          git commit -m "chore(release): remove one-shot production deployment workflow"
          git push origin HEAD:ops/deploy-gptbot-production-20260831-r2
