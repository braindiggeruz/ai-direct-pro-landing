name: analytics-contact-semantics

on:
  push:
    branches:
      - seo/hot-traffic-foundation-20260831
    paths:
      - .github/scripts/apply-analytics-contact-semantics.mjs
      - .github/workflows/analytics-contact-semantics.yml

permissions:
  contents: write

concurrency:
  group: analytics-contact-semantics-20260831
  cancel-in-progress: false

jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the exact implementation branch
        uses: actions/checkout@v4
        with:
          ref: seo/hot-traffic-foundation-20260831
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn

      - name: Apply contact-stage analytics correction
        run: node .github/scripts/apply-analytics-contact-semantics.mjs

      - name: Remove one-shot automation from the final branch
        run: git rm -f .github/scripts/apply-analytics-contact-semantics.mjs .github/workflows/analytics-contact-semantics.yml

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts --non-interactive

      - name: Run focused analytics contract tests
        run: node --import tsx --test tests/seo-analytics-privacy.test.ts

      - name: Run complete repository test suite
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: yarn test

      - name: Run SEO audit and TypeScript checks
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          yarn seo:audit
          yarn tsc -b

      - name: Build and prerender the complete site
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: yarn build

      - name: Scan tracked content for secrets
        run: yarn scan:secrets

      - name: Validate event semantics and source parity
        run: |
          git diff --check
          ! grep -n "gtag('event','generate_lead'" scripts/analytics-snippet.ts index.html
          grep -n "gtag('event','contact_click'" scripts/analytics-snippet.ts index.html
          grep -n "contact_method: 'telegram'" scripts/analytics-snippet.ts index.html
          grep -n "telegram_open_attempt" scripts/analytics-snippet.ts index.html
          grep -n "telegram_cta_click" scripts/analytics-metrika.ts src/lib/analytics/yandexMetrika.ts

      - name: Commit verified measurement correction to the branch
        run: |
          git config user.name "GPTBot SEO CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            scripts/analytics-snippet.ts \
            index.html \
            tests/seo-analytics-privacy.test.ts \
            docs/seo/MEASUREMENT_CONTRACT_2026-08-31.md \
            docs/seo/RELEASE_2026-08-31_HOT_TRAFFIC_FOUNDATION.md
          git diff --cached --stat
          git commit -m "fix(analytics): separate contact clicks from generated leads"
          git push origin HEAD:seo/hot-traffic-foundation-20260831
