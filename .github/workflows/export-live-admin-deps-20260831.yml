name: export-live-admin-deps-20260831

on:
  push:
    branches:
      - ops/export-live-admin-deps-20260831
    paths:
      - .github/workflows/export-live-admin-deps-20260831.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORIGIN: https://000d6620.ai-direct-pro-landing.pages.dev

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/export-live-admin-deps-20260831

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn

      - name: Download and beautify current live admin dependencies
        shell: bash
        run: |
          set -euo pipefail
          yarn install --frozen-lockfile --ignore-scripts --non-interactive
          mkdir -p evidence/live-deps evidence/pretty
          for file in \
            triangle-alert-B_MOfUK5.js \
            index-B2CAa6S3.js \
            rolldown-runtime-CXHxssQy.js \
            vendor-Cw8IbyGe.js \
            turnstile-DGTrsUyL.js
          do
            curl --fail --silent --show-error "$ORIGIN/assets/$file?inspect=$(date +%s)" -o "evidence/live-deps/$file"
            sha256sum "evidence/live-deps/$file"
            node --input-type=module - "$file" <<'NODE'
          import fs from 'node:fs';
          import esbuild from 'esbuild';
          const file = process.argv[2];
          const code = fs.readFileSync(`evidence/live-deps/${file}`, 'utf8');
          const result = await esbuild.transform(code, {
            loader: 'js',
            format: 'esm',
            minify: false,
            legalComments: 'none',
            sourcemap: false,
          });
          fs.writeFileSync(`evidence/pretty/${file}`, result.code);
          NODE
          done
          rg -n "leadRadarCrawler|crawler_not_configured|/crawler|collector|CONTACT_COLLECTOR|worker" evidence/pretty evidence/live-deps | head -n 1000 > evidence/collector-api-matches.txt || true
          cat evidence/collector-api-matches.txt

      - uses: actions/upload-artifact@v4
        with:
          name: gptbot-live-admin-dependencies-20260831
          path: evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Remove one-shot workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ops/export-live-admin-deps-20260831
          git switch -C ops/export-live-admin-deps-20260831 origin/ops/export-live-admin-deps-20260831
          git config user.name "GPTBot Reverse Engineering CI"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/export-live-admin-deps-20260831.yml
          git commit -m "chore: remove one-shot live dependency export"
          git push origin HEAD:ops/export-live-admin-deps-20260831
