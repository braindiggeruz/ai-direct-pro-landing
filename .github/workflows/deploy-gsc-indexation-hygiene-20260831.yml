name: deploy-gsc-indexation-hygiene-20260831

on:
  push:
    branches:
      - ops/deploy-gsc-indexation-hygiene-20260831
    paths:
      - .github/workflows/deploy-gsc-indexation-hygiene-20260831.yml

permissions:
  contents: write

concurrency:
  group: gptbot-pages-production
  cancel-in-progress: false

env:
  RELEASE_SHA: 6cbdb9f40ee23a860f6700c371709fb625f0f18b
  RELEASE_BRANCH: release/gsc-indexation-hygiene-20260831
  PROJECT: ai-direct-pro-landing
  OLD_DEPLOYMENT_ID: 83b965f7-d6a7-4f41-a872-0d4bc5da578d
  OLD_COMMIT: e81f65e6c4757f77ed2991ef12b599d956185e55
  OLD_ARTIFACT: 31c9b6c25e9ebd87286de8b79142bb35b9a43dc317eae87dfc9ee19cd896902a
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  verify-deploy-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out exact reviewed release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Assert source lineage, clean tree and credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor e81f65e6c4757f77ed2991ef12b599d956185e55 HEAD
          git merge-base --is-ancestor d629b4bcc471f6310f335af89fc8022b74b9f839 HEAD
          git merge-base --is-ancestor 9cdfff152597a43ba7b3eea89bd3abe23db760d6 HEAD
          test -z "$(git status --porcelain)"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -f tests/gsc-indexation-hygiene.test.ts
          ! grep -F 'leftKey.localeCompare(rightKey)' functions/platform/lead-radar/schema-contract.ts
          ! grep -F 'leftKey.localeCompare(rightKey)' functions/platform/lead-radar/telegram-campaign-schema.ts

      - name: Prove current production still matches the inspected release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT" \
            > evidence/before-project.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const body = JSON.parse(fs.readFileSync('evidence/before-project.json', 'utf8'));
          const deployment = body.result?.canonical_deployment;
          if (!body.success) throw new Error('Cloudflare project lookup failed');
          if (deployment?.id !== process.env.OLD_DEPLOYMENT_ID) throw new Error(`production deployment changed: ${deployment?.id}`);
          if (deployment?.environment !== 'production' || deployment?.latest_stage?.status !== 'success') throw new Error('current deployment is not confirmed successful production');
          if (deployment?.deployment_trigger?.metadata?.commit_hash !== process.env.OLD_COMMIT) throw new Error(`production commit changed: ${deployment?.deployment_trigger?.metadata?.commit_hash}`);
          const safe = {
            id: deployment.id,
            url: deployment.url,
            environment: deployment.environment,
            status: deployment.latest_stage.status,
            commit: deployment.deployment_trigger.metadata.commit_hash,
            aliases: deployment.aliases ?? [],
          };
          fs.writeFileSync('evidence/before-safe.json', JSON.stringify(safe, null, 2) + '\n');
          const origins = ['https://gptbot.uz', deployment.url];
          for (const origin of origins) {
            const response = await fetch(`${origin}/gptbot-release.json?guard=${Date.now()}`, { cache: 'no-store', signal: AbortSignal.timeout(30000) });
            if (!response.ok) throw new Error(`${origin}: manifest HTTP ${response.status}`);
            const manifest = await response.json();
            if (manifest.commit !== process.env.OLD_COMMIT || manifest.artifactSha256 !== process.env.OLD_ARTIFACT || manifest.fileCount !== 870) {
              throw new Error(`${origin}: previous artifact mismatch`);
            }
          }
          console.log('PREVIOUS_PRODUCTION_GUARD=pass');
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn

      - name: Install locked dependencies
        run: |
          yarn install --frozen-lockfile --ignore-scripts --non-interactive
          npm --prefix apps/bormi-admin ci --ignore-scripts --no-audit --no-fund

      - name: Run complete regression, SEO and security gates
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          yarn test:gsc-indexation
          yarn test
          yarn typecheck:lead-radar
          yarn test:lead-radar
          yarn test:pages-production
          yarn seo:audit
          yarn tsc -b
          yarn scan:secrets
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Confirm immutable release ref and build exact artifact
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git push origin HEAD:refs/heads/$RELEASE_BRANCH --force-with-lease || git push origin HEAD:refs/heads/$RELEASE_BRANCH
          npm run build:production
          npx --no-install tsx scripts/release/pages-production.ts check
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('dist/gptbot-release.json', 'utf8'));
          if (manifest.commit !== process.env.RELEASE_SHA) throw new Error('release stamp mismatch');
          if (manifest.fileCount !== 870) throw new Error(`unexpected file count ${manifest.fileCount}`);
          for (const feature of ['audience_directory','mobile_username_selection','bridge_pairing','sending_readiness','campaign_preflight','async_media_check']) {
            if (!manifest.features.includes(feature)) throw new Error(`missing ${feature}`);
          }
          fs.writeFileSync('evidence/candidate-safe.json', JSON.stringify(manifest, null, 2) + '\n');
          console.log(`CANDIDATE_ARTIFACT=${manifest.artifactSha256}`);
          NODE
          ! grep -RniE 'SearchAction|search_term_string|query-input' dist/index.html dist/ru/blog/index.html dist/uz/blog/index.html
          grep -F '/ru/telegram-bot-uzbekistan/  /ru/telegram-bot-dlya-biznesa/  301' dist/_redirects
          grep -F '/gpt-uzbek-tilida/  /uz/gpt-uzbek-tilida/  301' dist/_redirects
          grep -F '/gpt-chat/  /ru/gpt-chat/  301' dist/_redirects

      - name: Final race guard and Cloudflare Pages production upload
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT" \
            > evidence/preupload-project.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const body = JSON.parse(fs.readFileSync('evidence/preupload-project.json', 'utf8'));
          const deployment = body.result?.canonical_deployment;
          if (!body.success || deployment?.id !== process.env.OLD_DEPLOYMENT_ID || deployment?.latest_stage?.status !== 'success' || deployment?.deployment_trigger?.metadata?.commit_hash !== process.env.OLD_COMMIT) {
            throw new Error('production changed during verification; upload aborted');
          }
          console.log('RACE_GUARD=pass');
          NODE
          node node_modules/wrangler/bin/wrangler.js pages deploy dist \
            --project-name "$PROJECT" \
            --branch main \
            --commit-hash "$RELEASE_SHA" \
            --commit-dirty=false

      - name: Verify new production, sitemap, redirects and Lead Radar preservation
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          async function project() {
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/pages/projects/${process.env.PROJECT}`, {
              headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` },
              cache: 'no-store',
              signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) throw new Error(`Cloudflare project HTTP ${response.status}`);
            return response.json();
          }
          let deployment;
          for (let i = 0; i < 36; i++) {
            const body = await project();
            const candidate = body.result?.canonical_deployment;
            if (body.success && candidate?.environment === 'production' && candidate?.latest_stage?.status === 'success' && candidate?.deployment_trigger?.metadata?.commit_hash === process.env.RELEASE_SHA) {
              deployment = candidate;
              break;
            }
            await sleep(5000);
          }
          if (!deployment) throw new Error('new production deployment was not observed');

          const expected = JSON.parse(fs.readFileSync('dist/gptbot-release.json', 'utf8'));
          const origins = ['https://gptbot.uz', deployment.url];
          async function get(url, options = {}) {
            let error;
            for (let i = 0; i < 12; i++) {
              try {
                const response = await fetch(url, { cache: 'no-store', signal: AbortSignal.timeout(30000), ...options });
                return response;
              } catch (value) {
                error = value;
                await sleep(2500);
              }
            }
            throw error;
          }
          function canonicalOf(html) {
            for (const tag of html.match(/<link\b[^>]*>/gi) || []) {
              if (!/\brel=["'][^"']*canonical[^"']*["']/i.test(tag)) continue;
              const href = tag.match(/\bhref=["']([^"']+)["']/i)?.[1];
              if (href) return href;
            }
            return null;
          }
          async function expectRedirect(origin, path, expectedLocation) {
            const response = await get(`${origin}${path}?release=${process.env.RELEASE_SHA}`, { redirect: 'manual' });
            if (response.status !== 301) throw new Error(`${origin}${path}: expected 301, got ${response.status}`);
            const location = new URL(response.headers.get('location'), `${origin}${path}`).href;
            if (location !== `${origin}${expectedLocation}` && !(origin.includes('pages.dev') && location === `https://gptbot.uz${expectedLocation}`)) {
              throw new Error(`${origin}${path}: unexpected location ${location}`);
            }
          }
          async function expect404(origin, path) {
            const response = await get(`${origin}${path}?release=${process.env.RELEASE_SHA}`, { redirect: 'manual' });
            if (response.status !== 404) throw new Error(`${origin}${path}: expected 404, got ${response.status}`);
            const html = await response.text();
            if (!/noindex\s*,?\s*nofollow/i.test(html)) throw new Error(`${origin}${path}: 404 is missing noindex`);
          }

          const evidence = {
            checkedAt: new Date().toISOString(),
            releaseSha: process.env.RELEASE_SHA,
            deploymentId: deployment.id,
            deploymentUrl: deployment.url,
            aliases: deployment.aliases ?? [],
            previous: {
              deploymentId: process.env.OLD_DEPLOYMENT_ID,
              commit: process.env.OLD_COMMIT,
              artifactSha256: process.env.OLD_ARTIFACT,
            },
            origins: {},
          };

          for (const origin of origins) {
            const manifestResponse = await get(`${origin}/gptbot-release.json?release=${process.env.RELEASE_SHA}`);
            if (!manifestResponse.ok) throw new Error(`${origin}: manifest ${manifestResponse.status}`);
            const manifest = await manifestResponse.json();
            if (JSON.stringify(manifest) !== JSON.stringify(expected)) throw new Error(`${origin}: manifest mismatch`);

            for (const path of ['/', '/robots.txt', '/sitemap.xml', '/ru/internet-reklama-tashkent/', '/uz/internet-reklama-toshkent/', '/ru/telegram-bot-dlya-biznesa/', '/admin/lead-radar']) {
              const response = await get(`${origin}${path}?release=${process.env.RELEASE_SHA}`);
              if (!response.ok) throw new Error(`${origin}${path}: HTTP ${response.status}`);
            }

            const home = await (await get(`${origin}/?release=${process.env.RELEASE_SHA}`)).text();
            if (/SearchAction|search_term_string|query-input/.test(home)) throw new Error(`${origin}: obsolete SearchAction remains`);

            const telegram = await (await get(`${origin}/ru/telegram-bot-dlya-biznesa/?release=${process.env.RELEASE_SHA}`)).text();
            if (!/Узбекистан/.test(telegram)) throw new Error(`${origin}: Telegram owner lacks Uzbekistan intent`);
            const telegramCanonical = canonicalOf(telegram);
            if (telegramCanonical !== 'https://gptbot.uz/ru/telegram-bot-dlya-biznesa/') throw new Error(`${origin}: Telegram canonical mismatch ${telegramCanonical}`);

            await expectRedirect(origin, '/ru/blog/?q=%7Bsearch_term_string%7D&', '/ru/blog/');
            await expectRedirect(origin, '/ru/telegram-bot-uzbekistan/', '/ru/telegram-bot-dlya-biznesa/');
            await expectRedirect(origin, '/gpt-uzbek-tilida/', '/uz/gpt-uzbek-tilida/');
            await expectRedirect(origin, '/gpt-chat/', '/ru/gpt-chat/');
            for (const path of ['/cabinet', '/oauth', '/api', '/callback', '/reset-password', '/auth', '/account']) await expect404(origin, path);

            const sitemapResponse = await get(`${origin}/sitemap.xml?release=${process.env.RELEASE_SHA}`);
            const sitemap = await sitemapResponse.text();
            const urls = [...new Set([...sitemap.matchAll(/<loc>([^<]+)<\/loc>/g)].map((match) => match[1].trim()))];
            if (urls.length !== 260) throw new Error(`${origin}: expected 260 sitemap URLs, got ${urls.length}`);
            for (const retired of ['/ru/telegram-bot-uzbekistan/', '/gpt-uzbek-tilida/', '/gpt-chat/', '/ru/gpt-bot-dlya-biznesa/', '/ru/bot-dlya-obrabotki-zayavok/']) {
              if (sitemap.includes(`<loc>https://gptbot.uz${retired}</loc>`)) throw new Error(`${origin}: retired URL remains in sitemap ${retired}`);
            }
            let cursor = 0;
            const results = new Array(urls.length);
            async function worker() {
              while (cursor < urls.length) {
                const index = cursor++;
                const url = urls[index];
                const fetchUrl = origin.includes('pages.dev') ? url.replace('https://gptbot.uz', origin) : url;
                const response = await get(`${fetchUrl}?release=${process.env.RELEASE_SHA}`);
                const html = await response.text();
                results[index] = { url, status: response.status, canonical: canonicalOf(html) };
              }
            }
            await Promise.all(Array.from({ length: 8 }, worker));
            const bad = results.filter((item) => item.status !== 200 || item.canonical !== item.url);
            if (bad.length) throw new Error(`${origin}: sitemap validation failed ${JSON.stringify(bad.slice(0, 5))}`);

            evidence.origins[origin] = {
              manifest: { commit: manifest.commit, artifactSha256: manifest.artifactSha256, fileCount: manifest.fileCount, features: manifest.features },
              sitemapCount: urls.length,
              sitemapSelfCanonicalPass: true,
              legacyRedirectsPass: true,
              private404Pass: true,
              searchActionAbsent: true,
              telegramOwnerPass: true,
              leadRadarShellPass: true,
            };
          }

          const www = await get(`https://www.gptbot.uz/uz/chat-bot-narxi/?release=${process.env.RELEASE_SHA}`, { redirect: 'manual' });
          if (www.status !== 301) throw new Error(`www canonical redirect expected 301, got ${www.status}`);
          evidence.wwwCanonicalRedirect = { status: www.status, location: www.headers.get('location') };
          evidence.canary = 'pass';
          fs.writeFileSync('evidence/deployment-evidence.json', JSON.stringify(evidence, null, 2) + '\n');
          console.log(`NEW_DEPLOYMENT_ID=${deployment.id}`);
          console.log(`IMMUTABLE_URL=${deployment.url}`);
          console.log(`ARTIFACT_SHA256=${expected.artifactSha256}`);
          console.log('LIVE_INDEXATION_CANARY=pass');
          NODE

      - name: Upload sanitized production evidence
        uses: actions/upload-artifact@v4
        with:
          name: gptbot-gsc-indexation-production-evidence-${{ env.RELEASE_SHA }}
          path: |
            evidence/before-safe.json
            evidence/candidate-safe.json
            evidence/deployment-evidence.json
            dist/gptbot-release.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove one-shot deployment workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ops/deploy-gsc-indexation-hygiene-20260831
          git switch -C ops/deploy-gsc-indexation-hygiene-20260831 origin/ops/deploy-gsc-indexation-hygiene-20260831
          git config user.name "GPTBot Release CI"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/deploy-gsc-indexation-hygiene-20260831.yml
          git commit -m "chore(release): remove one-shot GSC deployment workflow"
          git push origin HEAD:ops/deploy-gsc-indexation-hygiene-20260831
