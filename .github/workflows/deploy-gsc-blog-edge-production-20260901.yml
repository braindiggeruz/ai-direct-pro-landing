name: deploy-gsc-blog-edge-production-20260901

on:
  push:
    branches:
      - ops/deploy-gsc-blog-edge-production-20260901-r1
    paths:
      - .github/workflows/deploy-gsc-blog-edge-production-20260901.yml

permissions:
  contents: write

concurrency:
  group: gptbot-pages-production
  cancel-in-progress: false

env:
  RELEASE_SHA: 49a8afd4f25bbd2c9adbd3f7b7b90a3f8d04b101
  RELEASE_BRANCH: release/gsc-blog-edge-production-20260901
  EXPECTED_MAIN_SHA: a45db41ef32a3077c0f9af2f912d0c1239d127d9
  PROJECT: ai-direct-pro-landing
  EXPECTED_OLD_DEPLOYMENT_ID: 6da93a09-b662-42d5-948e-ce8e19a3cba1
  EXPECTED_OLD_COMMIT: 39f67ad83edc4600f9700d7a9230f28996abc3e1
  EXPECTED_OLD_ARTIFACT: 3b8c157411edcc66de071d24c6c2be05d0099adbfbe50e8a0143883d82dc7a5f
  EXPECTED_OLD_ADMIN_HASH: e2fe0a69594e8a274a181b1424c3db5211078d08126029c0ae2a77dcc00c1f70
  PREVIEW_BRANCH: gsc-blog-edge-preflight-20260901
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  verify-deploy-align:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out deployment tooling
        uses: actions/checkout@v4
        with:
          ref: ops/deploy-gsc-blog-edge-production-20260901-r1
          path: ops
          fetch-depth: 0

      - name: Check out exact reviewed release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          path: release
          fetch-depth: 0

      - name: Assert immutable source lineage and edge route scope
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git ls-remote origin refs/heads/$RELEASE_BRANCH | cut -f1)" = "$RELEASE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN_SHA"
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" "$RELEASE_SHA"
          git diff --quiet
          git diff --cached --quiet
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -f migrations/0056_lead_radar_crawler.sql
          test -f tests/gsc-indexation-hygiene.test.ts
          test -f tests/lead-radar-crawler.test.ts
          test -f functions/lib/blog-index-edge.ts
          test -f functions/ru/blog/index.ts
          test -f functions/uz/blog/index.ts
          grep -F "createBlogIndexHandler('/ru/blog/')" functions/ru/blog/index.ts
          grep -F "createBlogIndexHandler('/uz/blog/')" functions/uz/blog/index.ts
          grep -F 'MAX_DIRECTORY_CONTACT_CANDIDATES_PER_COMPANY = 256' functions/platform/lead-radar/recipient-directory.ts
          grep -F 'MAX_DIRECTORY_PHONE_EVIDENCE_PER_COMPANY = 128' functions/platform/lead-radar/recipient-directory.ts
          grep -F 'matches.filter((group)=>group.hasBusinessContact)' functions/platform/lead-radar/audiences.ts
          ! grep -F 'JSON.parse(member.telegram_contact_json' functions/platform/lead-radar/audiences.ts
          node - <<'NODE'
          const routes = require('./public/_routes.json');
          for (const route of ['/api/*','/admin-tools/*','/admin/*','/robots.txt','/ru/blog','/ru/blog/','/uz/blog','/uz/blog/']) {
            if (!routes.include.includes(route)) throw new Error(`missing route: ${route}`);
          }
          if (routes.include.includes('/ru/blog/*') || routes.include.includes('/uz/blog/*')) {
            throw new Error('article wildcard must remain outside Functions invocation');
          }
          NODE

      - name: Guard the exact live release being replaced
        working-directory: release
        run: node ../ops/.github/scripts/gsc-crawler-release/guard.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: release/yarn.lock

      - name: Install locked dependencies
        working-directory: release
        run: |
          yarn install --frozen-lockfile --ignore-scripts --non-interactive
          npm --prefix apps/bormi-admin ci --ignore-scripts --no-audit --no-fund

      - name: Run complete regression, SEO and security gates
        working-directory: release
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test tests/lead-radar-audiences.test.ts tests/lead-radar-crawler.test.ts tests/lead-radar-crawler-contract.test.ts
          yarn test:gsc-indexation
          yarn test
          yarn typecheck:lead-radar
          yarn test:lead-radar
          yarn test:pages-production
          yarn seo:audit
          yarn tsc -b
          yarn scan:secrets
          git diff --check
          git diff --quiet
          git diff --cached --quiet

      - name: Build and freeze exact candidate artifact
        working-directory: release
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        shell: bash
        run: |
          set -euo pipefail
          npm run build:production
          npx --no-install tsx scripts/release/pages-production.ts check
          node ../ops/.github/scripts/gsc-crawler-release/verify-candidate.mjs
          ! grep -RniE 'SearchAction|search_term_string|query-input' dist/index.html dist/ru/blog/index.html dist/uz/blog/index.html
          grep -F '/ru/telegram-bot-uzbekistan/  /ru/telegram-bot-dlya-biznesa/  301' dist/_redirects
          grep -F '/gpt-uzbek-tilida/  /uz/gpt-uzbek-tilida/  301' dist/_redirects
          grep -F '/gpt-chat/  /ru/gpt-chat/  301' dist/_redirects
          node - <<'NODE'
          const routes = require('./dist/_routes.json');
          for (const route of ['/ru/blog','/ru/blog/','/uz/blog','/uz/blog/']) {
            if (!routes.include.includes(route)) throw new Error(`built _routes.json missing ${route}`);
          }
          if (routes.include.includes('/ru/blog/*') || routes.include.includes('/uz/blog/*')) throw new Error('built routes intercept articles');
          NODE

      - name: Exercise candidate Functions against live D1 in isolated preview
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          export PROBE_TOKEN=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
          echo "::add-mask::$PROBE_TOKEN"
          echo "PROBE_TOKEN=$PROBE_TOKEN" >> "$GITHUB_ENV"
          node ../ops/.github/scripts/gsc-crawler-release/write-probe.mjs
          node node_modules/wrangler/bin/wrangler.js pages deploy dist \
            --project-name "$PROJECT" \
            --branch "$PREVIEW_BRANCH" \
            --commit-hash "$RELEASE_SHA" \
            --commit-dirty=true | tee evidence/preflight-preview.log
          export PREVIEW_URL=$(grep -Eo 'https://[a-z0-9-]+\.ai-direct-pro-landing\.pages\.dev' evidence/preflight-preview.log | head -1)
          test -n "$PREVIEW_URL"
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          node ../ops/.github/scripts/gsc-crawler-release/check-preview.mjs
          rm -f functions/api/internal/release-directory-probe.ts
          git diff --quiet
          git diff --cached --quiet

      - name: Verify real Pages routing on preview
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const origin = process.env.PREVIEW_URL;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          async function eventually(label, operation) {
            let last;
            for (let i = 0; i < 24; i++) {
              try { return await operation(); }
              catch (error) { last = error; await sleep(3000); }
            }
            throw new Error(`${label}: ${last instanceof Error ? last.message : String(last)}`);
          }
          async function redirect(path, expectedPath, requireApex = false) {
            return eventually(path, async () => {
              const response = await fetch(`${origin}${path}`, { redirect: 'manual', cache: 'no-store', signal: AbortSignal.timeout(30000) });
              if (response.status !== 301) throw new Error(`expected 301, got ${response.status}`);
              const location = new URL(response.headers.get('location'), `${origin}${path}`);
              if (`${location.pathname}${location.search}` !== expectedPath) throw new Error(`unexpected location ${location.href}`);
              if (requireApex && location.hostname !== 'gptbot.uz') throw new Error(`unexpected host ${location.hostname}`);
              return { status: response.status, location: location.href };
            });
          }
          const ru = await redirect('/ru/blog/?q=%7Bsearch_term_string%7D', '/ru/blog/', true);
          const uz = await redirect('/uz/blog/?q=sinov&utm_source=gsc', '/uz/blog/?utm_source=gsc', true);
          const legacy = await redirect('/ru/telegram-bot-uzbekistan/', '/ru/telegram-bot-dlya-biznesa/');
          const clean = await eventually('clean RU blog index', async () => {
            const response = await fetch(`${origin}/ru/blog/?utm_source=preflight`, { cache: 'no-store', signal: AbortSignal.timeout(30000) });
            if (response.status !== 200) throw new Error(`HTTP ${response.status}`);
            const html = await response.text();
            const tags = html.match(/<link\b[^>]*>/gi) || [];
            let canonical = null;
            for (const tag of tags) {
              if (!/\brel=["'][^"']*canonical[^"']*["']/i.test(tag)) continue;
              canonical = tag.match(/\bhref=["']([^"']+)["']/i)?.[1] || null;
            }
            if (canonical !== 'https://gptbot.uz/ru/blog/') throw new Error(`canonical ${canonical}`);
            return { status: response.status, canonical };
          });
          const article = await eventually('blog article static fallback', async () => {
            const response = await fetch(`${origin}/ru/blog/seo-audit-sayta-chek-list/?preflight=${Date.now()}`, { cache: 'no-store', signal: AbortSignal.timeout(30000) });
            if (response.status !== 200) throw new Error(`HTTP ${response.status}`);
            return { status: response.status };
          });
          fs.writeFileSync('evidence/blog-edge-preview-safe.json', JSON.stringify({ checkedAt: new Date().toISOString(), origin, ru, uz, legacy, clean, article, result: 'pass' }, null, 2) + '\n');
          console.log('BLOG_EDGE_PREVIEW_CANARY=pass');
          NODE

      - name: Final production and main race guard
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN_SHA"
          node ../ops/.github/scripts/gsc-crawler-release/race-guard.mjs

      - name: Deploy exact artifact and Functions to production
        id: deploy
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/wrangler/bin/wrangler.js pages deploy dist \
            --project-name "$PROJECT" \
            --branch main \
            --commit-hash "$RELEASE_SHA" \
            --commit-dirty=false | tee evidence/production-deploy.log
          node ../ops/.github/scripts/gsc-crawler-release/wait-deployment.mjs

      - name: Run production SEO, crawler and heartbeat canaries
        id: canary
        working-directory: release
        run: node ../ops/.github/scripts/gsc-crawler-release/canary.mjs

      - name: Verify Uzbek blog edge routing in production
        id: edgecanary
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const origins = ['https://gptbot.uz', process.env.NEW_DEPLOYMENT_URL];
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          async function eventually(label, operation) {
            let last;
            for (let i = 0; i < 24; i++) {
              try { return await operation(); }
              catch (error) { last = error; await sleep(3000); }
            }
            throw new Error(`${label}: ${last instanceof Error ? last.message : String(last)}`);
          }
          const evidence = { checkedAt: new Date().toISOString(), origins: {} };
          for (const origin of origins) {
            const redirect = await eventually(`${origin} UZ query redirect`, async () => {
              const response = await fetch(`${origin}/uz/blog/?q=sinov&utm_source=gsc`, { redirect: 'manual', cache: 'no-store', signal: AbortSignal.timeout(30000) });
              if (response.status !== 301) throw new Error(`expected 301, got ${response.status}`);
              const location = new URL(response.headers.get('location'), origin);
              if (location.hostname !== 'gptbot.uz' || `${location.pathname}${location.search}` !== '/uz/blog/?utm_source=gsc') throw new Error(`location ${location.href}`);
              return { status: response.status, location: location.href };
            });
            const clean = await eventually(`${origin} clean UZ blog`, async () => {
              const response = await fetch(`${origin}/uz/blog/?utm_source=production_canary`, { cache: 'no-store', signal: AbortSignal.timeout(30000) });
              if (response.status !== 200) throw new Error(`HTTP ${response.status}`);
              const html = await response.text();
              const tags = html.match(/<link\b[^>]*>/gi) || [];
              let canonical = null;
              for (const tag of tags) {
                if (!/\brel=["'][^"']*canonical[^"']*["']/i.test(tag)) continue;
                canonical = tag.match(/\bhref=["']([^"']+)["']/i)?.[1] || null;
              }
              if (canonical !== 'https://gptbot.uz/uz/blog/') throw new Error(`canonical ${canonical}`);
              return { status: response.status, canonical };
            });
            const article = await fetch(`${origin}/uz/blog/smm-nima/?release=${process.env.RELEASE_SHA}`, { cache: 'no-store', signal: AbortSignal.timeout(30000) });
            if (article.status !== 200) throw new Error(`${origin}: UZ article HTTP ${article.status}`);
            evidence.origins[origin] = { redirect, clean, article: { status: article.status } };
          }
          evidence.result = 'pass';
          fs.writeFileSync('evidence/blog-edge-production-safe.json', JSON.stringify(evidence, null, 2) + '\n');
          console.log('BLOG_EDGE_PRODUCTION_CANARY=pass');
          NODE

      - name: Roll back automatically if any production canary fails
        if: ${{ failure() && steps.deploy.outcome == 'success' && (steps.canary.outcome == 'failure' || steps.edgecanary.outcome == 'failure') }}
        working-directory: release
        run: node ../ops/.github/scripts/gsc-crawler-release/rollback.mjs

      - name: Fast-forward main to deployed source of truth
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_MAIN=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$CURRENT_MAIN" = "$EXPECTED_MAIN_SHA" || test "$CURRENT_MAIN" = "$RELEASE_SHA"
          if [ "$CURRENT_MAIN" != "$RELEASE_SHA" ]; then git push origin "$RELEASE_SHA:refs/heads/main"; fi
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$RELEASE_SHA"
          node -e "require('fs').writeFileSync('evidence/main-alignment-safe.json',JSON.stringify({alignedAt:new Date().toISOString(),previous:'$EXPECTED_MAIN_SHA',current:'$RELEASE_SHA'},null,2)+'\n')"
          echo 'MAIN_ALIGNMENT=pass'

      - name: Verify final canonical deployment and source alignment
        working-directory: release
        run: node ../ops/.github/scripts/gsc-crawler-release/final-verify.mjs

      - name: Upload sanitized release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gptbot-gsc-blog-edge-production-evidence-${{ env.RELEASE_SHA }}
          path: |
            release/evidence/*.json
            release/evidence/production-deploy.log
            release/dist/gptbot-release.json
          if-no-files-found: warn
          retention-days: 30

      - name: Delete temporary D1 preview
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ -n "${PREVIEW_DEPLOYMENT_ID:-}" ]; then
            curl --silent --show-error --request DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments/$PREVIEW_DEPLOYMENT_ID?force=true" >/dev/null
          fi

      - name: Remove one-shot deployment workflow
        if: always()
        continue-on-error: true
        working-directory: ops
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ops/deploy-gsc-blog-edge-production-20260901-r1
          git switch -C ops/deploy-gsc-blog-edge-production-20260901-r1 origin/ops/deploy-gsc-blog-edge-production-20260901-r1
          git config user.name "GPTBot Production Release CI"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/deploy-gsc-blog-edge-production-20260901.yml
          git commit -m "chore(release): remove one-shot GSC blog edge deploy workflow"
          git push origin HEAD:ops/deploy-gsc-blog-edge-production-20260901-r1
