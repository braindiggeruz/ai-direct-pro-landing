name: gsc-indexation-live-audit-20260831-r2

on:
  push:
    branches:
      - ops/gsc-indexation-audit-20260831-r2
    paths:
      - .github/workflows/gsc-indexation-live-audit-20260831-r2.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AUDIT_SHA: e81f65e6c4757f77ed2991ef12b599d956185e55
      ORIGIN: https://gptbot.uz

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUDIT_SHA }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Crawl live indexation surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUDIT_SHA"
          mkdir -p reports
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const origin = process.env.ORIGIN;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          const canonicalExamples = [
            '/ru/blog/?q={search_term_string}',
            'https://www.gptbot.uz/ru/gpt-bot-dlya-biznesa/',
            'https://www.gptbot.uz/ru/blog/ai-bot-dlya-salona-krasoty-uzb-podklyuchenie-scenarii-ogranicheniya/',
            'https://www.gptbot.uz/uz/chat-bot-narxi/',
            'https://www.gptbot.uz/ru/gpt-bot-ili-obychnyy-chat-bot/',
            'https://www.gptbot.uz/uz/gpt-bot-yoki-oddiy-chat-bot/',
            'https://www.gptbot.uz/uz/ozbekiston-boylab-chat-bot/',
            'https://www.gptbot.uz/uz/fitnes-klub-uchun-ai-bot/',
            'https://www.gptbot.uz/ru/chat-bot-v-samarkande/',
            'https://www.gptbot.uz/uz/biznes-uchun-ai-bot/',
          ];
          const notFoundExamples = [
            '/ru/telegram-bot-uzbekistan/', '/gpt-uzbek-tilida/', '/cabinet', '/gpt-chat/',
            '/oauth', '/api', '/callback', '/reset-password', '/auth', '/account',
          ];
          const redirectExamples = [
            '/blog/', '/ru/blog/chat-bot-dlya-biznesa-tashkent/', 'http://www.gptbot.uz/',
            '/ru/bot-dlya-obrabotki-zayavok/', '/ru/gpt-bot-dlya-biznesa/',
            '/ru/blog/kak-podklyuchit-telegram-bot-k-crm/', 'https://www.gptbot.uz/',
            '/?lang=ru', 'http://gptbot.uz/', '/ru/razrabotka-sayta-pod-klyuch/',
            '/ru/blog/telegram-bot-biznes-tsena-tashkent/',
            '/ru/blog/telegram-bot-dlya-biznesa-tashkent/',
            '/ru/blog/chat-bot-na-russkom-i-uzbekskom-yazyke/',
          ];

          const absolute = (value) => /^https?:\/\//i.test(value) ? value : new URL(value, origin).href;
          function canonicalOf(html) {
            for (const tag of html.match(/<link\b[^>]*>/gi) || []) {
              if (!/\brel=["'][^"']*canonical[^"']*["']/i.test(tag)) continue;
              const href = tag.match(/\bhref=["']([^"']+)["']/i)?.[1];
              if (href) return href;
            }
            return null;
          }
          function robotsOf(html) {
            for (const tag of html.match(/<meta\b[^>]*>/gi) || []) {
              if (!/\bname=["']robots["']/i.test(tag)) continue;
              return tag.match(/\bcontent=["']([^"']*)["']/i)?.[1] || '';
            }
            return null;
          }
          function linksOf(html, base) {
            const links = [];
            for (const match of html.matchAll(/<a\b[^>]*\bhref=["']([^"']+)["']/gi)) {
              const raw = match[1];
              if (/^(#|mailto:|tel:|javascript:|data:)/i.test(raw)) continue;
              try { links.push(new URL(raw, base).href); } catch {}
            }
            return [...new Set(links)];
          }
          async function fetchRetry(url, redirect = 'follow') {
            let error;
            for (let i = 0; i < 4; i++) {
              try {
                return await fetch(url, {
                  redirect,
                  cache: 'no-store',
                  headers: { 'user-agent': 'GPTBot-GSC-Live-Audit/2026-08-31' },
                  signal: AbortSignal.timeout(30000),
                });
              } catch (value) {
                error = value;
                await sleep(500 * (i + 1));
              }
            }
            throw error;
          }
          async function trace(value) {
            let current = absolute(value);
            const hops = [];
            for (let i = 0; i < 10; i++) {
              const response = await fetchRetry(current, 'manual');
              const location = response.headers.get('location');
              hops.push({ url: current, status: response.status, location });
              if (![301,302,303,307,308].includes(response.status) || !location) {
                let html = '';
                if (/text\/html/i.test(response.headers.get('content-type') || '')) html = await response.text();
                return {
                  input: absolute(value), hops, finalUrl: current, finalStatus: response.status,
                  canonical: html ? canonicalOf(html) : null,
                  robots: html ? robotsOf(html) : null,
                  searchAction: html ? /search_term_string|SearchAction|query-input/i.test(html) : false,
                };
              }
              current = new URL(location, current).href;
            }
            return { input: absolute(value), hops, error: 'too_many_redirects' };
          }
          async function traceList(values) {
            const result = [];
            for (const value of values) {
              try { result.push(await trace(value)); }
              catch (error) { result.push({ input: absolute(value), error: String(error) }); }
            }
            return result;
          }

          const sitemapResponse = await fetchRetry(origin + '/sitemap.xml');
          if (!sitemapResponse.ok) throw new Error(`sitemap HTTP ${sitemapResponse.status}`);
          const xml = await sitemapResponse.text();
          const urls = [...new Set([...xml.matchAll(/<loc>([^<]+)<\/loc>/g)].map((m) => m[1].trim()))];
          const pages = new Array(urls.length);
          let cursor = 0;
          async function pageWorker() {
            while (cursor < urls.length) {
              const index = cursor++;
              const url = urls[index];
              try {
                const response = await fetchRetry(url);
                const html = await response.text();
                pages[index] = {
                  url, status: response.status, finalUrl: response.url,
                  canonical: canonicalOf(html), robots: robotsOf(html),
                  searchAction: /search_term_string|SearchAction|query-input/i.test(html),
                  links: linksOf(html, response.url),
                };
              } catch (error) { pages[index] = { url, error: String(error) }; }
            }
          }
          await Promise.all(Array.from({ length: 8 }, pageWorker));

          const sourcesByTarget = new Map();
          for (const page of pages) {
            for (const link of page.links || []) {
              const parsed = new URL(link);
              if (!/(^|\.)gptbot\.uz$/i.test(parsed.hostname)) continue;
              const list = sourcesByTarget.get(parsed.href) || [];
              if (list.length < 25) list.push(page.url);
              sourcesByTarget.set(parsed.href, list);
            }
          }
          const targets = [...sourcesByTarget.entries()];
          const internal = new Array(targets.length);
          let targetCursor = 0;
          async function targetWorker() {
            while (targetCursor < targets.length) {
              const index = targetCursor++;
              const [target, sources] = targets[index];
              try { internal[index] = { target, sources, ...(await trace(target)) }; }
              catch (error) { internal[index] = { target, sources, error: String(error) }; }
            }
          }
          await Promise.all(Array.from({ length: 8 }, targetWorker));

          const canonical = await traceList(canonicalExamples);
          const notFound = await traceList(notFoundExamples);
          const redirects = await traceList(redirectExamples);
          const defects = {
            sitemapNon200: pages.filter((p) => p.status !== 200),
            sitemapRedirected: pages.filter((p) => p.finalUrl && p.finalUrl !== p.url),
            sitemapCanonicalMismatch: pages.filter((p) => p.canonical && new URL(p.canonical, p.url).href !== p.url),
            sitemapMissingCanonical: pages.filter((p) => !p.canonical),
            sitemapNoindex: pages.filter((p) => /noindex/i.test(p.robots || '')),
            sitemapSearchAction: pages.filter((p) => p.searchAction).map((p) => p.url),
            internalRedirects: internal.filter((p) => (p.hops?.length || 0) > 1),
            internalBroken: internal.filter((p) => Number(p.finalStatus) >= 400),
            internalWww: internal.filter((p) => { try { return new URL(p.target).hostname === 'www.gptbot.uz'; } catch { return false; } }),
            internalHttp: internal.filter((p) => /^http:\/\//i.test(p.target)),
          };
          const report = { generatedAt: new Date().toISOString(), auditSha: process.env.AUDIT_SHA, sitemap: { count: urls.length }, pages, internal, canonical, notFound, redirects, defects };
          fs.writeFileSync('reports/gsc-indexation-live-audit.json', JSON.stringify(report, null, 2) + '\n');
          const summary = [
            '# GSC live indexation audit', '',
            `Sitemap URLs: ${urls.length}`,
            `Sitemap non-200: ${defects.sitemapNon200.length}`,
            `Sitemap redirected: ${defects.sitemapRedirected.length}`,
            `Sitemap canonical mismatch: ${defects.sitemapCanonicalMismatch.length}`,
            `Sitemap missing canonical: ${defects.sitemapMissingCanonical.length}`,
            `Sitemap noindex: ${defects.sitemapNoindex.length}`,
            `Sitemap pages with SearchAction: ${defects.sitemapSearchAction.length}`,
            `Internal redirects: ${defects.internalRedirects.length}`,
            `Internal broken: ${defects.internalBroken.length}`,
            `Internal www: ${defects.internalWww.length}`,
            `Internal http: ${defects.internalHttp.length}`,
            '', '## Canonical examples',
            ...canonical.map((x) => `${x.input} | ${x.hops?.map((h) => h.status).join('>')} | final=${x.finalStatus} | canonical=${x.canonical || '-'} | SearchAction=${x.searchAction}`),
            '', '## 404 examples',
            ...notFound.map((x) => `${x.input} | ${x.hops?.map((h) => h.status).join('>')} | final=${x.finalStatus} | canonical=${x.canonical || '-'}`),
            '', '## Redirect examples',
            ...redirects.map((x) => `${x.input} | ${x.hops?.map((h) => h.status).join('>')} | final=${x.finalStatus} | ${x.finalUrl}`),
            '', '## Internal redirects/broken',
            ...[...defects.internalRedirects, ...defects.internalBroken].slice(0, 300).map((x) => `${x.target} <- ${x.sources?.join(', ')} | ${x.hops?.map((h) => h.status).join('>')} | final=${x.finalStatus}`),
          ].join('\n');
          fs.writeFileSync('reports/gsc-indexation-live-audit.md', summary + '\n');
          console.log(summary);
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: gptbot-gsc-indexation-live-audit-20260831-r2
          path: reports/
          if-no-files-found: error
          retention-days: 30

      - name: Remove one-shot workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ops/gsc-indexation-audit-20260831-r2
          git switch -C ops/gsc-indexation-audit-20260831-r2 origin/ops/gsc-indexation-audit-20260831-r2
          git config user.name "GPTBot SEO Audit CI"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/gsc-indexation-live-audit-20260831-r2.yml
          git commit -m "chore(seo): remove one-shot GSC live audit"
          git push origin HEAD:ops/gsc-indexation-audit-20260831-r2
