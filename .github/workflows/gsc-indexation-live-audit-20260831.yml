name: gsc-indexation-live-audit-20260831

on:
  push:
    branches:
      - ops/gsc-indexation-audit-20260831
    paths:
      - .github/workflows/gsc-indexation-live-audit-20260831.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AUDIT_SHA: e81f65e6c4757f77ed2991ef12b599d956185e55
      ORIGIN: https://gptbot.uz

    steps:
      - name: Check out exact production source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.AUDIT_SHA }}
          fetch-depth: 0

      - name: Assert source and inspect repository references
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUDIT_SHA"
          mkdir -p reports
          {
            echo '=== search/canonical structured-data references ==='
            git grep -n -E 'search_term_string|SearchAction|potentialAction|query-input|/ru/blog/\?q=|\?q=' -- ':!yarn.lock' ':!package-lock.json' || true
            echo '=== known GSC 404 route references ==='
            git grep -n -E '/ru/telegram-bot-uzbekistan/?|/gpt-uzbek-tilida/?|/gpt-chat/?|/cabinet/?|/oauth/?|/callback/?|/reset-password/?|/account/?' -- ':!yarn.lock' ':!package-lock.json' || true
            echo '=== stale redirect sources in config ==='
            git grep -n -E '/ru/gpt-bot-dlya-biznesa/|/ru/bot-dlya-obrabotki-zayavok/' -- ':!content/seo/redirects.json' || true
            echo '=== www/http literals in source/content ==='
            git grep -n -E 'https?://www\.gptbot\.uz|http://gptbot\.uz' -- content src scripts public functions || true
          } | tee reports/repository-grep.txt

      - name: Crawl live sitemap, canonicals, redirects and GSC examples
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const origin = process.env.ORIGIN;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          const visibleCanonicalExamples = [
            '/ru/blog/?q={search_term_string}',
            'https://www.gptbot.uz/ru/gpt-bot-dlya-biznesa/',
            'https://www.gptbot.uz/ru/blog/ai-bot-dlya-salona-krasoty-uzb-podklyuchenie-scenarii-ogranicheniya/',
            'https://www.gptbot.uz/uz/chat-bot-narxi/',
            'https://www.gptbot.uz/ru/gpt-bot-ili-obychnyy-chat-bot/',
            'https://www.gptbot.uz/uz/gpt-bot-yoki-oddiy-chat-bot/',
            'https://www.gptbot.uz/uz/ozbekiston-boylab-chat-bot/',
            'https://www.gptbot.uz/uz/fitnes-klub-uchun-ai-bot/',
            'https://www.gptbot.uz/ru/chat-bot-v-samarkande/',
            'https://www.gptbot.uz/uz/biznes-uchun-ai-bot/',
          ];
          const visible404Examples = [
            '/ru/telegram-bot-uzbekistan/',
            '/gpt-uzbek-tilida/',
            '/cabinet',
            '/gpt-chat/',
            '/oauth',
            '/api',
            '/callback',
            '/reset-password',
            '/auth',
            '/account',
          ];
          const redirectExamples = [
            '/blog/',
            '/ru/blog/chat-bot-dlya-biznesa-tashkent/',
            'http://www.gptbot.uz/',
            '/ru/bot-dlya-obrabotki-zayavok/',
            '/ru/gpt-bot-dlya-biznesa/',
            '/ru/blog/kak-podklyuchit-telegram-bot-k-crm/',
            'https://www.gptbot.uz/',
            '/?lang=ru',
            'http://gptbot.uz/',
            '/ru/razrabotka-sayta-pod-klyuch/',
            '/ru/blog/telegram-bot-biznes-tsena-tashkent/',
            '/ru/blog/telegram-bot-dlya-biznesa-tashkent/',
            '/ru/blog/chat-bot-na-russkom-i-uzbekskom-yazyke/',
          ];

          function absolute(value) {
            if (/^https?:\/\//i.test(value)) return value;
            return new URL(value, origin).href;
          }
          function attr(html, rel) {
            const tags = html.match(/<link\b[^>]*>/gi) || [];
            for (const tag of tags) {
              if (!new RegExp(`\\brel=["'][^"']*${rel}[^"']*["']`, 'i').test(tag)) continue;
              const href = tag.match(/\bhref=["']([^"']+)["']/i)?.[1];
              if (href) return href;
            }
            return null;
          }
          function metaRobots(html) {
            const tags = html.match(/<meta\b[^>]*>/gi) || [];
            for (const tag of tags) {
              if (!/\bname=["']robots["']/i.test(tag)) continue;
              return tag.match(/\bcontent=["']([^"']*)["']/i)?.[1] || '';
            }
            return null;
          }
          function htmlLinks(html, base) {
            const out = [];
            for (const match of html.matchAll(/<a\b[^>]*\bhref=["']([^"']+)["']/gi)) {
              const raw = match[1];
              if (/^(#|mailto:|tel:|javascript:|data:)/i.test(raw)) continue;
              try { out.push(new URL(raw, base).href); } catch {}
            }
            return [...new Set(out)];
          }
          async function request(url, redirect = 'follow') {
            let last;
            for (let i = 0; i < 4; i++) {
              try {
                const response = await fetch(url, {
                  redirect,
                  cache: 'no-store',
                  headers: { 'user-agent': 'GPTBot-GSC-Indexation-Audit/2026-08-31' },
                  signal: AbortSignal.timeout(30000),
                });
                return response;
              } catch (error) {
                last = error;
                await sleep(500 * (i + 1));
              }
            }
            throw last;
          }
          async function redirectTrace(input) {
            let current = absolute(input);
            const hops = [];
            for (let i = 0; i < 10; i++) {
              const response = await request(current, 'manual');
              const location = response.headers.get('location');
              hops.push({ url: current, status: response.status, location });
              if (![301,302,303,307,308].includes(response.status) || !location) {
                let text = '';
                const type = response.headers.get('content-type') || '';
                if (/text\/html|application\/xhtml/i.test(type)) text = await response.text();
                return {
                  input: absolute(input),
                  hops,
                  finalUrl: current,
                  finalStatus: response.status,
                  canonical: text ? attr(text, 'canonical') : null,
                  robots: text ? metaRobots(text) : null,
                };
              }
              current = new URL(location, current).href;
            }
            return { input: absolute(input), hops, error: 'too_many_redirects' };
          }

          const sitemapResponse = await request(origin + '/sitemap.xml');
          if (!sitemapResponse.ok) throw new Error(`sitemap HTTP ${sitemapResponse.status}`);
          const sitemapXml = await sitemapResponse.text();
          const sitemapUrls = [...new Set([...sitemapXml.matchAll(/<loc>([^<]+)<\/loc>/g)].map((m) => m[1].trim()))];
          const sitemapSet = new Set(sitemapUrls);

          const pageReports = [];
          let cursor = 0;
          async function worker() {
            while (cursor < sitemapUrls.length) {
              const index = cursor++;
              const url = sitemapUrls[index];
              try {
                const response = await request(url);
                const text = await response.text();
                const canonical = attr(text, 'canonical');
                const links = htmlLinks(text, response.url);
                const jsonLdProblem = /search_term_string|SearchAction|query-input|potentialAction/i.test(text);
                pageReports[index] = {
                  url,
                  status: response.status,
                  finalUrl: response.url,
                  canonical,
                  robots: metaRobots(text),
                  contentType: response.headers.get('content-type'),
                  links,
                  jsonLdProblem,
                };
              } catch (error) {
                pageReports[index] = { url, error: String(error) };
              }
            }
          }
          await Promise.all(Array.from({ length: 8 }, () => worker()));

          const internalTargets = new Map();
          for (const page of pageReports) {
            for (const link of page.links || []) {
              let parsed;
              try { parsed = new URL(link); } catch { continue; }
              if (!/(^|\.)gptbot\.uz$/i.test(parsed.hostname)) continue;
              const key = parsed.href;
              const sources = internalTargets.get(key) || [];
              if (sources.length < 20) sources.push(page.url);
              internalTargets.set(key, sources);
            }
          }

          const internalAudit = [];
          let targetCursor = 0;
          const targets = [...internalTargets.entries()];
          async function targetWorker() {
            while (targetCursor < targets.length) {
              const [target, sources] = targets[targetCursor++];
              try {
                const trace = await redirectTrace(target);
                internalAudit.push({ target, sources, ...trace });
              } catch (error) {
                internalAudit.push({ target, sources, error: String(error) });
              }
            }
          }
          await Promise.all(Array.from({ length: 8 }, () => targetWorker()));

          async function traces(list) {
            const out = [];
            for (const item of list) {
              try { out.push(await redirectTrace(item)); }
              catch (error) { out.push({ input: absolute(item), error: String(error) }); }
            }
            return out;
          }

          const canonicalExamples = await traces(visibleCanonicalExamples);
          const notFoundExamples = await traces(visible404Examples);
          const redirects = await traces(redirectExamples);
          const queryUrl = canonicalExamples[0];

          const defects = {
            sitemapNon200: pageReports.filter((p) => p.status !== 200),
            sitemapFinalUrlMismatch: pageReports.filter((p) => p.finalUrl && p.finalUrl !== p.url),
            sitemapCanonicalMismatch: pageReports.filter((p) => p.canonical && new URL(p.canonical, p.url).href !== p.url),
            sitemapNoCanonical: pageReports.filter((p) => !p.canonical),
            sitemapNoindex: pageReports.filter((p) => /noindex/i.test(p.robots || '')),
            structuredSearchActions: pageReports.filter((p) => p.jsonLdProblem).map((p) => p.url),
            internalWww: internalAudit.filter((x) => { try { return new URL(x.target).hostname === 'www.gptbot.uz'; } catch { return false; } }),
            internalHttp: internalAudit.filter((x) => /^http:\/\//i.test(x.target)),
            internalRedirects: internalAudit.filter((x) => (x.hops?.length || 0) > 1),
            internalBroken: internalAudit.filter((x) => x.finalStatus && x.finalStatus >= 400),
            queryTemplate: queryUrl,
          };

          const report = {
            generatedAt: new Date().toISOString(),
            auditSha: process.env.AUDIT_SHA,
            origin,
            sitemap: { status: sitemapResponse.status, count: sitemapUrls.length, urls: sitemapUrls },
            pages: pageReports,
            internalAudit,
            canonicalExamples,
            notFoundExamples,
            redirectExamples: redirects,
            defects,
          };
          fs.writeFileSync('reports/gsc-indexation-live-audit.json', JSON.stringify(report, null, 2) + '\n');

          const lines = [
            '# GSC live indexation audit - 2026-08-31',
            '',
            `- Sitemap URLs: ${sitemapUrls.length}`,
            `- Sitemap non-200: ${defects.sitemapNon200.length}`,
            `- Sitemap canonical mismatch: ${defects.sitemapCanonicalMismatch.length}`,
            `- Sitemap missing canonical: ${defects.sitemapNoCanonical.length}`,
            `- Sitemap noindex: ${defects.sitemapNoindex.length}`,
            `- Pages containing SearchAction/search_term_string: ${defects.structuredSearchActions.length}`,
            `- Internal www links: ${defects.internalWww.length}`,
            `- Internal http links: ${defects.internalHttp.length}`,
            `- Internal links through redirect: ${defects.internalRedirects.length}`,
            `- Internal broken links: ${defects.internalBroken.length}`,
            '',
            '## Visible GSC 404 examples',
            ...notFoundExamples.map((x) => `- ${x.input} -> ${x.finalStatus}${x.finalUrl ? ` (${x.finalUrl})` : ''}`),
            '',
            '## Visible alternate-canonical examples',
            ...canonicalExamples.map((x) => `- ${x.input} -> ${x.finalStatus}; canonical=${x.canonical || 'none'}; hops=${x.hops?.length || 0}`),
            '',
            '## Structured search-action pages',
            ...defects.structuredSearchActions.map((x) => `- ${x}`),
            '',
            '## Internal broken/redirect targets',
            ...[...defects.internalBroken, ...defects.internalRedirects].slice(0, 200).map((x) => `- ${x.target} <- ${x.sources?.join(', ')}; final=${x.finalStatus}; hops=${x.hops?.length || 0}`),
          ];
          fs.writeFileSync('reports/gsc-indexation-live-audit.md', lines.join('\n') + '\n');
          console.log(lines.join('\n'));
          NODE

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: gptbot-gsc-indexation-live-audit-20260831
          path: reports/
          if-no-files-found: error
          retention-days: 30

      - name: Remove one-shot audit workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ops/gsc-indexation-audit-20260831
          git switch -C ops/gsc-indexation-audit-20260831 origin/ops/gsc-indexation-audit-20260831
          git config user.name "GPTBot SEO Audit CI"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/gsc-indexation-live-audit-20260831.yml
          git commit -m "chore(seo): remove one-shot GSC indexation audit"
          git push origin HEAD:ops/gsc-indexation-audit-20260831
