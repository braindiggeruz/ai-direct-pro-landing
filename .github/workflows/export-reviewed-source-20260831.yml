name: export-reviewed-source-20260831

on:
  push:
    branches:
      - ops/export-reviewed-source-20260831
    paths:
      - .github/workflows/export-reviewed-source-20260831.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: 6cbdb9f40ee23a860f6700c371709fb625f0f18b

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Package exact tracked source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git archive --format=tar.gz --prefix=gptbot-reviewed-source/ \
            --output="gptbot-reviewed-source-${SOURCE_SHA}.tar.gz" HEAD
          sha256sum "gptbot-reviewed-source-${SOURCE_SHA}.tar.gz" > "gptbot-reviewed-source-${SOURCE_SHA}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: gptbot-reviewed-source-${{ env.SOURCE_SHA }}
          path: |
            gptbot-reviewed-source-${{ env.SOURCE_SHA }}.tar.gz
            gptbot-reviewed-source-${{ env.SOURCE_SHA }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Remove one-shot workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ops/export-reviewed-source-20260831
          git switch -C ops/export-reviewed-source-20260831 origin/ops/export-reviewed-source-20260831
          git config user.name "GPTBot Source Export CI"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/export-reviewed-source-20260831.yml
          git commit -m "chore: remove one-shot source export workflow"
          git push origin HEAD:ops/export-reviewed-source-20260831
