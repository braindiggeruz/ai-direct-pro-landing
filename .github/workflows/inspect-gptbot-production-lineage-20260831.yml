name: inspect-gptbot-production-lineage-20260831

on:
  push:
    branches:
      - ops/inspect-gptbot-production-lineage-20260831
    paths:
      - .github/workflows/inspect-gptbot-production-lineage-20260831.yml

permissions:
  contents: write

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  PROJECT: ai-direct-pro-landing

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/inspect-gptbot-production-lineage-20260831
          fetch-depth: 0

      - name: Read canonical production metadata
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT" \
            > project.json
          node <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('project.json', 'utf8'));
          if (!body.success) throw new Error('Cloudflare project lookup failed');
          const d = body.result?.canonical_deployment;
          const evidence = {
            project: body.result?.name,
            productionBranch: body.result?.production_branch,
            deploymentId: d?.id,
            deploymentUrl: d?.url,
            environment: d?.environment,
            status: d?.latest_stage?.status,
            commitHash: d?.deployment_trigger?.metadata?.commit_hash,
            branch: d?.deployment_trigger?.metadata?.branch,
            createdOn: d?.created_on,
            modifiedOn: d?.modified_on,
          };
          console.log(`PRODUCTION_METADATA=${JSON.stringify(evidence)}`);
          fs.writeFileSync('production-lineage.json', `${JSON.stringify(evidence, null, 2)}\n`);
          NODE

      - name: Upload sanitized metadata
        uses: actions/upload-artifact@v4
        with:
          name: gptbot-production-lineage-20260831
          path: production-lineage.json
          retention-days: 7

      - name: Remove one-shot workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GPTBot Release CI"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/inspect-gptbot-production-lineage-20260831.yml
          git commit -m "chore(release): remove production-lineage probe"
          git push origin HEAD:ops/inspect-gptbot-production-lineage-20260831
