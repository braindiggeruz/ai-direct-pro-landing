name: inspect-live-crawler-schema-20260831

on:
  push:
    branches:
      - ops/inspect-live-crawler-schema-20260831
    paths:
      - .github/workflows/inspect-live-crawler-schema-20260831.yml

permissions:
  contents: write

concurrency:
  group: inspect-live-crawler-schema-20260831
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_SHA: 6cbdb9f40ee23a860f6700c371709fb625f0f18b
      PROJECT: ai-direct-pro-landing
      PREVIEW_BRANCH: schema-inspect-crawler-20260831
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn

      - name: Create isolated read-only schema endpoint and preview build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
          yarn install --frozen-lockfile --ignore-scripts --non-interactive
          npm --prefix apps/bormi-admin ci --ignore-scripts --no-audit --no-fund
          INSPECT_TOKEN=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
          echo "INSPECT_TOKEN=$INSPECT_TOKEN" >> "$GITHUB_ENV"
          mkdir -p functions/api/internal reports
          cat > functions/api/internal/gsc-crawler-schema-inspect.ts <<EOF
          interface Env { GPTBOT_DRAFTS_DB: D1Database }
          export const onRequestGet: PagesFunction<Env> = async ({ request, env }) => {
            const url = new URL(request.url);
            if (url.searchParams.get('token') !== '${INSPECT_TOKEN}') {
              return new Response('not found', { status: 404, headers: { 'Cache-Control': 'no-store' } });
            }
            const master = await env.GPTBOT_DRAFTS_DB.prepare(
              "SELECT type,name,tbl_name,sql FROM sqlite_master WHERE name NOT LIKE 'sqlite_%' ORDER BY type,name"
            ).all();
            const migrations = await env.GPTBOT_DRAFTS_DB.prepare(
              "SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 20"
            ).all().catch(() => ({ results: [] }));
            const crawlerObjects = (master.results ?? []).filter((row: any) =>
              /crawler|collector/i.test(String(row.name ?? '')) || /crawler|collector/i.test(String(row.sql ?? ''))
            );
            const tables = (master.results ?? []).filter((row: any) => row.type === 'table');
            const details: Record<string, unknown> = {};
            for (const row of crawlerObjects.filter((item: any) => item.type === 'table')) {
              const name = String(row.name);
              if (!/^[A-Za-z0-9_]+$/.test(name)) continue;
              const columns = await env.GPTBOT_DRAFTS_DB.prepare(`PRAGMA table_info(${name})`).all();
              const indexes = await env.GPTBOT_DRAFTS_DB.prepare(`PRAGMA index_list(${name})`).all();
              const foreignKeys = await env.GPTBOT_DRAFTS_DB.prepare(`PRAGMA foreign_key_list(${name})`).all();
              const count = await env.GPTBOT_DRAFTS_DB.prepare(`SELECT COUNT(*) AS count FROM ${name}`).first();
              details[name] = { columns: columns.results ?? [], indexes: indexes.results ?? [], foreignKeys: foreignKeys.results ?? [], count };
            }
            return Response.json({
              generatedAt: new Date().toISOString(),
              migrations: migrations.results ?? [],
              tableNames: tables.map((row: any) => row.name),
              crawlerObjects,
              details,
            }, { headers: { 'Cache-Control': 'no-store', 'X-Robots-Tag': 'noindex, nofollow' } });
          };
          EOF
          npm run build:fast
          npm --prefix apps/bormi-admin run build

      - name: Deploy preview and capture read-only crawler schema
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          node node_modules/wrangler/bin/wrangler.js pages deploy dist \
            --project-name "$PROJECT" \
            --branch "$PREVIEW_BRANCH" \
            --commit-hash "$SOURCE_SHA" \
            --commit-dirty=true | tee reports/wrangler-preview.txt
          PREVIEW_URL=$(grep -Eo 'https://[a-z0-9-]+\.ai-direct-pro-landing\.pages\.dev' reports/wrangler-preview.txt | tail -1)
          test -n "$PREVIEW_URL"
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          curl --fail --silent --show-error \
            "$PREVIEW_URL/api/internal/gsc-crawler-schema-inspect?token=$INSPECT_TOKEN" \
            > reports/crawler-schema.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const schema=JSON.parse(fs.readFileSync('reports/crawler-schema.json','utf8'));
          const safe={
            generatedAt:schema.generatedAt,
            migrations:schema.migrations,
            crawlerObjects:schema.crawlerObjects,
            details:schema.details,
            tableNames:schema.tableNames,
          };
          fs.writeFileSync('reports/crawler-schema-safe.json',JSON.stringify(safe,null,2)+'\n');
          console.log(JSON.stringify(safe,null,2));
          NODE
          rm -f reports/crawler-schema.json

      - uses: actions/upload-artifact@v4
        with:
          name: gptbot-live-crawler-schema-20260831
          path: |
            reports/crawler-schema-safe.json
            reports/wrangler-preview.txt
          if-no-files-found: error
          retention-days: 7

      - name: Delete temporary preview deployment
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${PREVIEW_URL:-}" ]; then
            DEPLOY_ID=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments?env=preview&per_page=20" \
              | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const b=JSON.parse(d);const x=(b.result||[]).find(v=>v.url===process.env.PREVIEW_URL);process.stdout.write(x?.id||'')})")
            if [ -n "$DEPLOY_ID" ]; then
              curl --silent --show-error --request DELETE \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments/$DEPLOY_ID?force=true" >/dev/null
            fi
          fi

      - name: Remove one-shot workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ops/inspect-live-crawler-schema-20260831
          git switch -C ops/inspect-live-crawler-schema-20260831 origin/ops/inspect-live-crawler-schema-20260831
          git config user.name "GPTBot Schema Inspection CI"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/inspect-live-crawler-schema-20260831.yml
          git commit -m "chore: remove one-shot crawler schema inspection"
          git push origin HEAD:ops/inspect-live-crawler-schema-20260831
