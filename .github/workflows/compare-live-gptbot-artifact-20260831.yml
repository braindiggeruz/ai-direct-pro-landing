name: compare-live-gptbot-artifact-20260831

on:
  push:
    branches:
      - ops/compare-live-gptbot-artifact-20260831
    paths:
      - .github/workflows/compare-live-gptbot-artifact-20260831.yml

permissions:
  contents: write

concurrency:
  group: compare-live-gptbot-artifact-20260831
  cancel-in-progress: false

env:
  CANDIDATE_SHA: aa2ac83d66b52f9744bef48c9d3c40ce107c1fa7
  IMMUTABLE_ORIGIN: https://edc0edea.ai-direct-pro-landing.pages.dev
  APEX_ORIGIN: https://gptbot.uz
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn

      - name: Install and build candidate artifact
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          yarn install --frozen-lockfile --ignore-scripts --non-interactive
          npm --prefix apps/bormi-admin ci --ignore-scripts --no-audit --no-fund
          npm run build:production

      - name: Fetch live manifests and key objects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live/apex live/immutable
          for origin_name in apex immutable; do
            if [ "$origin_name" = apex ]; then origin="$APEX_ORIGIN"; else origin="$IMMUTABLE_ORIGIN"; fi
            for path in \
              /gptbot-release.json \
              /index.html \
              /admin/index.html \
              /ru/internet-reklama-tashkent/index.html \
              /uz/internet-reklama-toshkent/index.html \
              /ru/otzyvy/index.html \
              /uz/sharhlar/index.html \
              /sitemap.xml \
              /robots.txt
            do
              out="live/$origin_name${path}"
              mkdir -p "$(dirname "$out")"
              status=$(curl --compressed --silent --show-error --location --output "$out" --write-out '%{http_code}' \
                "$origin$path?compare=$CANDIDATE_SHA")
              printf '%s %s %s\n' "$origin_name" "$status" "$path" >> live/statuses.txt
            done
          done

      - name: Compare candidate and current production without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');

          const sha256 = (buffer) => crypto.createHash('sha256').update(buffer).digest('hex');
          const read = (p) => fs.readFileSync(p);
          const jsonOrNull = (p) => {
            try { return JSON.parse(fs.readFileSync(p, 'utf8')); } catch { return null; }
          };

          const candidate = jsonOrNull('dist/gptbot-release.json');
          if (!candidate) throw new Error('Candidate release manifest is missing');
          const statuses = fs.readFileSync('live/statuses.txt', 'utf8').trim().split(/\r?\n/).map((line) => {
            const [origin, status, ...rest] = line.split(' ');
            return { origin, status: Number(status), path: rest.join(' ') };
          });

          const relativeObjects = [
            'index.html',
            'admin/index.html',
            'ru/internet-reklama-tashkent/index.html',
            'uz/internet-reklama-toshkent/index.html',
            'ru/otzyvy/index.html',
            'uz/sharhlar/index.html',
            'sitemap.xml',
            'robots.txt',
          ];

          const summarizeManifest = (m) => m && ({
            schema: m.schema,
            commit: m.commit,
            artifactSha256: m.artifactSha256,
            fileCount: m.fileCount,
            features: m.features,
            probes: m.probes,
          });

          const result = {
            checkedAt: new Date().toISOString(),
            candidate: summarizeManifest(candidate),
            statuses,
            origins: {},
          };

          for (const originName of ['apex', 'immutable']) {
            const manifest = jsonOrNull(`live/${originName}/gptbot-release.json`);
            const objectHashes = {};
            for (const rel of relativeObjects) {
              const candidatePath = path.join('dist', rel);
              const livePath = path.join('live', originName, rel);
              const candidateExists = fs.existsSync(candidatePath);
              const liveExists = fs.existsSync(livePath);
              objectHashes[`/${rel}`] = {
                candidateSha256: candidateExists ? sha256(read(candidatePath)) : null,
                liveSha256: liveExists ? sha256(read(livePath)) : null,
                exact: candidateExists && liveExists ? read(candidatePath).equals(read(livePath)) : false,
                candidateBytes: candidateExists ? fs.statSync(candidatePath).size : null,
                liveBytes: liveExists ? fs.statSync(livePath).size : null,
              };
            }
            result.origins[originName] = {
              manifest: summarizeManifest(manifest),
              exactManifest: manifest ? JSON.stringify(manifest) === JSON.stringify(candidate) : false,
              sameArtifactHash: Boolean(manifest && manifest.artifactSha256 === candidate.artifactSha256),
              sameProbeSet: Boolean(manifest && JSON.stringify(manifest.probes) === JSON.stringify(candidate.probes)),
              objectHashes,
            };
          }

          const exactObjectCounts = {};
          for (const [origin, data] of Object.entries(result.origins)) {
            exactObjectCounts[origin] = Object.values(data.objectHashes).filter((item) => item.exact).length;
          }
          result.exactObjectCounts = exactObjectCounts;

          fs.writeFileSync('live-artifact-comparison.json', `${JSON.stringify(result, null, 2)}\n`);
          console.log(`LIVE_COMPARISON=${JSON.stringify({
            candidate: result.candidate,
            apexManifest: result.origins.apex.manifest,
            immutableManifest: result.origins.immutable.manifest,
            apexExactManifest: result.origins.apex.exactManifest,
            immutableExactManifest: result.origins.immutable.exactManifest,
            apexSameArtifactHash: result.origins.apex.sameArtifactHash,
            immutableSameArtifactHash: result.origins.immutable.sameArtifactHash,
            exactObjectCounts,
            statuses,
          })}`);
          NODE

      - name: Read Cloudflare deployment details
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/ai-direct-pro-landing/deployments/edc0edea-a38b-4fcf-81d7-e7de9be0e0cd" \
            > deployment.json
          node <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('deployment.json', 'utf8'));
          if (!body.success) throw new Error('Deployment detail lookup failed');
          const d = body.result;
          const safe = {
            id: d.id,
            url: d.url,
            environment: d.environment,
            status: d.latest_stage?.status,
            aliases: d.aliases,
            createdOn: d.created_on,
            modifiedOn: d.modified_on,
            source: d.deployment_trigger?.type,
            metadata: d.deployment_trigger?.metadata,
            stages: d.stages?.map((stage) => ({ name: stage.name, status: stage.status, startedOn: stage.started_on, endedOn: stage.ended_on })),
          };
          fs.writeFileSync('deployment-safe.json', `${JSON.stringify(safe, null, 2)}\n`);
          console.log(`DEPLOYMENT_SAFE=${JSON.stringify(safe)}`);
          NODE

      - name: Upload sanitized comparison evidence
        uses: actions/upload-artifact@v4
        with:
          name: gptbot-live-artifact-comparison-20260831
          path: |
            live-artifact-comparison.json
            deployment-safe.json
            live/statuses.txt
            dist/gptbot-release.json
          retention-days: 14

      - name: Remove one-shot workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git switch -C ops/compare-live-gptbot-artifact-20260831 origin/ops/compare-live-gptbot-artifact-20260831
          git config user.name "GPTBot Release CI"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/compare-live-gptbot-artifact-20260831.yml
          git commit -m "chore(release): remove live-artifact comparison workflow"
          git push origin HEAD:ops/compare-live-gptbot-artifact-20260831
