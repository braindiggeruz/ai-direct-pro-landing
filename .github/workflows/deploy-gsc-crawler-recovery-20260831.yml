name: deploy-gsc-crawler-recovery-20260831

on:
  push:
    branches:
      - ops/deploy-gsc-crawler-recovery-20260831
    paths:
      - .github/workflows/deploy-gsc-crawler-recovery-20260831.yml

permissions:
  contents: write

concurrency:
  group: gptbot-pages-production
  cancel-in-progress: false

env:
  RELEASE_SHA: 42df64e1a4bfc1121b1fc1882a7b6c46f8fa428b
  RELEASE_BRANCH: release/gsc-indexation-crawler-recovery-20260831
  PROJECT: ai-direct-pro-landing
  PRODUCTION_ORIGIN: https://gptbot.uz
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  verify-deploy-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out exact reviewed release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn

      - name: Assert immutable source and credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain)"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -f migrations/0056_lead_radar_crawler.sql
          test -f functions/platform/lead-radar/crawler.ts
          test -f functions/api/lead-radar/crawler/'[[path]].ts'
          test -f src/admin/components/lead-radar/LeadRadarCrawlerCard.tsx
          remote_sha="$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$RELEASE_SHA"
          mkdir -p evidence

      - name: Snapshot and prove current production contract
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT" \
            > evidence/before-project.raw.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const raw = JSON.parse(fs.readFileSync('evidence/before-project.raw.json', 'utf8'));
          if (!raw.success) throw new Error('Cloudflare project lookup failed');
          const project = raw.result;
          const deployment = project?.canonical_deployment;
          if (!deployment?.id || deployment.environment !== 'production' || deployment.latest_stage?.status !== 'success') {
            throw new Error('current canonical deployment is not successful production');
          }
          const productionBranch = String(project.production_branch || 'main');
          const origins = [process.env.PRODUCTION_ORIGIN, deployment.url];
          const sha256 = (value) => crypto.createHash('sha256').update(value).digest('hex');

          async function fetchRetry(url, init = {}, attempts = 8) {
            let last;
            for (let i = 0; i < attempts; i++) {
              try {
                const response = await fetch(url, {
                  cache: 'no-store',
                  signal: AbortSignal.timeout(30000),
                  headers: { 'user-agent': 'GPTBot-Production-Guard/2026-08-31', ...(init.headers || {}) },
                  ...init,
                });
                return response;
              } catch (error) {
                last = error;
                await sleep(1000 * (i + 1));
              }
            }
            throw last;
          }
          function adminAsset(html) {
            const matches = [...html.matchAll(/(?:src|href)=["']([^"']*\/assets\/AdminRoot-[^"']+\.js)["']/gi)];
            if (!matches.length) throw new Error('AdminRoot asset was not found');
            return new URL(matches[0][1], process.env.PRODUCTION_ORIGIN).pathname.replace(/^\//, '');
          }
          async function probeWorker(origin, route) {
            const response = await fetchRetry(`${origin}${route}`, {
              method: 'POST',
              redirect: 'manual',
              headers: { 'content-type': 'application/json' },
              body: '{}',
            });
            const text = await response.text();
            if (response.status !== 401 || !/crawler_unauthorized/i.test(text)) {
              throw new Error(`${origin}${route}: expected auth-first crawler 401, got ${response.status}`);
            }
            return { route, status: response.status, code: 'crawler_unauthorized' };
          }

          const manifests = {};
          const admin = {};
          const worker = {};
          for (const origin of origins) {
            const manifestResponse = await fetchRetry(`${origin}/gptbot-release.json?guard=${Date.now()}`);
            if (!manifestResponse.ok) throw new Error(`${origin}: release manifest HTTP ${manifestResponse.status}`);
            const manifest = await manifestResponse.json();
            if (!manifest?.commit || !manifest?.artifactSha256 || !Array.isArray(manifest?.features)) {
              throw new Error(`${origin}: malformed release manifest`);
            }
            manifests[origin] = manifest;

            const adminResponse = await fetchRetry(`${origin}/admin/lead-radar?guard=${Date.now()}`);
            if (!adminResponse.ok) throw new Error(`${origin}: Lead Radar shell HTTP ${adminResponse.status}`);
            const adminHtml = await adminResponse.text();
            const assetPath = adminAsset(adminHtml);
            const assetResponse = await fetchRetry(`${origin}/${assetPath}?guard=${Date.now()}`);
            if (!assetResponse.ok) throw new Error(`${origin}: admin asset HTTP ${assetResponse.status}`);
            const assetBytes = Buffer.from(await assetResponse.arrayBuffer());
            const assetText = assetBytes.toString('utf8');
            if (!assetText.includes('Локальный сборщик') || !assetText.includes('Собрать контакты с сайта')) {
              throw new Error(`${origin}: current production does not contain the local collector UI contract`);
            }
            admin[origin] = { assetPath, sha256: sha256(assetBytes), localCollector: true };

            worker[origin] = [];
            for (const route of [
              '/api/lead-radar/crawler/jobs/claim',
              '/api/lead-radar/crawler/heartbeat',
              '/api/lead-radar/crawler/receipt',
            ]) worker[origin].push(await probeWorker(origin, route));

            const owner = await fetchRetry(`${origin}/api/admin/lead-radar/crawler/status?companyId=guard`, { redirect: 'manual' });
            if (owner.status === 404 || owner.status < 400 || owner.status >= 500) {
              throw new Error(`${origin}: owner crawler route is not auth-protected (${owner.status})`);
            }
          }

          const canonicalManifest = manifests[process.env.PRODUCTION_ORIGIN];
          const immutableManifest = manifests[deployment.url];
          if (canonicalManifest.artifactSha256 !== immutableManifest.artifactSha256
              || canonicalManifest.commit !== immutableManifest.commit) {
            throw new Error('custom domain and immutable production artifacts disagree');
          }

          const safe = {
            checkedAt: new Date().toISOString(),
            project: project.name,
            productionBranch,
            deployment: {
              id: deployment.id,
              url: deployment.url,
              environment: deployment.environment,
              status: deployment.latest_stage.status,
              commit: deployment.deployment_trigger?.metadata?.commit_hash ?? null,
              branch: deployment.deployment_trigger?.metadata?.branch ?? null,
              createdOn: deployment.created_on ?? null,
              aliases: deployment.aliases ?? [],
            },
            manifest: {
              commit: canonicalManifest.commit,
              artifactSha256: canonicalManifest.artifactSha256,
              fileCount: canonicalManifest.fileCount,
              features: canonicalManifest.features,
            },
            admin,
            worker,
          };
          fs.writeFileSync('evidence/before-safe.json', JSON.stringify(safe, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_ENV, [
            `PRODUCTION_BRANCH=${productionBranch}`,
            `BEFORE_DEPLOYMENT_ID=${deployment.id}`,
            `BEFORE_DEPLOYMENT_URL=${deployment.url}`,
            `BEFORE_COMMIT=${deployment.deployment_trigger?.metadata?.commit_hash ?? ''}`,
            `BEFORE_ARTIFACT_SHA=${canonicalManifest.artifactSha256}`,
            `BEFORE_ADMIN_ASSET=${admin[process.env.PRODUCTION_ORIGIN].assetPath}`,
            `BEFORE_ADMIN_SHA=${admin[process.env.PRODUCTION_ORIGIN].sha256}`,
          ].join('\n') + '\n');
          console.log(`CURRENT_DEPLOYMENT_ID=${deployment.id}`);
          console.log(`CURRENT_COMMIT=${deployment.deployment_trigger?.metadata?.commit_hash ?? 'unknown'}`);
          console.log(`CURRENT_ARTIFACT=${canonicalManifest.artifactSha256}`);
          console.log('CURRENT_LOCAL_COLLECTOR_CONTRACT=pass');
          NODE
          rm -f evidence/before-project.raw.json

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          yarn install --frozen-lockfile --ignore-scripts --non-interactive
          npm --prefix apps/bormi-admin ci --ignore-scripts --no-audit --no-fund

      - name: Run complete regression, SEO and security gates
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        shell: bash
        run: |
          set -euo pipefail
          yarn test:gsc-indexation
          yarn test:lead-radar-crawler
          yarn test
          yarn typecheck:lead-radar
          yarn test:lead-radar
          yarn test:pages-production
          yarn seo:audit
          yarn tsc -b
          yarn scan:secrets
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Build and prove exact candidate artifact
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          npm run build:production
          npx --no-install tsx scripts/release/pages-production.ts check
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const before = JSON.parse(fs.readFileSync('evidence/before-safe.json', 'utf8'));
          const candidate = JSON.parse(fs.readFileSync('dist/gptbot-release.json', 'utf8'));
          if (candidate.commit !== process.env.RELEASE_SHA) throw new Error('candidate release stamp mismatch');
          if (candidate.fileCount !== 870) throw new Error(`candidate file count changed unexpectedly: ${candidate.fileCount}`);
          const currentFeatures = new Set(before.manifest.features || []);
          const candidateFeatures = new Set(candidate.features || []);
          for (const feature of currentFeatures) {
            if (!candidateFeatures.has(feature)) throw new Error(`candidate regresses current manifest feature: ${feature}`);
          }
          const safe = {
            checkedAt: new Date().toISOString(),
            commit: candidate.commit,
            artifactSha256: candidate.artifactSha256,
            fileCount: candidate.fileCount,
            features: candidate.features,
            currentFeatureSubsetPreserved: true,
            localCollectorSource: true,
            gscIndexationHygiene: true,
          };
          fs.writeFileSync('evidence/candidate-safe.json', JSON.stringify(safe, null, 2) + '\n');
          console.log(`CANDIDATE_ARTIFACT=${candidate.artifactSha256}`);
          NODE
          grep -RFl 'Локальный сборщик' dist/assets/AdminRoot-*.js
          grep -RFl 'Собрать контакты с сайта' dist/assets/AdminRoot-*.js
          ! grep -RniE 'SearchAction|search_term_string|query-input' dist/index.html dist/ru/blog/index.html dist/uz/blog/index.html
          grep -F '/ru/telegram-bot-uzbekistan/  /ru/telegram-bot-dlya-biznesa/  301' dist/_redirects
          grep -F '/gpt-uzbek-tilida/  /uz/gpt-uzbek-tilida/  301' dist/_redirects
          grep -F '/gpt-chat/  /ru/gpt-chat/  301' dist/_redirects
          grep -F 'LEAD_RADAR_CRAWLER_ENABLED = "true"' wrangler.toml
          ! grep -RniE 'CREATE TABLE|ALTER TABLE|DROP TABLE' \
            functions/platform/lead-radar/crawler.ts \
            functions/api/lead-radar/crawler \
            functions/api/admin/lead-radar

      - name: Final production race guard
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT" \
            > evidence/predeploy-project.raw.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const raw = JSON.parse(fs.readFileSync('evidence/predeploy-project.raw.json', 'utf8'));
          const deployment = raw.result?.canonical_deployment;
          if (!raw.success || !deployment) throw new Error('predeploy project lookup failed');
          if (deployment.id !== process.env.BEFORE_DEPLOYMENT_ID) throw new Error('production deployment changed during verification');
          if ((deployment.deployment_trigger?.metadata?.commit_hash ?? '') !== process.env.BEFORE_COMMIT) throw new Error('production commit changed during verification');
          if (deployment.latest_stage?.status !== 'success') throw new Error('production is no longer successful');
          const manifestResponse = await fetch(`${process.env.PRODUCTION_ORIGIN}/gptbot-release.json?race=${Date.now()}`, {
            cache: 'no-store', signal: AbortSignal.timeout(30000),
          });
          if (!manifestResponse.ok) throw new Error(`race manifest HTTP ${manifestResponse.status}`);
          const manifest = await manifestResponse.json();
          if (manifest.artifactSha256 !== process.env.BEFORE_ARTIFACT_SHA) throw new Error('production artifact changed during verification');
          const assetResponse = await fetch(`${process.env.PRODUCTION_ORIGIN}/${process.env.BEFORE_ADMIN_ASSET}?race=${Date.now()}`, {
            cache: 'no-store', signal: AbortSignal.timeout(30000),
          });
          if (!assetResponse.ok) throw new Error(`race admin asset HTTP ${assetResponse.status}`);
          const asset = Buffer.from(await assetResponse.arrayBuffer());
          const digest = crypto.createHash('sha256').update(asset).digest('hex');
          if (digest !== process.env.BEFORE_ADMIN_SHA) throw new Error('production admin artifact changed during verification');
          fs.writeFileSync('evidence/race-guard-safe.json', JSON.stringify({
            checkedAt: new Date().toISOString(),
            deploymentId: deployment.id,
            commit: deployment.deployment_trigger?.metadata?.commit_hash ?? null,
            artifactSha256: manifest.artifactSha256,
            adminSha256: digest,
            result: 'pass',
          }, null, 2) + '\n');
          console.log('FINAL_RACE_GUARD=pass');
          NODE
          rm -f evidence/predeploy-project.raw.json

      - name: Upload exact Cloudflare Pages production release
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain)"
          node node_modules/wrangler/bin/wrangler.js pages deploy dist \
            --project-name "$PROJECT" \
            --branch "$PRODUCTION_BRANCH" \
            --commit-hash "$RELEASE_SHA" \
            --commit-dirty=false | tee evidence/wrangler-deploy.txt
          touch evidence/deploy-upload-succeeded.marker

      - name: Verify production release and full live canary
        id: canary
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const expected = JSON.parse(fs.readFileSync('dist/gptbot-release.json', 'utf8'));
          const before = JSON.parse(fs.readFileSync('evidence/before-safe.json', 'utf8'));
          const sha256 = (value) => crypto.createHash('sha256').update(value).digest('hex');

          async function fetchRetry(url, init = {}, attempts = 18, accept = null) {
            let last;
            for (let i = 0; i < attempts; i++) {
              try {
                const response = await fetch(url, {
                  cache: 'no-store',
                  signal: AbortSignal.timeout(30000),
                  headers: { 'user-agent': 'GPTBot-Production-Canary/2026-08-31', ...(init.headers || {}) },
                  ...init,
                });
                if (!accept || await accept(response.clone())) return response;
                last = new Error(`${url}: response not ready (${response.status})`);
              } catch (error) { last = error; }
              await sleep(Math.min(2500 + i * 500, 8000));
            }
            throw last;
          }
          async function project() {
            const response = await fetchRetry(
              `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/pages/projects/${process.env.PROJECT}`,
              { headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` } },
              8,
              (r) => r.ok,
            );
            return response.json();
          }
          let deployment;
          for (let i = 0; i < 48; i++) {
            const body = await project();
            const candidate = body.result?.canonical_deployment;
            if (body.success && candidate?.environment === 'production'
                && candidate?.latest_stage?.status === 'success'
                && candidate?.deployment_trigger?.metadata?.commit_hash === process.env.RELEASE_SHA) {
              deployment = candidate;
              break;
            }
            if (candidate?.latest_stage?.status === 'failure'
                && candidate?.deployment_trigger?.metadata?.commit_hash === process.env.RELEASE_SHA) {
              throw new Error('new production deployment failed in Cloudflare');
            }
            await sleep(5000);
          }
          if (!deployment) throw new Error('new production deployment was not observed');

          function canonicalOf(html) {
            for (const tag of html.match(/<link\b[^>]*>/gi) || []) {
              if (!/\brel=["'][^"']*canonical[^"']*["']/i.test(tag)) continue;
              const href = tag.match(/\bhref=["']([^"']+)["']/i)?.[1];
              if (href) return href;
            }
            return null;
          }
          function adminAsset(html) {
            const match = html.match(/(?:src|href)=["']([^"']*\/assets\/AdminRoot-[^"']+\.js)["']/i);
            if (!match) throw new Error('new AdminRoot asset missing');
            return new URL(match[1], process.env.PRODUCTION_ORIGIN).pathname.replace(/^\//, '');
          }
          async function manifestAt(origin) {
            const response = await fetchRetry(`${origin}/gptbot-release.json?release=${process.env.RELEASE_SHA}`, {}, 24, async (r) => {
              if (!r.ok) return false;
              try { return (await r.json()).commit === process.env.RELEASE_SHA; } catch { return false; }
            });
            return response.json();
          }
          async function expectRedirect(path, expectedPath) {
            const response = await fetchRetry(`${process.env.PRODUCTION_ORIGIN}${path}`, { redirect: 'manual' }, 12);
            if (response.status !== 301) throw new Error(`${path}: expected 301, got ${response.status}`);
            const location = new URL(response.headers.get('location'), process.env.PRODUCTION_ORIGIN);
            if (location.origin !== process.env.PRODUCTION_ORIGIN || location.pathname !== expectedPath) {
              throw new Error(`${path}: unexpected redirect ${location.href}`);
            }
            return { path, status: response.status, location: location.href };
          }
          async function expect404(path) {
            const response = await fetchRetry(`${process.env.PRODUCTION_ORIGIN}${path}`, { redirect: 'manual' }, 12);
            const html = await response.text();
            if (response.status !== 404) throw new Error(`${path}: expected 404, got ${response.status}`);
            if (!/noindex\s*,?\s*nofollow/i.test(html)) throw new Error(`${path}: 404 is missing noindex,nofollow`);
            return { path, status: 404, noindex: true };
          }
          async function probeWorker(route) {
            const response = await fetchRetry(`${process.env.PRODUCTION_ORIGIN}${route}`, {
              method: 'POST', redirect: 'manual', headers: { 'content-type': 'application/json' }, body: '{}',
            }, 12);
            const text = await response.text();
            if (response.status !== 401 || !/crawler_unauthorized/i.test(text)) {
              throw new Error(`${route}: worker auth contract failed (${response.status})`);
            }
            return { route, status: 401, code: 'crawler_unauthorized' };
          }

          const origins = [process.env.PRODUCTION_ORIGIN, deployment.url];
          const manifests = {};
          const admin = {};
          for (const origin of origins) {
            const manifest = await manifestAt(origin);
            if (JSON.stringify(manifest) !== JSON.stringify(expected)) throw new Error(`${origin}: release manifest mismatch`);
            manifests[origin] = manifest;

            for (const path of ['/', '/robots.txt', '/sitemap.xml', '/ru/telegram-bot-dlya-biznesa/', '/admin/lead-radar']) {
              const response = await fetchRetry(`${origin}${path}?release=${process.env.RELEASE_SHA}`, {}, 18, (r) => r.ok);
              if (!response.ok) throw new Error(`${origin}${path}: HTTP ${response.status}`);
            }
            for (const path of ['/', '/ru/blog/', '/uz/blog/']) {
              const html = await (await fetchRetry(`${origin}${path}?release=${process.env.RELEASE_SHA}`, {}, 18, (r) => r.ok)).text();
              if (/SearchAction|search_term_string|query-input/.test(html)) throw new Error(`${origin}${path}: obsolete search action remains`);
            }
            const adminHtml = await (await fetchRetry(`${origin}/admin/lead-radar?release=${process.env.RELEASE_SHA}`, {}, 18, (r) => r.ok)).text();
            const assetPath = adminAsset(adminHtml);
            const assetResponse = await fetchRetry(`${origin}/${assetPath}?release=${process.env.RELEASE_SHA}`, {}, 18, (r) => r.ok);
            const asset = Buffer.from(await assetResponse.arrayBuffer());
            const text = asset.toString('utf8');
            if (!text.includes('Локальный сборщик') || !text.includes('Собрать контакты с сайта')) {
              throw new Error(`${origin}: local collector UI missing after deploy`);
            }
            admin[origin] = { assetPath, sha256: sha256(asset), localCollector: true };
          }

          const redirects = [];
          redirects.push(await expectRedirect('/ru/blog/?q=%7Bsearch_term_string%7D', '/ru/blog/'));
          redirects.push(await expectRedirect('/uz/blog/?q=sinov', '/uz/blog/'));
          redirects.push(await expectRedirect('/ru/telegram-bot-uzbekistan/', '/ru/telegram-bot-dlya-biznesa/'));
          redirects.push(await expectRedirect('/gpt-uzbek-tilida/', '/uz/gpt-uzbek-tilida/'));
          redirects.push(await expectRedirect('/gpt-chat/', '/ru/gpt-chat/'));

          const notFound = [];
          for (const path of ['/cabinet', '/oauth', '/api', '/callback', '/reset-password', '/auth', '/account']) {
            notFound.push(await expect404(path));
          }

          const workers = [];
          for (const route of [
            '/api/lead-radar/crawler/jobs/claim',
            '/api/lead-radar/crawler/heartbeat',
            '/api/lead-radar/crawler/receipt',
          ]) workers.push(await probeWorker(route));
          const owner = await fetchRetry(`${process.env.PRODUCTION_ORIGIN}/api/admin/lead-radar/crawler/status?companyId=canary`, { redirect: 'manual' }, 12);
          if (owner.status === 404 || owner.status < 400 || owner.status >= 500) {
            throw new Error(`owner crawler route auth contract failed (${owner.status})`);
          }

          const sitemapResponse = await fetchRetry(`${process.env.PRODUCTION_ORIGIN}/sitemap.xml?release=${process.env.RELEASE_SHA}`, {}, 18, (r) => r.ok);
          const sitemap = await sitemapResponse.text();
          const urls = [...new Set([...sitemap.matchAll(/<loc>([^<]+)<\/loc>/g)].map((match) => match[1].trim()))];
          if (urls.length !== 260) throw new Error(`expected 260 sitemap URLs, got ${urls.length}`);
          for (const retired of [
            '/ru/telegram-bot-uzbekistan/', '/gpt-uzbek-tilida/', '/gpt-chat/',
            '/ru/gpt-bot-dlya-biznesa/', '/ru/bot-dlya-obrabotki-zayavok/',
          ]) {
            if (sitemap.includes(`<loc>${process.env.PRODUCTION_ORIGIN}${retired}</loc>`)) {
              throw new Error(`retired URL remains in sitemap: ${retired}`);
            }
          }
          const sitemapResults = new Array(urls.length);
          let cursor = 0;
          async function sitemapWorker() {
            while (cursor < urls.length) {
              const index = cursor++;
              const url = urls[index];
              const response = await fetchRetry(`${url}?release=${process.env.RELEASE_SHA}`, {}, 12);
              const html = await response.text();
              sitemapResults[index] = { url, status: response.status, canonical: canonicalOf(html) };
            }
          }
          await Promise.all(Array.from({ length: 8 }, sitemapWorker));
          const badSitemap = sitemapResults.filter((item) => item.status !== 200 || item.canonical !== item.url);
          if (badSitemap.length) throw new Error(`sitemap self-canonical canary failed: ${JSON.stringify(badSitemap.slice(0, 5))}`);

          const wwwResponse = await fetchRetry(`https://www.gptbot.uz/uz/chat-bot-narxi/`, { redirect: 'manual' }, 12);
          const wwwLocation = new URL(wwwResponse.headers.get('location'), 'https://www.gptbot.uz/').href;
          if (wwwResponse.status !== 301 || wwwLocation !== `${process.env.PRODUCTION_ORIGIN}/uz/chat-bot-narxi/`) {
            throw new Error(`www canonical redirect failed: ${wwwResponse.status} ${wwwLocation}`);
          }

          const evidence = {
            checkedAt: new Date().toISOString(),
            releaseSha: process.env.RELEASE_SHA,
            previous: {
              deploymentId: before.deployment.id,
              deploymentUrl: before.deployment.url,
              commit: before.deployment.commit,
              artifactSha256: before.manifest.artifactSha256,
              admin: before.admin[process.env.PRODUCTION_ORIGIN],
            },
            deployed: {
              deploymentId: deployment.id,
              deploymentUrl: deployment.url,
              environment: deployment.environment,
              status: deployment.latest_stage.status,
              commit: deployment.deployment_trigger?.metadata?.commit_hash ?? null,
              aliases: deployment.aliases ?? [],
              artifactSha256: expected.artifactSha256,
              fileCount: expected.fileCount,
              features: expected.features,
              admin,
            },
            checks: {
              customAndImmutableManifestMatch: true,
              currentManifestFeaturesPreserved: true,
              localCollectorUi: true,
              crawlerWorkerAuthFirst: workers,
              crawlerOwnerRouteAuthProtected: owner.status,
              searchActionAbsent: true,
              legacyRedirects: redirects,
              privateRoutes404Noindex: notFound,
              sitemapCount: urls.length,
              sitemapAll200SelfCanonical: true,
              wwwCanonicalRedirect: { status: wwwResponse.status, location: wwwLocation },
            },
            canary: 'pass',
          };
          fs.writeFileSync('evidence/deployment-evidence.json', JSON.stringify(evidence, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_ENV, [
            `NEW_DEPLOYMENT_ID=${deployment.id}`,
            `NEW_DEPLOYMENT_URL=${deployment.url}`,
            `NEW_ARTIFACT_SHA=${expected.artifactSha256}`,
          ].join('\n') + '\n');
          console.log(`NEW_DEPLOYMENT_ID=${deployment.id}`);
          console.log(`IMMUTABLE_URL=${deployment.url}`);
          console.log(`ARTIFACT_SHA256=${expected.artifactSha256}`);
          console.log('LIVE_PRODUCTION_CANARY=pass');
          NODE

      - name: Write successful release summary
        if: success()
        shell: bash
        run: |
          {
            echo '## GPTBot.uz production release'
            echo
            echo "- Release SHA: \`$RELEASE_SHA\`"
            echo "- Deployment ID: \`$NEW_DEPLOYMENT_ID\`"
            echo "- Immutable URL: $NEW_DEPLOYMENT_URL"
            echo "- Artifact SHA-256: \`$NEW_ARTIFACT_SHA\`"
            echo '- GSC indexation canary: pass'
            echo '- Local Collector preservation canary: pass'
            echo '- 260/260 sitemap URLs: 200 + self-canonical'
            echo '- Legacy redirects and intentional noindex 404s: pass'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back to previous production artifact after failed canary
        if: failure() && steps.deploy.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo 'Post-upload verification failed; requesting Cloudflare Pages rollback.'
          curl --fail --silent --show-error --request POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments/$BEFORE_DEPLOYMENT_ID/rollback" \
            > evidence/rollback.raw.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const body = JSON.parse(fs.readFileSync('evidence/rollback.raw.json', 'utf8'));
          if (!body.success) throw new Error(`rollback API failed: ${JSON.stringify(body.errors || [])}`);
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let restored = null;
          for (let i = 0; i < 36; i++) {
            try {
              const response = await fetch(`${process.env.PRODUCTION_ORIGIN}/gptbot-release.json?rollback=${Date.now()}`, {
                cache: 'no-store', signal: AbortSignal.timeout(30000),
              });
              if (response.ok) {
                const manifest = await response.json();
                if (manifest.artifactSha256 === process.env.BEFORE_ARTIFACT_SHA) {
                  restored = manifest;
                  break;
                }
              }
            } catch {}
            await sleep(5000);
          }
          if (!restored) throw new Error('previous production artifact was not restored after rollback');
          fs.writeFileSync('evidence/rollback-safe.json', JSON.stringify({
            checkedAt: new Date().toISOString(),
            previousDeploymentId: process.env.BEFORE_DEPLOYMENT_ID,
            restoredArtifactSha256: restored.artifactSha256,
            restoredCommit: restored.commit,
            result: 'pass',
          }, null, 2) + '\n');
          console.log('AUTOMATIC_ROLLBACK=pass');
          NODE
          rm -f evidence/rollback.raw.json

      - name: Upload sanitized deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gptbot-gsc-crawler-production-evidence-${{ env.RELEASE_SHA }}
          path: |
            evidence/before-safe.json
            evidence/candidate-safe.json
            evidence/race-guard-safe.json
            evidence/deployment-evidence.json
            evidence/rollback-safe.json
            evidence/wrangler-deploy.txt
            dist/gptbot-release.json
          if-no-files-found: warn
          retention-days: 30

      - name: Remove one-shot deployment workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ops/deploy-gsc-crawler-recovery-20260831
          git switch -C ops/deploy-gsc-crawler-recovery-20260831 origin/ops/deploy-gsc-crawler-recovery-20260831
          git config user.name "GPTBot Release CI"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/deploy-gsc-crawler-recovery-20260831.yml
          git commit -m "chore(release): remove one-shot GSC crawler deployment workflow"
          git push origin HEAD:ops/deploy-gsc-crawler-recovery-20260831
