name: secret-scan

# R0.3C prevention gate.
#
# The R0.3 credential incident sat in this public repository for five weeks
# without a single GitHub secret-scanning alert, because the exposed values were
# generic high-entropy strings with no provider prefix. This workflow runs the
# repository's own detector, which additionally treats any high-entropy value
# inside a credential-named file as critical.
#
# The job prints rule, path and line only — never a matched value — so its logs
# are safe to read and to quote in an issue.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the gate also sees what a force-push tries to land.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tsx
        run: npm install --no-save tsx@4

      - name: Scan tracked files
        run: npx tsx scripts/scan-secrets.ts

      - name: Detector self-tests
        run: node --import tsx --test tests/secret-scan.test.ts
