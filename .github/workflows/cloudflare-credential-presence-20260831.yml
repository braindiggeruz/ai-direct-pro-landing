name: cloudflare-credential-presence-20260831

on:
  push:
    branches:
      - release/hot-traffic-production-20260831
    paths:
      - .github/workflows/cloudflare-credential-presence-20260831.yml

permissions:
  contents: write

jobs:
  inspect-names-only:
    runs-on: ubuntu-latest
    env:
      S_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      S_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      S_CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      S_CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      S_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
      S_CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      S_CF_API_KEY: ${{ secrets.CF_API_KEY }}
      S_CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      S_CF_EMAIL: ${{ secrets.CF_EMAIL }}
      S_CLOUDFLARE_API_TOKEN_PROD: ${{ secrets.CLOUDFLARE_API_TOKEN_PROD }}
      S_CLOUDFLARE_ACCOUNT_ID_PROD: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PROD }}
      S_CF_API_TOKEN_PROD: ${{ secrets.CF_API_TOKEN_PROD }}
      S_CF_ACCOUNT_ID_PROD: ${{ secrets.CF_ACCOUNT_ID_PROD }}
      S_CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
      S_CLOUDFLARE_PAGES_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
      S_CF_PAGES_DEPLOY_HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
      S_PAGES_DEPLOY_HOOK: ${{ secrets.PAGES_DEPLOY_HOOK }}
      S_DEPLOY_HOOK: ${{ secrets.DEPLOY_HOOK }}
      V_CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      V_CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      V_CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      V_CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/hot-traffic-production-20260831

      - name: Report credential names that exist
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for name in \
            S_CLOUDFLARE_API_TOKEN S_CLOUDFLARE_ACCOUNT_ID S_CF_API_TOKEN S_CF_ACCOUNT_ID \
            S_CLOUDFLARE_TOKEN S_CLOUDFLARE_API_KEY S_CF_API_KEY S_CLOUDFLARE_EMAIL S_CF_EMAIL \
            S_CLOUDFLARE_API_TOKEN_PROD S_CLOUDFLARE_ACCOUNT_ID_PROD S_CF_API_TOKEN_PROD S_CF_ACCOUNT_ID_PROD \
            S_CLOUDFLARE_DEPLOY_HOOK S_CLOUDFLARE_PAGES_DEPLOY_HOOK S_CF_PAGES_DEPLOY_HOOK S_PAGES_DEPLOY_HOOK S_DEPLOY_HOOK \
            V_CLOUDFLARE_ACCOUNT_ID V_CF_ACCOUNT_ID V_CLOUDFLARE_PAGES_PROJECT V_CF_PAGES_PROJECT
          do
            if [ -n "${!name:-}" ]; then
              echo "PRESENT:$name"
              found=1
            else
              echo "MISSING:$name"
            fi
          done
          echo "ANY_PRESENT=$found"

      - name: Remove one-shot inventory workflow
        if: always()
        shell: bash
        run: |
          git config user.name "GPTBot Release CI"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/cloudflare-credential-presence-20260831.yml
          git commit -m "chore(release): remove credential-name inventory workflow"
          git push origin HEAD:release/hot-traffic-production-20260831
