name: apply-gsc-indexation-hygiene-20260831

on:
  push:
    branches:
      - fix/gsc-indexation-hygiene-20260831
    paths:
      - .github/scripts/apply-gsc-indexation-hygiene.mjs
      - .github/workflows/apply-gsc-indexation-hygiene-20260831.yml

permissions:
  contents: write

concurrency:
  group: apply-gsc-indexation-hygiene-20260831
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gsc-indexation-hygiene-20260831
          fetch-depth: 0

      - name: Assert production base and apply corrections
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e81f65e6c4757f77ed2991ef12b599d956185e55 HEAD
          node .github/scripts/apply-gsc-indexation-hygiene.mjs

      - name: Remove one-shot automation from final tree
        run: git rm -f .github/scripts/apply-gsc-indexation-hygiene.mjs .github/workflows/apply-gsc-indexation-hygiene-20260831.yml

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn

      - name: Install locked dependencies
        run: |
          yarn install --frozen-lockfile --ignore-scripts --non-interactive
          npm --prefix apps/bormi-admin ci --ignore-scripts --no-audit --no-fund

      - name: Run focused and complete regression gates
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          yarn test:gsc-indexation
          yarn test
          yarn typecheck:lead-radar
          yarn test:lead-radar
          yarn test:pages-production
          yarn seo:audit
          yarn tsc -b
          yarn scan:secrets
          git diff --check

      - name: Validate intended source state
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE 'SearchAction|search_term_string|query-input' index.html
          ! grep -RniE '/ru/gpt-bot-dlya-biznesa/|/ru/bot-dlya-obrabotki-zayavok/' \
            src/shared/site-config.ts src/components/Footer.tsx src/components/SolutionsGrid.tsx \
            src/shared/booster.ts public/llms.txt public/llms-full.txt
          node - <<'NODE'
          const fs=require('node:fs');
          const redirects=JSON.parse(fs.readFileSync('content/seo/redirects.json','utf8'));
          for(const [from,to] of [
            ['/ru/telegram-bot-uzbekistan/','/ru/telegram-bot-dlya-biznesa/'],
            ['/gpt-uzbek-tilida/','/uz/gpt-uzbek-tilida/'],
            ['/gpt-chat/','/ru/gpt-chat/'],
          ]){
            const rows=redirects.filter(x=>x.from===from);
            if(rows.length!==1||rows[0].to!==to||rows[0].statusCode!==301) throw new Error(from);
          }
          NODE

      - name: Commit reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GPTBot SEO CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "fix(seo): clean GSC canonical and legacy 404 signals"

      - name: Build and verify exact production artifact
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          test -z "$(git status --porcelain)"
          npm run build:production
          npx --no-install tsx scripts/release/pages-production.ts check
          ! grep -RniE 'SearchAction|search_term_string|query-input' dist/index.html dist/ru/blog/index.html dist/uz/blog/index.html
          grep -F '/ru/telegram-bot-uzbekistan/  /ru/telegram-bot-dlya-biznesa/  301' dist/_redirects
          grep -F '/gpt-uzbek-tilida/  /uz/gpt-uzbek-tilida/  301' dist/_redirects
          grep -F '/gpt-chat/  /ru/gpt-chat/  301' dist/_redirects

      - name: Push verified implementation
        run: git push origin HEAD:fix/gsc-indexation-hygiene-20260831
