name: deploy-gsc-indexation-crawler-final-20260901

on:
  push:
    branches:
      - ops/deploy-gsc-indexation-crawler-final-20260901
    paths:
      - .github/scripts/gsc-final-release/**
      - .github/workflows/deploy-gsc-indexation-crawler-final-20260901.yml

permissions:
  contents: write

concurrency:
  group: gptbot-pages-production
  cancel-in-progress: false

env:
  RELEASE_SHA: 147a8dc3b1e0a382727e876978ebf97d0b5e821d
  RELEASE_BRANCH: release/gsc-indexation-crawler-final-20260901
  EXPECTED_MAIN_SHA: a45db41ef32a3077c0f9af2f912d0c1239d127d9
  EXPECTED_OLD_DEPLOYMENT_ID: 6da93a09-b662-42d5-948e-ce8e19a3cba1
  EXPECTED_OLD_COMMIT: 39f67ad83edc4600f9700d7a9230f28996abc3e1
  EXPECTED_OLD_ARTIFACT: 3b8c157411edcc66de071d24c6c2be05d0099adbfbe50e8a0143883d82dc7a5f
  EXPECTED_OLD_ADMIN_HASH: e2fe0a69594e8a274a181b1424c3db5211078d08126029c0ae2a77dcc00c1f70
  PROJECT: ai-direct-pro-landing
  PREVIEW_BRANCH: gsc-indexation-crawler-final-preflight-20260901
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  verify-deploy-align:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out guarded deployment tooling
        uses: actions/checkout@v4
        with:
          ref: ops/deploy-gsc-indexation-crawler-final-20260901
          path: ops
          fetch-depth: 0

      - name: Check out exact reviewed release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          path: release
          fetch-depth: 0

      - name: Assert immutable release lineage and exact scope
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git ls-remote origin refs/heads/$RELEASE_BRANCH | cut -f1)" = "$RELEASE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN_SHA"
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" "$RELEASE_SHA"
          git diff --quiet
          git diff --cached --quiet
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test ! -e evidence/blog-edge-preview-safe.json
          test -f migrations/0056_lead_radar_crawler.sql
          test -f functions/lib/blog-index-edge.ts
          test -f functions/ru/blog/index.ts
          test -f functions/uz/blog/index.ts
          test -f public/_routes.json
          grep -F 'MAX_DIRECTORY_CONTACT_CANDIDATES_PER_COMPANY = 256' functions/platform/lead-radar/recipient-directory.ts
          grep -F 'MAX_DIRECTORY_PHONE_EVIDENCE_PER_COMPANY = 128' functions/platform/lead-radar/recipient-directory.ts
          grep -F 'matches.filter((group)=>group.hasBusinessContact)' functions/platform/lead-radar/audiences.ts
          ! grep -F 'JSON.parse(member.telegram_contact_json' functions/platform/lead-radar/audiences.ts
          grep -F "createBlogIndexHandler('/ru/blog/')" functions/ru/blog/index.ts
          grep -F "createBlogIndexHandler('/uz/blog/')" functions/uz/blog/index.ts
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const routes = JSON.parse(fs.readFileSync('public/_routes.json', 'utf8'));
          const expected = ['/api/*','/admin-tools/*','/admin/*','/robots.txt','/ru/blog','/ru/blog/','/uz/blog','/uz/blog/'].sort();
          if (routes.version !== 1
            || JSON.stringify([...routes.include].sort()) !== JSON.stringify(expected)
            || JSON.stringify(routes.exclude) !== JSON.stringify(['/admin/assets/*'])) {
            throw new Error(`unexpected source routes: ${JSON.stringify(routes)}`);
          }
          if (routes.include.includes('/ru/blog/*') || routes.include.includes('/uz/blog/*')) {
            throw new Error('blog article routes must remain static');
          }
          console.log('SOURCE_SCOPE=pass');
          NODE

      - name: Guard the exact live release being replaced
        working-directory: release
        run: node ../ops/.github/scripts/gsc-final-release/guard.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: release/yarn.lock

      - name: Install locked dependencies
        working-directory: release
        run: |
          yarn install --frozen-lockfile --ignore-scripts --non-interactive
          npm --prefix apps/bormi-admin ci --ignore-scripts --no-audit --no-fund

      - name: Run complete regression SEO type and security gates
        working-directory: release
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        shell: bash
        run: |
          set -euo pipefail
          yarn test:gsc-indexation
          node --import tsx --test tests/lead-radar-audiences.test.ts tests/lead-radar-crawler.test.ts tests/lead-radar-crawler-contract.test.ts
          yarn test
          yarn typecheck:lead-radar
          yarn test:lead-radar
          yarn test:pages-production
          yarn seo:audit
          yarn tsc -b
          yarn scan:secrets
          git diff --check
          git diff --quiet
          git diff --cached --quiet

      - name: Build and freeze exact production artifact
        working-directory: release
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        shell: bash
        run: |
          set -euo pipefail
          npm run build:production
          npx --no-install tsx scripts/release/pages-production.ts check
          cmp public/_routes.json dist/_routes.json
          node ../ops/.github/scripts/gsc-final-release/verify-candidate.mjs
          ! grep -RniE 'SearchAction|search_term_string|query-input' dist/index.html dist/ru/blog/index.html dist/uz/blog/index.html
          grep -F '/ru/telegram-bot-uzbekistan/  /ru/telegram-bot-dlya-biznesa/  301' dist/_redirects
          grep -F '/gpt-uzbek-tilida/  /uz/gpt-uzbek-tilida/  301' dist/_redirects
          grep -F '/gpt-chat/  /ru/gpt-chat/  301' dist/_redirects

      - name: Exercise candidate Functions and live D1 in isolated preview
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          export PROBE_TOKEN=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
          echo "::add-mask::$PROBE_TOKEN"
          echo "PROBE_TOKEN=$PROBE_TOKEN" >> "$GITHUB_ENV"
          node ../ops/.github/scripts/gsc-final-release/write-probe.mjs
          node node_modules/wrangler/bin/wrangler.js pages deploy dist \
            --project-name "$PROJECT" \
            --branch "$PREVIEW_BRANCH" \
            --commit-hash "$RELEASE_SHA" \
            --commit-dirty=true | tee evidence/preflight-preview.log
          export PREVIEW_URL=$(grep -Eo 'https://[a-z0-9-]+\.ai-direct-pro-landing\.pages\.dev' evidence/preflight-preview.log | head -1)
          test -n "$PREVIEW_URL"
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          node ../ops/.github/scripts/gsc-final-release/check-preview.mjs
          rm -f functions/api/internal/release-directory-probe.ts
          test ! -e functions/api/internal/release-directory-probe.ts
          git diff --quiet
          git diff --cached --quiet

      - name: Final production and main race guard
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin refs/heads/$RELEASE_BRANCH | cut -f1)" = "$RELEASE_SHA"
          node ../ops/.github/scripts/gsc-final-release/race-guard.mjs

      - name: Deploy exact artifact and Functions to production
        id: deploy
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/wrangler/bin/wrangler.js pages deploy dist \
            --project-name "$PROJECT" \
            --branch main \
            --commit-hash "$RELEASE_SHA" \
            --commit-dirty=false | tee evidence/production-deploy.log
          node ../ops/.github/scripts/gsc-final-release/wait-deployment.mjs

      - name: Run production SEO crawler sitemap and heartbeat canaries
        id: canary
        working-directory: release
        run: node ../ops/.github/scripts/gsc-final-release/canary.mjs

      - name: Roll back automatically if production canary fails
        if: failure() && steps.deploy.outcome == 'success' && steps.canary.outcome == 'failure'
        working-directory: release
        run: node ../ops/.github/scripts/gsc-final-release/rollback.mjs

      - name: Fast-forward main to deployed source of truth
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_MAIN=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$CURRENT_MAIN" = "$EXPECTED_MAIN_SHA" || test "$CURRENT_MAIN" = "$RELEASE_SHA"
          if [ "$CURRENT_MAIN" != "$RELEASE_SHA" ]; then
            git push origin "$RELEASE_SHA:refs/heads/main"
          fi
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$RELEASE_SHA"
          node -e "require('fs').writeFileSync('evidence/main-alignment-safe.json',JSON.stringify({alignedAt:new Date().toISOString(),previous:'$EXPECTED_MAIN_SHA',current:'$RELEASE_SHA'},null,2)+'\n')"
          echo 'MAIN_ALIGNMENT=pass'

      - name: Verify final canonical deployment and source alignment
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$RELEASE_SHA"
          node ../ops/.github/scripts/gsc-final-release/final-verify.mjs

      - name: Upload sanitized release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gptbot-gsc-indexation-crawler-final-${{ env.RELEASE_SHA }}
          path: |
            release/evidence/*.json
            release/evidence/production-deploy.log
            release/evidence/preflight-preview.log
            release/dist/gptbot-release.json
            release/dist/_routes.json
          if-no-files-found: warn
          retention-days: 30

      - name: Delete temporary D1 preview
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ -z "${PREVIEW_DEPLOYMENT_ID:-}" ] && [ -n "${PREVIEW_URL:-}" ]; then
            mkdir -p release/evidence
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments?per_page=25" \
              > release/evidence/cleanup-preview-list.json || true
            if [ -s release/evidence/cleanup-preview-list.json ]; then
              PREVIEW_DEPLOYMENT_ID=$(PREVIEW_URL="$PREVIEW_URL" node -e "const fs=require('fs');const b=JSON.parse(fs.readFileSync('release/evidence/cleanup-preview-list.json','utf8'));const x=(b.result||[]).find(v=>v.url===process.env.PREVIEW_URL);process.stdout.write(x?.id||'')")
            fi
            rm -f release/evidence/cleanup-preview-list.json
          fi
          if [ -n "${PREVIEW_DEPLOYMENT_ID:-}" ]; then
            curl --silent --show-error --request DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments/$PREVIEW_DEPLOYMENT_ID?force=true" >/dev/null
          fi
