name: inspect-production-race-20260831

on:
  push:
    branches:
      - ops/inspect-production-race-20260831
    paths:
      - .github/workflows/inspect-production-race-20260831.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_SHA: 42df64e1a4bfc1121b1fc1882a7b6c46f8fa428b
      PROJECT: ai-direct-pro-landing
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Inspect the new canonical production without writes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT" \
            > evidence/project.json
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments?env=production&per_page=10" \
            > evidence/deployments.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const project = JSON.parse(fs.readFileSync('evidence/project.json','utf8'));
          const deployments = JSON.parse(fs.readFileSync('evidence/deployments.json','utf8'));
          const current = project.result?.canonical_deployment;
          if (!project.success || !current) throw new Error('canonical deployment unavailable');
          const safeDeployment = (item) => ({
            id: item?.id,
            url: item?.url,
            environment: item?.environment,
            status: item?.latest_stage?.status,
            createdOn: item?.created_on,
            modifiedOn: item?.modified_on,
            branch: item?.deployment_trigger?.metadata?.branch,
            commit: item?.deployment_trigger?.metadata?.commit_hash,
            commitMessage: item?.deployment_trigger?.metadata?.commit_message,
            commitDirty: item?.deployment_trigger?.metadata?.commit_dirty,
            aliases: item?.aliases ?? [],
          });
          async function get(url, options = {}) {
            return fetch(url, { cache:'no-store', signal:AbortSignal.timeout(30000), ...options });
          }
          const origins = ['https://gptbot.uz', current.url];
          const originEvidence = {};
          for (const origin of origins) {
            const manifestResponse = await get(`${origin}/gptbot-release.json?inspect=${Date.now()}`);
            const manifest = await manifestResponse.json();
            const admin = manifest.probes?.find((item) => /^assets\/AdminRoot-.*\.js$/.test(item.path));
            const adminResponse = admin ? await get(`${origin}/${admin.path}?inspect=${Date.now()}`) : null;
            const adminBytes = adminResponse?.ok ? new Uint8Array(await adminResponse.arrayBuffer()) : new Uint8Array();
            const adminHash = adminBytes.length ? crypto.createHash('sha256').update(adminBytes).digest('hex') : null;
            const adminText = adminBytes.length ? new TextDecoder().decode(adminBytes) : '';
            const homeResponse = await get(`${origin}/?inspect=${Date.now()}`);
            const home = await homeResponse.text();
            const workerResponse = await get(`${origin}/api/lead-radar/crawler/jobs`, { method:'POST', headers:{'content-type':'application/json'}, body:'{}' });
            const workerBody = await workerResponse.json().catch(() => ({}));
            const blogQuery = await get(`${origin}/ru/blog/?q=%7Bsearch_term_string%7D`, { redirect:'manual' });
            const telegramLegacy = await get(`${origin}/ru/telegram-bot-uzbekistan/`, { redirect:'manual' });
            originEvidence[origin] = {
              manifestStatus: manifestResponse.status,
              manifest,
              adminActualSha256: adminHash,
              crawlerUiMarkers: {
                localCollector: adminText.includes('Локальный сборщик'),
                collectContacts: adminText.includes('Собрать контакты с сайта'),
                ownerStatusRoute: adminText.includes('/api/admin/lead-radar/crawler/status'),
                ownerJobsRoute: adminText.includes('/api/admin/lead-radar/crawler/jobs'),
              },
              searchActionPresent: /SearchAction|search_term_string|query-input/.test(home),
              workerRoute: { status: workerResponse.status, error: workerBody.error ?? null },
              blogQuery: { status: blogQuery.status, location: blogQuery.headers.get('location') },
              telegramLegacy: { status: telegramLegacy.status, location: telegramLegacy.headers.get('location') },
            };
          }
          const safe = {
            checkedAt: new Date().toISOString(),
            reviewedReleaseSha: process.env.RELEASE_SHA,
            projectSource: {
              productionBranch: project.result?.source?.config?.production_branch ?? null,
              productionDeploymentsEnabled: project.result?.source?.config?.production_deployments_enabled ?? null,
            },
            current: safeDeployment(current),
            recent: (deployments.result ?? []).slice(0,10).map(safeDeployment),
            origins: originEvidence,
          };
          fs.writeFileSync('evidence/production-race-safe.json', JSON.stringify(safe,null,2)+'\n');
          console.log(JSON.stringify(safe,null,2));
          NODE
          rm -f evidence/project.json evidence/deployments.json

      - uses: actions/upload-artifact@v4
        with:
          name: gptbot-production-race-inspection-20260831
          path: evidence/production-race-safe.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove one-shot inspection workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ops/inspect-production-race-20260831
          git switch -C ops/inspect-production-race-20260831 origin/ops/inspect-production-race-20260831
          git config user.name "GPTBot Production Inspection CI"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/inspect-production-race-20260831.yml
          git commit -m "chore(release): remove one-shot production race inspection"
          git push origin HEAD:ops/inspect-production-race-20260831
