name: inspect-post-canary-production-20260831

on:
  push:
    branches:
      - ops/inspect-post-canary-production-20260831
    paths:
      - .github/workflows/inspect-post-canary-production-20260831.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT: ai-direct-pro-landing
      CANDIDATE_SHA: 9e23024e066a158153a7f89e9e27e49e9dacb02b
      CANDIDATE_DEPLOYMENT_ID: 3c04d3ae-5d33-4b85-91d9-1db66ff2a42a
      PREDECESSOR_DEPLOYMENT_ID: 6da93a09-b662-42d5-948e-ce8e19a3cba1
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/inspect-post-canary-production-20260831

      - name: Inspect canonical production and live contracts without writes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT" \
            > evidence/project.json
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments?env=production&per_page=10" \
            > evidence/deployments.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const project = JSON.parse(fs.readFileSync('evidence/project.json','utf8'));
          const deployments = JSON.parse(fs.readFileSync('evidence/deployments.json','utf8'));
          const current = project.result?.canonical_deployment;
          if (!project.success || !current) throw new Error('canonical deployment unavailable');
          const safeDeployment = (item) => ({
            id:item?.id,url:item?.url,environment:item?.environment,status:item?.latest_stage?.status,
            branch:item?.deployment_trigger?.metadata?.branch,commit:item?.deployment_trigger?.metadata?.commit_hash,
            commitMessage:item?.deployment_trigger?.metadata?.commit_message,commitDirty:item?.deployment_trigger?.metadata?.commit_dirty,
            createdOn:item?.created_on,modifiedOn:item?.modified_on,aliases:item?.aliases??[],
          });
          async function inspectOrigin(origin) {
            const manifestResponse = await fetch(`${origin}/gptbot-release.json?inspect=${Date.now()}`,{cache:'no-store',signal:AbortSignal.timeout(30000)});
            const manifest = await manifestResponse.json().catch(()=>null);
            const homeResponse = await fetch(`${origin}/?inspect=${Date.now()}`,{cache:'no-store',signal:AbortSignal.timeout(30000)});
            const home = await homeResponse.text();
            const q = await fetch(`${origin}/ru/blog/?q=%7Bsearch_term_string%7D`,{redirect:'manual',cache:'no-store',signal:AbortSignal.timeout(30000)});
            const legacy = await fetch(`${origin}/ru/telegram-bot-uzbekistan/`,{redirect:'manual',cache:'no-store',signal:AbortSignal.timeout(30000)});
            const worker = await fetch(`${origin}/api/lead-radar/crawler/jobs`,{method:'POST',headers:{'content-type':'application/json'},body:'{}',cache:'no-store',signal:AbortSignal.timeout(30000)});
            const workerBody = await worker.json().catch(()=>({}));
            const owner = await fetch(`${origin}/api/admin/lead-radar/crawler/status?companyId=test`,{cache:'no-store',signal:AbortSignal.timeout(30000)});
            const ownerBody = await owner.json().catch(()=>({}));
            return {
              manifestStatus:manifestResponse.status,manifest,
              homeStatus:homeResponse.status,searchActionPresent:/SearchAction|search_term_string|query-input/.test(home),
              blogQuery:{status:q.status,location:q.headers.get('location')},
              telegramLegacy:{status:legacy.status,location:legacy.headers.get('location')},
              worker:{status:worker.status,error:workerBody.error??null},
              owner:{status:owner.status,error:ownerBody.error??null},
            };
          }
          const safe = {
            checkedAt:new Date().toISOString(),
            source:{productionBranch:project.result?.source?.config?.production_branch??null,productionDeploymentsEnabled:project.result?.source?.config?.production_deployments_enabled??null},
            current:safeDeployment(current),
            recent:(deployments.result??[]).slice(0,10).map(safeDeployment),
            apex:await inspectOrigin('https://gptbot.uz'),
            currentImmutable:await inspectOrigin(current.url),
            candidateImmutable:await inspectOrigin('https://3c04d3ae.ai-direct-pro-landing.pages.dev'),
            predecessorImmutable:await inspectOrigin('https://6da93a09.ai-direct-pro-landing.pages.dev'),
          };
          fs.writeFileSync('evidence/post-canary-production-safe.json',JSON.stringify(safe,null,2)+'\n');
          console.log(JSON.stringify(safe,null,2));
          NODE
          rm -f evidence/project.json evidence/deployments.json

      - uses: actions/upload-artifact@v4
        with:
          name: gptbot-post-canary-production-inspection-20260831
          path: evidence/post-canary-production-safe.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove one-shot inspection workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ops/inspect-post-canary-production-20260831
          git switch -C ops/inspect-post-canary-production-20260831 origin/ops/inspect-post-canary-production-20260831
          git config user.name "GPTBot Production Inspection CI"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/inspect-post-canary-production-20260831.yml
          git commit -m "chore(release): remove post-canary production inspection"
          git push origin HEAD:ops/inspect-post-canary-production-20260831
