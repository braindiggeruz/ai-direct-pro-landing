name: inspect-live-crawler-schema-20260831-r2

on:
  push:
    branches:
      - ops/inspect-live-crawler-schema-20260831-r2
    paths:
      - .github/workflows/inspect-live-crawler-schema-20260831-r2.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_SHA: 6cbdb9f40ee23a860f6700c371709fb625f0f18b
      PROJECT: ai-direct-pro-landing
      PREVIEW_BRANCH: schema-inspect-crawler-r2-20260831
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn

      - name: Build isolated read-only schema endpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
          yarn install --frozen-lockfile --ignore-scripts --non-interactive
          npm --prefix apps/bormi-admin ci --ignore-scripts --no-audit --no-fund
          INSPECT_TOKEN=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
          echo "::add-mask::$INSPECT_TOKEN"
          echo "INSPECT_TOKEN=$INSPECT_TOKEN" >> "$GITHUB_ENV"
          mkdir -p functions/api/internal reports
          cat > functions/api/internal/gsc-crawler-schema-inspect.ts <<'EOF'
          interface Env { GPTBOT_DRAFTS_DB: D1Database }

          export const onRequestGet: PagesFunction<Env> = async ({ request, env }) => {
            const url = new URL(request.url);
            if (url.searchParams.get('token') !== '__INSPECT_TOKEN__') {
              return new Response('not found', { status: 404, headers: { 'Cache-Control': 'no-store' } });
            }
            try {
              const master = await env.GPTBOT_DRAFTS_DB.prepare(
                "SELECT type,name,tbl_name,sql FROM sqlite_master WHERE name NOT LIKE 'sqlite_%' ORDER BY type,name"
              ).all<Record<string, unknown>>();
              const migrations = await env.GPTBOT_DRAFTS_DB.prepare(
                "SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 30"
              ).all<Record<string, unknown>>().catch(() => ({ results: [] }));
              const rows = master.results ?? [];
              const crawlerObjects = rows.filter((row) =>
                /crawler|collector/i.test(String(row.name ?? '')) || /crawler|collector/i.test(String(row.sql ?? ''))
              );
              const tableNames = rows.filter((row) => row.type === 'table').map((row) => String(row.name));
              const details: Record<string, unknown> = {};
              for (const row of crawlerObjects.filter((item) => item.type === 'table')) {
                const name = String(row.name);
                if (!/^[A-Za-z0-9_]+$/.test(name)) continue;
                const columns = await env.GPTBOT_DRAFTS_DB.prepare(`PRAGMA table_info(${name})`).all();
                const indexes = await env.GPTBOT_DRAFTS_DB.prepare(`PRAGMA index_list(${name})`).all();
                const foreignKeys = await env.GPTBOT_DRAFTS_DB.prepare(`PRAGMA foreign_key_list(${name})`).all();
                const count = await env.GPTBOT_DRAFTS_DB.prepare(`SELECT COUNT(*) AS count FROM ${name}`).first();
                details[name] = {
                  columns: columns.results ?? [],
                  indexes: indexes.results ?? [],
                  foreignKeys: foreignKeys.results ?? [],
                  count,
                };
              }
              return Response.json({
                generatedAt: new Date().toISOString(),
                migrations: migrations.results ?? [],
                tableNames,
                crawlerObjects,
                details,
              }, { headers: { 'Cache-Control': 'no-store', 'X-Robots-Tag': 'noindex, nofollow' } });
            } catch (error) {
              const message = error instanceof Error ? error.message : 'schema inspection failed';
              return Response.json({ error: message }, {
                status: 500,
                headers: { 'Cache-Control': 'no-store', 'X-Robots-Tag': 'noindex, nofollow' },
              });
            }
          };
          EOF
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'functions/api/internal/gsc-crawler-schema-inspect.ts';
          const token = process.env.INSPECT_TOKEN;
          const source = fs.readFileSync(file, 'utf8').replace('__INSPECT_TOKEN__', token);
          fs.writeFileSync(file, source);
          NODE
          npm run build:fast
          npm --prefix apps/bormi-admin run build

      - name: Deploy preview and capture schema
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/wrangler/bin/wrangler.js pages deploy dist \
            --project-name "$PROJECT" \
            --branch "$PREVIEW_BRANCH" \
            --commit-hash "$SOURCE_SHA" \
            --commit-dirty=true | tee reports/wrangler-preview.txt
          PREVIEW_URL=$(grep -Eo 'https://[a-z0-9-]+\.ai-direct-pro-landing\.pages\.dev' reports/wrangler-preview.txt | head -1)
          test -n "$PREVIEW_URL"
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          status=$(curl --silent --show-error \
            --output reports/crawler-schema.json \
            --write-out '%{http_code}' \
            "$PREVIEW_URL/api/internal/gsc-crawler-schema-inspect?token=$INSPECT_TOKEN")
          echo "SCHEMA_HTTP_STATUS=$status"
          cat reports/crawler-schema.json
          test "$status" = "200"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const schema = JSON.parse(fs.readFileSync('reports/crawler-schema.json', 'utf8'));
          if (schema.error) throw new Error(schema.error);
          const safe = {
            generatedAt: schema.generatedAt,
            migrations: schema.migrations,
            crawlerObjects: schema.crawlerObjects,
            details: schema.details,
            tableNames: schema.tableNames,
          };
          fs.writeFileSync('reports/crawler-schema-safe.json', JSON.stringify(safe, null, 2) + '\n');
          console.log(JSON.stringify(safe, null, 2));
          NODE
          rm -f reports/crawler-schema.json

      - uses: actions/upload-artifact@v4
        with:
          name: gptbot-live-crawler-schema-20260831-r2
          path: |
            reports/crawler-schema-safe.json
            reports/wrangler-preview.txt
          if-no-files-found: error
          retention-days: 7

      - name: Delete temporary preview deployment
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${PREVIEW_URL:-}" ]; then
            DEPLOY_ID=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments?env=preview&per_page=50" \
              | PREVIEW_URL="$PREVIEW_URL" node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const b=JSON.parse(d);const x=(b.result||[]).find(v=>v.url===process.env.PREVIEW_URL);process.stdout.write(x?.id||'')})")
            if [ -n "$DEPLOY_ID" ]; then
              curl --silent --show-error --request DELETE \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments/$DEPLOY_ID?force=true" >/dev/null
            fi
          fi

      - name: Remove one-shot workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ops/inspect-live-crawler-schema-20260831-r2
          git switch -C ops/inspect-live-crawler-schema-20260831-r2 origin/ops/inspect-live-crawler-schema-20260831-r2
          git config user.name "GPTBot Schema Inspection CI"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/inspect-live-crawler-schema-20260831-r2.yml
          git commit -m "chore: remove one-shot crawler schema inspection r2"
          git push origin HEAD:ops/inspect-live-crawler-schema-20260831-r2
