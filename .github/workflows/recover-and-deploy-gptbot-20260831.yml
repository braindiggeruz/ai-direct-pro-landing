name: recover-and-deploy-gptbot-20260831

on:
  push:
    branches:
      - ops/inspect-cold-locale-schema-guard-20260831
    paths:
      - .github/workflows/recover-and-deploy-gptbot-20260831.yml

permissions:
  contents: write

concurrency:
  group: gptbot-pages-production-recovery-20260831
  cancel-in-progress: false

env:
  RELEASE_SHA: e81f65e6c4757f77ed2991ef12b599d956185e55
  RELEASE_BRANCH: release/hot-traffic-production-20260831-recovered
  PROJECT: ai-direct-pro-landing
  EXPECTED_PREVIOUS_DEPLOYMENT_ID: edc0edea-a38b-4fcf-81d7-e7de9be0e0cd
  EXPECTED_PREVIOUS_COMMIT: 425dce778f9ad4482cab08dce0914706e96fcee2
  EXPECTED_PREVIOUS_ARTIFACT: a632f5f1dc0aa73d2eb1ca54691ebcb0a6bceea714044e5672b2a4fa0028f11d
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  recover-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out reviewed recovery superset
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Verify exact source lineage and recovery contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor aa2ac83d66b52f9744bef48c9d3c40ce107c1fa7 HEAD
          git merge-base --is-ancestor d629b4bcc471f6310f335af89fc8022b74b9f839 HEAD
          git merge-base --is-ancestor 9cdfff152597a43ba7b3eea89bd3abe23db760d6 HEAD
          test -f tests/lead-radar-cold-schema-sort.test.ts
          grep -F "function compareSchemaText(left: string, right: string): number" functions/platform/lead-radar/schema-contract.ts
          grep -F "function compareSchemaText(left: string, right: string): number" functions/platform/lead-radar/telegram-campaign-schema.ts
          ! grep -F "leftKey.localeCompare(rightKey)" functions/platform/lead-radar/schema-contract.ts
          ! grep -F "leftKey.localeCompare(rightKey)" functions/platform/lead-radar/telegram-campaign-schema.ts
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Verify Cloudflare credentials exist without exposing them
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::CLOUDFLARE_ACCOUNT_ID missing'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::CLOUDFLARE_API_TOKEN missing'; exit 1; }
          echo 'Cloudflare secrets present and masked.'

      - name: Prove current production is the inspected unrecoverable dirty deployment
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT" \
            > before-project.json
          node <<'NODE'
          const fs=require('node:fs');
          const body=JSON.parse(fs.readFileSync('before-project.json','utf8'));
          const d=body.result?.canonical_deployment;
          const expected={id:process.env.EXPECTED_PREVIOUS_DEPLOYMENT_ID,commit:process.env.EXPECTED_PREVIOUS_COMMIT};
          if(!body.success) throw new Error('Cloudflare project lookup failed');
          if(d?.id!==expected.id) throw new Error(`production deployment changed: ${d?.id}`);
          if(d?.environment!=='production'||d?.latest_stage?.status!=='success') throw new Error('current deployment is not confirmed successful production');
          if(d?.deployment_trigger?.metadata?.commit_hash!==expected.commit) throw new Error(`production commit changed: ${d?.deployment_trigger?.metadata?.commit_hash}`);
          const safe={id:d.id,url:d.url,environment:d.environment,status:d.latest_stage.status,commit:d.deployment_trigger.metadata.commit_hash,aliases:d.aliases??[]};
          fs.writeFileSync('before-safe.json',JSON.stringify(safe,null,2)+'\n');
          console.log('BEFORE='+JSON.stringify(safe));
          NODE
          OLD_URL=$(node -p "JSON.parse(require('fs').readFileSync('before-safe.json')).url")
          export OLD_URL
          node <<'NODE'
          const fs=require('node:fs');
          const expectedCommit=process.env.EXPECTED_PREVIOUS_COMMIT;
          const expectedArtifact=process.env.EXPECTED_PREVIOUS_ARTIFACT;
          const origins=['https://gptbot.uz',process.env.OLD_URL];
          async function manifest(origin){const r=await fetch(origin+'/gptbot-release.json?guard='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(30000)});if(!r.ok)throw new Error(`${origin} manifest HTTP ${r.status}`);return r.json()}
          for(const origin of origins){const m=await manifest(origin);if(m.commit!==expectedCommit)throw new Error(`${origin}: commit drift ${m.commit}`);if(m.artifactSha256!==expectedArtifact)throw new Error(`${origin}: artifact drift ${m.artifactSha256}`);if(m.fileCount!==870)throw new Error(`${origin}: fileCount drift`);for(const f of ['audience_directory','mobile_username_selection','bridge_pairing','sending_readiness','campaign_preflight','async_media_check'])if(!m.features?.includes(f))throw new Error(`${origin}: missing ${f}`)}
          console.log('PREVIOUS_ARTIFACT_GUARD=pass');
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          yarn install --frozen-lockfile --ignore-scripts --non-interactive
          npm --prefix apps/bormi-admin ci --ignore-scripts --no-audit --no-fund

      - name: Run complete regression SEO and security gates
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test tests/lead-radar-cold-schema-sort.test.ts
          yarn test
          yarn typecheck:lead-radar
          yarn test:lead-radar
          yarn test:pages-production
          yarn seo:audit
          yarn tsc -b
          yarn scan:secrets
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Publish immutable recovery release ref
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/${RELEASE_BRANCH} --force-with-lease || git push origin HEAD:refs/heads/${RELEASE_BRANCH}

      - name: Build and stamp exact combined production artifact
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          npm run build:production
          npx --no-install tsx scripts/release/pages-production.ts check
          node <<'NODE'
          const fs=require('node:fs');
          const m=JSON.parse(fs.readFileSync('dist/gptbot-release.json','utf8'));
          if(m.commit!==process.env.RELEASE_SHA)throw new Error('release stamp commit mismatch');
          fs.writeFileSync('candidate-safe.json',JSON.stringify({commit:m.commit,artifactSha256:m.artifactSha256,fileCount:m.fileCount,features:m.features,probes:m.probes},null,2)+'\n');
          console.log('CANDIDATE='+JSON.stringify({commit:m.commit,artifactSha256:m.artifactSha256,fileCount:m.fileCount,features:m.features}));
          NODE

      - name: Recheck production identity immediately before exceptional recovery upload
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT" > preupload-project.json
          node <<'NODE'
          const fs=require('node:fs');const b=JSON.parse(fs.readFileSync('preupload-project.json','utf8'));const d=b.result?.canonical_deployment;
          if(!b.success||d?.id!==process.env.EXPECTED_PREVIOUS_DEPLOYMENT_ID||d?.deployment_trigger?.metadata?.commit_hash!==process.env.EXPECTED_PREVIOUS_COMMIT||d?.latest_stage?.status!=='success')throw new Error('production changed after recovery verification; aborting');
          console.log('PREUPLOAD_IDENTITY_GUARD=pass');
          NODE

      - name: Exceptional recovery upload to Cloudflare Pages production
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/wrangler/bin/wrangler.js pages deploy dist \
            --project-name "$PROJECT" \
            --branch main \
            --commit-hash "$RELEASE_SHA" \
            --commit-dirty=false

      - name: Verify new canonical deployment and both serving origins
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID, token=process.env.CLOUDFLARE_API_TOKEN, project=process.env.PROJECT, sha=process.env.RELEASE_SHA;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function projectState(){const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/pages/projects/${project}`,{headers:{Authorization:`Bearer ${token}`},signal:AbortSignal.timeout(30000)});if(!r.ok)throw new Error(`project HTTP ${r.status}`);return r.json()}
          let d;
          for(let i=0;i<30;i++){const b=await projectState();const x=b.result?.canonical_deployment;if(b.success&&x?.environment==='production'&&x?.latest_stage?.status==='success'&&x?.deployment_trigger?.metadata?.commit_hash===sha){d=x;break}await sleep(5000)}
          if(!d)throw new Error('new canonical production deployment not observed');
          const safe={checkedAt:new Date().toISOString(),releaseSha:sha,deploymentId:d.id,deploymentUrl:d.url,status:d.latest_stage.status,aliases:d.aliases??[]};
          fs.writeFileSync('deployment-evidence.json',JSON.stringify(safe,null,2)+'\n');console.log('DEPLOYMENT='+JSON.stringify(safe));
          NODE
          IMMUTABLE=$(node -p "JSON.parse(require('fs').readFileSync('deployment-evidence.json')).deploymentUrl")
          export IMMUTABLE
          node <<'NODE'
          const fs=require('node:fs');
          const expected=JSON.parse(fs.readFileSync('dist/gptbot-release.json','utf8'));const sha=process.env.RELEASE_SHA;
          const origins=['https://gptbot.uz',process.env.IMMUTABLE];
          const paths=['/','/robots.txt','/sitemap.xml','/ru/internet-reklama-tashkent/','/uz/internet-reklama-toshkent/','/ru/digital-marketing-tashkent/','/ru/kontekstnaya-reklama-tashkent/','/ru/targetirovannaya-reklama-tashkent/','/ru/telegram-ads-uzbekistan/','/ru/performance-marketing-tashkent/','/ru/marketingovyi-audit-tashkent/','/uz/telegram-reklama/','/uz/smm-xizmatlari/','/uz/seo-xizmati/','/ru/seo-prodvizhenie-saytov-tashkent/'];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function get(origin,path){let last;for(let i=0;i<20;i++){try{const r=await fetch(origin+path+(path.includes('?')?'&':'?')+'release='+sha+'&n='+i,{cache:'no-store',redirect:'follow',signal:AbortSignal.timeout(30000)});last=r;if(r.ok)return r}catch(e){last=e}await sleep(5000)}if(last instanceof Response)throw new Error(`${origin}${path}: HTTP ${last.status}`);throw last}
          const checks={};
          for(const origin of origins){
            checks[origin]={};
            const mr=await get(origin,'/gptbot-release.json');const m=await mr.json();if(JSON.stringify(m)!==JSON.stringify(expected))throw new Error(`${origin}: release manifest mismatch`);checks[origin].manifest={commit:m.commit,artifactSha256:m.artifactSha256,fileCount:m.fileCount,features:m.features};
            for(const p of paths){const r=await get(origin,p);checks[origin][p]=r.status}
            const ru=await(await get(origin,'/ru/internet-reklama-tashkent/')).text();for(const x of ['/ru/kontekstnaya-reklama-tashkent/','/ru/targetirovannaya-reklama-tashkent/','/ru/telegram-ads-uzbekistan/','/ru/performance-marketing-tashkent/','/ru/marketingovyi-audit-tashkent/'])if(!ru.includes(x))throw new Error(`${origin}: RU hub missing ${x}`);
            const uz=await(await get(origin,'/uz/internet-reklama-toshkent/')).text();for(const x of ['/uz/telegram-reklama/','/uz/smm-xizmatlari/','/uz/seo-xizmati/','/uz/sayt-yaratish/','/uz/biznes-uchun-ai-bot/'])if(!uz.includes(x))throw new Error(`${origin}: UZ hub missing ${x}`);
            const sitemap=await(await get(origin,'/sitemap.xml')).text();for(const x of ['/ru/internet-reklama-tashkent/','/uz/internet-reklama-toshkent/','/ru/telegram-ads-uzbekistan/'])if(!sitemap.includes(x))throw new Error(`${origin}: sitemap missing ${x}`);
          }
          const e=JSON.parse(fs.readFileSync('deployment-evidence.json','utf8'));e.previous={deploymentId:process.env.EXPECTED_PREVIOUS_DEPLOYMENT_ID,commit:process.env.EXPECTED_PREVIOUS_COMMIT,artifactSha256:process.env.EXPECTED_PREVIOUS_ARTIFACT};e.origins=checks;e.canary='pass';fs.writeFileSync('deployment-evidence.json',JSON.stringify(e,null,2)+'\n');console.log('CANARY=pass');
          NODE

      - name: Upload sanitized deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: gptbot-recovery-production-evidence-${{ env.RELEASE_SHA }}
          path: |
            before-safe.json
            candidate-safe.json
            deployment-evidence.json
            dist/gptbot-release.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove one-shot workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ops/inspect-cold-locale-schema-guard-20260831
          git switch -C ops/inspect-cold-locale-schema-guard-20260831 origin/ops/inspect-cold-locale-schema-guard-20260831
          git config user.name "GPTBot Release CI"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/recover-and-deploy-gptbot-20260831.yml
          git commit -m "chore(release): remove guarded recovery workflow"
          git push origin HEAD:ops/inspect-cold-locale-schema-guard-20260831
