name: verify-gptbot-production-20260831

on:
  push:
    branches:
      - ops/deploy-gptbot-production-20260831-r3
    paths:
      - .github/workflows/verify-gptbot-production-20260831.yml

permissions:
  contents: write

concurrency:
  group: verify-gptbot-production-20260831
  cancel-in-progress: false

env:
  PROJECT: ai-direct-pro-landing
  EXPECTED_DEPLOYMENT_ID: 83b965f7-d6a7-4f41-a872-0d4bc5da578d
  EXPECTED_DEPLOYMENT_URL: https://83b965f7.ai-direct-pro-landing.pages.dev
  EXPECTED_COMMIT: e81f65e6c4757f77ed2991ef12b599d956185e55
  APEX_ORIGIN: https://gptbot.uz
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/deploy-gptbot-production-20260831-r3
          fetch-depth: 0

      - name: Verify exact Cloudflare production and public canaries
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          EVIDENCE_DIR="$RUNNER_TEMP/gptbot-production-verification"
          mkdir -p "$EVIDENCE_DIR"
          export EVIDENCE_DIR
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT" \
            > "$RUNNER_TEMP/project.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';

          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const body = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/project.json', 'utf8'));
          assert(body.success === true, 'Cloudflare project lookup failed');
          const project = body.result;
          const deployment = project.canonical_deployment;
          assert(deployment?.id === process.env.EXPECTED_DEPLOYMENT_ID,
            `canonical deployment changed: ${deployment?.id}`);
          assert(deployment?.url === process.env.EXPECTED_DEPLOYMENT_URL,
            `canonical deployment URL changed: ${deployment?.url}`);
          assert(deployment?.environment === 'production', 'canonical deployment is not production');
          assert(deployment?.latest_stage?.status === 'success', 'canonical deployment is not successful');
          assert(deployment?.deployment_trigger?.metadata?.commit_hash === process.env.EXPECTED_COMMIT,
            `canonical commit changed: ${deployment?.deployment_trigger?.metadata?.commit_hash}`);
          assert(deployment?.deployment_trigger?.metadata?.commit_dirty === false,
            'canonical deployment must identify a clean tracked commit');

          const production = project.deployment_configs?.production ?? {};
          const envVars = production.env_vars ?? {};
          const expectedFlags = {
            FIRST_PARTY_AUTOMATION_ENABLED: 'true',
            LEAD_RADAR_ADMISSION_ENABLED: 'true',
            LEAD_RADAR_PROCESSING_ENABLED: 'true',
            LEAD_RADAR_CONTACT_ENABLED: 'false',
            LEAD_RADAR_TELEGRAM_DISCOVERY_ENABLED: 'true',
            LEAD_RADAR_TELEGRAM_TRANSPORT_MODE: 'local_bridge',
            LEAD_RADAR_TELEGRAM_ACCOUNT_ENABLED: 'true',
            LEAD_RADAR_TELEGRAM_CAMPAIGN_ENABLED: 'true',
            LEAD_RADAR_TELEGRAM_CAMPAIGN_AUTOSEND_ENABLED: 'true',
            LEAD_RADAR_PERSONAL_RETENTION_DAYS: '30',
            LEAD_RADAR_MAX_DISPATCH_PER_TICK: '5',
            LEAD_RADAR_CONTACT_DAILY_LIMIT: '10',
            LEAD_RADAR_TELEGRAM_CAMPAIGN_DAILY_LIMIT: '30',
            LEAD_RADAR_TELEGRAM_CAMPAIGN_MIN_INTERVAL_SECONDS: '120',
          };
          for (const [name, expected] of Object.entries(expectedFlags)) {
            assert(String(envVars[name]?.value ?? '') === expected,
              `${name} differs from the reviewed production contract`);
          }
          assert(String(envVars.LEAD_RADAR_TELEGRAM_BOT_USERNAME?.value ?? '') === '',
            'Telegram campaign bot username must remain empty/hard-paused');

          const requiredBindings = [
            'GPTBOT_DRAFTS_DB',
            'LOGIN_ATTEMPTS',
            'MARKET_MEDIA',
            'LEAD_RADAR_CAMPAIGN_MEDIA',
            'LEAD_RADAR_TELEGRAM_ACCOUNT_SERVICE',
            'AUTOMATION_QUEUE',
            'AI',
          ];
          const productionJson = JSON.stringify(production);
          for (const binding of requiredBindings) {
            assert(productionJson.includes(binding), `production binding missing: ${binding}`);
          }

          async function fetchEventually(origin, pathname, options = {}, attempts = 12) {
            let lastError;
            for (let attempt = 0; attempt < attempts; attempt += 1) {
              try {
                const url = new URL(pathname, origin);
                url.searchParams.set('verify', process.env.EXPECTED_COMMIT);
                url.searchParams.set('attempt', String(attempt));
                const response = await fetch(url, {
                  cache: 'no-store',
                  signal: AbortSignal.timeout(30_000),
                  ...options,
                });
                if (response.ok || options.redirect === 'manual') return response;
                lastError = new Error(`${url.pathname} returned HTTP ${response.status}`);
              } catch (error) {
                lastError = error;
              }
              await sleep(3_000);
            }
            throw lastError ?? new Error(`${pathname} did not respond`);
          }

          async function json(origin, pathname) {
            return (await fetchEventually(origin, pathname)).json();
          }
          const immutableManifest = await json(process.env.EXPECTED_DEPLOYMENT_URL, '/gptbot-release.json');
          const apexManifest = await json(process.env.APEX_ORIGIN, '/gptbot-release.json');
          assert(JSON.stringify(immutableManifest) === JSON.stringify(apexManifest),
            'apex and immutable release manifests differ');
          assert(apexManifest.schema === 1, 'release manifest schema mismatch');
          assert(apexManifest.commit === process.env.EXPECTED_COMMIT, 'release manifest commit mismatch');
          assert(apexManifest.fileCount === 870, `unexpected release file count: ${apexManifest.fileCount}`);
          const requiredFeatures = [
            'audience_directory',
            'mobile_username_selection',
            'bridge_pairing',
            'sending_readiness',
            'campaign_preflight',
            'async_media_check',
          ];
          assert(JSON.stringify(apexManifest.features) === JSON.stringify(requiredFeatures),
            'release feature set mismatch');
          assert(Array.isArray(apexManifest.probes) && apexManifest.probes.length >= 6,
            'release probe set is incomplete');

          for (const probe of apexManifest.probes) {
            for (const origin of [process.env.EXPECTED_DEPLOYMENT_URL, process.env.APEX_ORIGIN]) {
              const response = await fetchEventually(origin, '/' + probe.path);
              const bytes = Buffer.from(await response.arrayBuffer());
              const digest = createHash('sha256').update(bytes).digest('hex');
              assert(digest === probe.sha256, `${origin}/${probe.path} hash mismatch`);
            }
          }

          const routes = [
            '/',
            '/robots.txt',
            '/sitemap.xml',
            '/ru/internet-reklama-tashkent/',
            '/uz/internet-reklama-toshkent/',
            '/ru/otzyvy/',
            '/uz/sharhlar/',
            '/ru/stoimost-chat-bota/',
            '/uz/chat-bot-narxi/',
            '/ru/ai-bot-s-crm-amocrm-bitrix24/',
            '/uz/amocrm-bitrix24-bilan-ai-bot/',
          ];
          const routeEvidence = {};
          for (const route of routes) {
            const response = await fetchEventually(process.env.APEX_ORIGIN, route);
            routeEvidence[route] = {
              status: response.status,
              contentType: response.headers.get('content-type'),
              cache: response.headers.get('cf-cache-status'),
            };
          }

          const ruAds = await (await fetchEventually(process.env.APEX_ORIGIN,
            '/ru/internet-reklama-tashkent/')).text();
          for (const marker of [
            '/ru/kontekstnaya-reklama-tashkent/',
            '/ru/targetirovannaya-reklama-tashkent/',
            '/ru/telegram-ads-uzbekistan/',
            '/ru/performance-marketing-tashkent/',
            '/ru/marketingovyi-audit-tashkent/',
          ]) assert(ruAds.includes(marker), `RU commercial hub missing ${marker}`);

          const uzAds = await (await fetchEventually(process.env.APEX_ORIGIN,
            '/uz/internet-reklama-toshkent/')).text();
          for (const marker of [
            '/uz/telegram-reklama/',
            '/uz/smm-xizmatlari/',
            '/uz/seo-xizmati/',
            '/uz/sayt-yaratish/',
            '/uz/biznes-uchun-ai-bot/',
          ]) assert(uzAds.includes(marker), `UZ commercial hub missing ${marker}`);

          const home = await (await fetchEventually(process.env.APEX_ORIGIN, '/')).text();
          assert(home.includes("gtag('event','contact_click'"), 'contact_click is absent');
          assert(home.includes("contact_method: 'telegram'"), 'contact_method is absent');
          assert(!home.includes("gtag('event','generate_lead'"),
            'public browser still emits generate_lead on a click');

          for (const route of ['/ru/otzyvy/', '/uz/sharhlar/']) {
            const text = await (await fetchEventually(process.env.APEX_ORIGIN, route)).text();
            assert(!/★★★★★|AggregateRating|\"@type\"\s*:\s*\"Review\"/.test(text),
              `${route} exposes an unverified review/rating marker`);
          }

          const sitemap = await (await fetchEventually(process.env.APEX_ORIGIN, '/sitemap.xml')).text();
          assert(sitemap.includes('/ru/internet-reklama-tashkent/'), 'RU hub missing from sitemap');
          assert(sitemap.includes('/uz/internet-reklama-toshkent/'), 'UZ hub missing from sitemap');
          const robots = await (await fetchEventually(process.env.APEX_ORIGIN, '/robots.txt')).text();
          assert(robots.includes('https://gptbot.uz/sitemap.xml'), 'robots sitemap directive missing');

          const admin = await fetchEventually(process.env.APEX_ORIGIN, '/admin/lead-radar',
            { redirect: 'manual' });
          assert([200, 301, 302, 303, 307, 308, 401].includes(admin.status),
            `Lead Radar admin returned HTTP ${admin.status}`);

          let wwwObservation;
          try {
            const response = await fetch('https://www.gptbot.uz/?verify=' + process.env.EXPECTED_COMMIT, {
              redirect: 'manual', cache: 'no-store', signal: AbortSignal.timeout(30_000),
            });
            wwwObservation = { status: response.status, location: response.headers.get('location') };
          } catch (error) {
            wwwObservation = { warning: error instanceof Error ? error.message : String(error) };
          }

          const bindingNames = {
            d1: Object.keys(production.d1_databases ?? {}).sort(),
            kv: Object.keys(production.kv_namespaces ?? {}).sort(),
            r2: Object.keys(production.r2_buckets ?? {}).sort(),
            services: Object.keys(production.services ?? {}).sort(),
            queues: Object.keys(production.queue_producers ?? {}).sort(),
            ai: Object.keys(production.ai_bindings ?? {}).sort(),
          };
          const evidence = {
            checkedAt: new Date().toISOString(),
            project: project.name,
            productionBranch: project.production_branch,
            deployment: {
              id: deployment.id,
              url: deployment.url,
              status: deployment.latest_stage.status,
              commit: deployment.deployment_trigger.metadata.commit_hash,
              commitDirty: deployment.deployment_trigger.metadata.commit_dirty,
            },
            manifest: {
              schema: apexManifest.schema,
              commit: apexManifest.commit,
              artifactSha256: apexManifest.artifactSha256,
              fileCount: apexManifest.fileCount,
              features: apexManifest.features,
              probesVerified: apexManifest.probes.length,
            },
            flags: expectedFlags,
            botUsernameState: 'empty',
            bindings: bindingNames,
            routes: routeEvidence,
            adminLeadRadarStatus: admin.status,
            wwwObservation,
            result: 'production_verified',
          };
          const output = process.env.EVIDENCE_DIR + '/production-verification.json';
          fs.writeFileSync(output, JSON.stringify(evidence, null, 2) + '\n');
          console.log('PRODUCTION_VERIFICATION=' + JSON.stringify(evidence));
          NODE

      - name: Upload sanitized production evidence
        uses: actions/upload-artifact@v4
        with:
          name: gptbot-production-verification-${{ env.EXPECTED_COMMIT }}
          path: ${{ runner.temp }}/gptbot-production-verification/production-verification.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove one-shot verification workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GPTBot Release CI"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/verify-gptbot-production-20260831.yml
          git commit -m "chore(release): remove production verification workflow"
          git push origin HEAD:ops/deploy-gptbot-production-20260831-r3
